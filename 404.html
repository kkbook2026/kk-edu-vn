<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Không tìm thấy trang - KK-EDU</title>
<style>
:root{--bg:#faf6ec;--fg:#1d2733;--navy:#142a4a;--gold:#d4af37}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a2a;--fg:#e8e4da;--navy:#d4af37}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;text-align:center}
h1{font:700 4rem/1 Georgia,serif;color:var(--navy);margin:0}p{margin:12px 0 24px}
a{display:inline-block;background:#142a4a;color:#fff;text-decoration:none;padding:10px 20px;border-radius:10px;font-weight:600;border-bottom:3px solid var(--gold)}
</style>
</head>
<body>
<main>
<h1>404</h1>
<p>Trang bạn tìm không tồn tại hoặc đã được chuyển.<br>Mọi nội dung học của KK-EDU nằm ở trang chủ.</p>
<a href="/">Về trang chủ KK-EDU</a>
<p id="r" style="font-size:.85rem;opacity:.7"></p>
</main>
<script>
/* Chuyển các đường dẫn kiểu /video, /hoc/... về định tuyến #hash của ứng dụng 1 trang */
(function(){var p=location.pathname.replace(/^\/+|\/+$/g,"");var known=/^(video|catalog|tailieu|live|thi|hoc|book|about|dash)(\/|$)/;
if(known.test(p)){document.getElementById("r").textContent="Đang chuyển hướng...";location.replace("/#"+p.replace(/\//g,"_"));}})();
</script>
</body>
</html>
