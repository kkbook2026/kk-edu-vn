<style>
/* Layout: cổng tri thức - header điều hướng cố định, nội dung 1 cột tối đa 1100px, player 2 cột desktop */
:root{
  --bg:#faf6ec; --bg2:#f2ecdc; --card:#ffffff; --fg:#1d2733; --fg2:#5b6878;
  --navy:#0f2a4a; --navy2:#16395f; --gold:#d4af37; --gold2:#b8952a;
  --line:#e3dcc8; --ok:#1e7d4f; --warn:#b26a00; --bad:#b3362b;
  --chip:#eef3f9; --shadow:0 10px 30px rgba(15,42,74,.08);
  --font-d:"Playfair Display",Georgia,serif;
  --font-b:"Be Vietnam Pro",system-ui,Segoe UI,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1a2c; --bg2:#0f2238; --card:#132a44; --fg:#edf1f7; --fg2:#9fb0c3;
  --navy:#edf1f7; --navy2:#d9e2ee; --gold:#e3c45c; --gold2:#d4af37;
  --line:#23405f; --ok:#4cc08a; --warn:#e0a94f; --bad:#e07a6e;
  --chip:#1a3350; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1a2c; --bg2:#0f2238; --card:#132a44; --fg:#edf1f7; --fg2:#9fb0c3;
  --navy:#edf1f7; --navy2:#d9e2ee; --gold:#e3c45c; --gold2:#d4af37;
  --line:#23405f; --ok:#4cc08a; --warn:#e0a94f; --bad:#e07a6e;
  --chip:#1a3350; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);margin:0;font-size:15.5px;line-height:1.6}
h1,h2,h3{font-family:var(--font-d);color:var(--navy);line-height:1.25;text-wrap:balance;margin:0 0 .5em}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.12rem}
a{color:inherit}
button{font-family:var(--font-b)}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
.hidden{display:none!important}
/* Chống tràn ngang: select/ảnh/video không vượt khung chứa (lỗi #thi tràn 1180px do tên sách dài) */
select,input,textarea{max-width:100%;min-width:0}
img,video,iframe,svg{max-width:100%}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px;cursor:pointer;user-select:none}
.brand .logo{width:108px;height:108px;flex:none;filter:drop-shadow(0 3px 9px rgba(15,42,74,.28))}
.brand b{font-family:var(--font-d);font-size:2.5rem;line-height:1.02;letter-spacing:.5px;color:var(--navy)}
.brand small{display:block;font-size:.98rem;font-weight:700;color:var(--gold2,#b8902c);letter-spacing:.07em;text-transform:uppercase;margin-top:4px;white-space:nowrap}
.brand .brandtx{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;width:max-content}
.brand .brandtx b{white-space:nowrap;display:block;line-height:1}
:root[data-theme="dark"] .brand small{color:var(--gold)}
@media(max-width:900px){ .brand .logo{width:84px;height:84px} .brand b{font-size:2rem} .brand small{font-size:.84rem} }
@media(max-width:640px){ .brand .logo{width:66px;height:66px} .brand b{font-size:1.55rem} .brand small{font-size:.66rem} }
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.main button{background:none;border:0;padding:8px 12px;border-radius:9px;color:var(--fg2);font-size:.92rem;font-weight:500;cursor:pointer}
nav.main button:hover{background:var(--chip);color:var(--fg)}
nav.main button.on{background:var(--chip);color:var(--navy);font-weight:600;box-shadow:inset 0 -2px 0 var(--gold)}
.userbox{position:relative;margin-left:auto;font-size:.85rem;color:var(--fg2)}
.userbox .ava{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex:none}
:root[data-theme="dark"] .userbox .ava, .dkava{background:var(--gold2);color:#0c1a2c}
.avabtn{display:flex;align-items:center;gap:8px;background:var(--card,#fff);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;color:var(--fg);font:inherit;font-size:.85rem}
.avabtn:hover{border-color:var(--gold2,#b8902c)}
.avabtn .caret{font-size:.7rem;color:var(--fg2)}
.avabtn .avatxt{font-weight:600}
@media(max-width:520px){ .avabtn .avatxt{display:none} }
/* Mobile header gọn: logo + tài khoản cùng 1 hàng, menu 1 hàng cuộn ngang (header sticky không chiếm quá 1/5 màn hình) */
@media(max-width:640px){
  .topbar{gap:8px;padding-block:8px}
  .brand{order:1;gap:10px} .brand .logo{width:48px;height:48px} .brand b{font-size:1.3rem} .brand small{font-size:.6rem;letter-spacing:.05em}
  .userbox{order:2}
  nav.main{order:3;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto;margin-left:0;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity;mask-image:linear-gradient(90deg,#000 92%,transparent)}
  nav.main::-webkit-scrollbar{display:none}
  nav.main button{flex:none;white-space:nowrap;padding:7px 10px;font-size:.88rem;scroll-snap-align:start}
}
.umenu{position:absolute;right:0;top:calc(100% + 8px);min-width:260px;max-width:88vw;background:var(--card,#fff);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(10,20,40,.18);padding:8px;z-index:60}
.umenu .uhead{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.umenu .uhead b{display:block;color:var(--fg)}
.umenu .uhead span{display:block;font-size:.78rem;color:var(--fg2);margin-top:2px;word-break:break-all}
.umenu .uhead .uwarn{color:#a66b00}
.umenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--fg);font:inherit;font-size:.9rem}
.umenu button:hover{background:var(--chip)}
.umenu button.upri{background:var(--navy);color:#fff;font-weight:600;margin-bottom:4px}
.umenu button.upri:hover{background:#17395f}
.umenu .unote{font-size:.76rem;color:var(--fg2);padding:8px 10px 4px;line-height:1.5;border-top:1px solid var(--line);margin-top:6px}
:root[data-theme="dark"] .umenu button.upri{background:var(--gold2);color:#0c1a2c}
#ttsBtn.on{background:var(--gold);color:#1d2733;border-color:var(--gold)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .umenu button.upri{background:var(--gold2);color:#0c1a2c} :root:not([data-theme="light"]) .userbox .ava{background:var(--gold2);color:#0c1a2c} }

/* Hero */
.hero{padding-block:40px 30px;display:grid;grid-template-columns:1.25fr .9fr;gap:30px;align-items:center}
.hero h1{font-size:2.5rem;margin-bottom:.4em}
.hero .gold{color:var(--gold2)}
:root[data-theme="dark"] .hero .gold{color:var(--gold)}
.hero p.lead{color:var(--fg2);font-size:1.05rem;max-width:34em}
.hero-art{min-width:0}
.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:108px}
.stat b{display:block;font-size:1.35rem;font-family:var(--font-d);color:var(--navy);font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--fg2)}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-block:24px}.hero h1{font-size:1.9rem}.hero-art{display:none}}

/* Cards & grid */
.grid{display:grid;gap:14px}
.grid.lv{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid.bk{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.click{cursor:pointer;transition:transform .12s,box-shadow .12s}
.card.click:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.lvicon{width:42px;height:42px;margin-bottom:8px}
.card .meta{font-size:.78rem;color:var(--fg2)}
.bkcard{display:flex;flex-direction:column;gap:6px}
.bkcard .sub{font-weight:600;color:var(--navy);line-height:1.35}
.bkcard .code{font-size:.72rem;color:var(--fg2);letter-spacing:.06em}
.badge{display:inline-block;font-size:.7rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--chip);color:var(--navy2)}
.badge.gold{background:var(--gold);color:#19233a}
.badge.ok{background:var(--ok);color:#fff}
.badge.free{background:var(--ok);color:#fff}
.badge.lock{background:var(--bad);color:#fff}
.rowline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pbar{height:7px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:99px}

/* Section titles */
.sec{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px}
.sec h2{margin:0}
.sec .more{margin-left:auto;font-size:.85rem;color:var(--fg2);background:none;border:0;cursor:pointer;text-decoration:underline}
.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);font-weight:700}
:root[data-theme="dark"] .eyebrow{color:var(--gold)}

/* Controls */
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.controls select,.controls input[type=search],.fld input,.fld select,.fld textarea{
  background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.92rem;font-family:var(--font-b)}
.controls input[type=search]{flex:1;min-width:180px}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:600;font-size:.93rem;cursor:pointer;background:var(--chip);color:var(--navy2)}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.pri,[data-theme="dark"] .btn.pri{background:var(--gold2);color:#0c1a2c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{background:var(--gold2);color:#0c1a2c}}
.btn.gold{background:var(--gold);color:#19233a}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--fg2)}
.btn.sm{padding:6px 12px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:default}

/* Book detail */
.bookhead{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;margin-top:22px}
@media(max-width:700px){.bookhead{grid-template-columns:1fr}}
.linkrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.linkrow a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.lesslist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.lessitem{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;min-width:0}
.lessitem:hover{box-shadow:var(--shadow)}
.lessitem .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--chip);color:var(--navy2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;font-variant-numeric:tabular-nums}
.lessitem.done .num{background:var(--ok);color:#fff}
.lessitem .ti{flex:1;min-width:0;font-weight:500}
.lessitem .st{font-size:.76rem;color:var(--fg2);flex:none;font-variant-numeric:tabular-nums}

/* Player */
.player{display:grid;grid-template-columns:1.6fr .9fr;gap:18px;margin-top:16px}
@media(max-width:900px){.player{grid-template-columns:1fr}}
.player.wide{grid-template-columns:1fr} /* chế độ 2x: khung video chiếm toàn bộ bề ngang, cột phụ xuống dưới */
.screenbox:fullscreen{display:flex;flex-direction:column;background:#000;border:0;border-radius:0}
.screenbox:fullscreen .screen{flex:1;aspect-ratio:auto;max-height:none}
.screenbox:-webkit-full-screen{display:flex;flex-direction:column;background:#000}
.screenbox:-webkit-full-screen .screen{flex:1;aspect-ratio:auto}
.screenbox{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.screen{position:relative;container-type:inline-size;aspect-ratio:16/9;max-width:100%;background:linear-gradient(145deg,#0f2a4a,#16395f 55%,#1d4a7a);color:#f5efdd;display:flex;flex-direction:column;overflow:hidden}
.screen video{width:100%;height:100%;object-fit:contain;background:#000}
.scene{flex:1;display:flex;flex-direction:column;justify-content:safe center;gap:10px;padding:22px 26px;min-width:0;min-height:0;overflow:auto}
.scene>*{flex-shrink:0}
.scene .phan{font-size:max(.62rem,1.05cqw);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.scene .chu{font-family:var(--font-d);font-size:max(1rem,2.5cqw);font-weight:700;color:#fff;text-wrap:balance}
.scene .hinh{font-size:max(.8rem,1.35cqw);color:#cfd9ea;font-style:italic;max-width:46em}
.scene .loi{font-size:max(.92rem,2.1cqw);color:#f5efdd;max-width:46em;border-left:3px solid var(--gold);padding-left:12px}
/* Sơ đồ/bảng biểu tự co giãn VỪA KHÍT phần còn lại của khung (không cần kéo thanh cuộn), phóng to khung là sơ đồ + chữ to theo cùng tỉ lệ */
.scene{padding:max(16px,2.6cqw) max(16px,3.2cqw);gap:max(8px,1.2cqw)}
.scene .sodo{background:#fff;border-radius:10px;padding:max(6px,1cqw);flex:1 1 0;min-height:30%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.scene .sodo svg{width:100%;height:100%;max-width:100%;max-height:100%;display:block;margin:0 auto}
/* Điện thoại: khung mô phỏng tự cao theo nội dung để sơ đồ + lời giảng không bị ép dẹt hoặc cắt chữ (video thật vẫn giữ 16:9) */
@media (max-width:760px){
  .screen:not(:has(video)){aspect-ratio:auto;min-height:56.25vw}
  .scene{padding:16px 16px 18px;gap:8px;overflow:visible}
  .scene .sodo{flex:none;min-height:0;padding:8px}
  .scene .sodo svg{height:auto}
  .scene .loi{font-size:.95rem}
}
.wm{position:absolute;pointer-events:none;opacity:.3;color:#fff;font-size:11.5px;z-index:9;text-shadow:0 0 3px #000;user-select:none;white-space:nowrap;transition:top 1.2s ease,left 1.2s ease}
.ctrls{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.ctrls .t{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--fg2);flex:none}
.seek{flex:1;position:relative;height:22px;display:flex;align-items:center;cursor:pointer;min-width:140px}
.seek .rail{position:absolute;left:0;right:0;height:6px;border-radius:99px;background:var(--bg2);border:1px solid var(--line)}
.seek .fill{position:absolute;left:0;height:6px;border-radius:99px;background:var(--gold)}
.seek .dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--navy2);top:50%;transform:translate(-50%,-50%);z-index:2}
.seek .dot.hit{background:var(--ok)}
.seek .dot.multi{width:17px;height:17px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.seek .dot.multi b{font-size:9px;line-height:1;color:#fff;font-family:var(--font-b)}
.seek .dot.part{background:linear-gradient(90deg,var(--ok) 50%,var(--navy2) 50%)}
.seek .knob{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--gold);transform:translate(-50%,-50%);z-index:3;box-shadow:0 1px 4px rgba(0,0,0,.25);pointer-events:none}
.iconbtn{border:0;background:var(--chip);color:var(--navy2);width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:18px;height:18px;fill:currentColor}
.sidepanel{display:flex;flex-direction:column;gap:14px;min-width:0}
.qlist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.qrow{display:flex;gap:8px;align-items:center;font-size:.84rem;padding:7px 10px;border-radius:9px;background:var(--bg2);cursor:pointer}
.qrow .tt{font-variant-numeric:tabular-nums;color:var(--fg2);flex:none}
.qrow .ic{flex:none;width:10px;height:10px;border-radius:50%;background:var(--line)}
.qrow.hit .ic{background:var(--ok)}
.qrow.miss .ic{background:var(--bad)}

/* Quiz modal */
.modalwrap{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);color:var(--fg);border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px;border:1px solid var(--line)}
.modal h3{margin-top:0}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.opt{border:1.5px solid var(--line);background:var(--bg2);color:var(--fg);border-radius:11px;padding:11px 14px;text-align:left;cursor:pointer;font-size:.95rem}
.opt:hover{border-color:var(--gold2)}
.opt.sel{border-color:var(--navy2);background:var(--chip)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.opt.big{font-size:1.05rem;padding:16px}
.feedback{border-radius:11px;padding:12px 14px;margin:10px 0;font-size:.92rem}
.feedback.good{background:color-mix(in srgb,var(--ok) 13%,var(--card));border:1px solid var(--ok)}
.feedback.bad{background:color-mix(in srgb,var(--bad) 11%,var(--card));border:1px solid var(--bad)}
.feedback.hint{background:color-mix(in srgb,var(--gold) 14%,var(--card));border:1px solid var(--gold2)}
.mrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ordlist{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.orditem{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
.orditem .mv{margin-left:auto;display:flex;gap:4px}
.orditem button{border:1px solid var(--line);background:var(--card);border-radius:7px;width:30px;height:28px;cursor:pointer;color:var(--fg)}
textarea.reflect,.fld textarea{width:100%;min-height:96px;resize:vertical}
.likert{display:flex;gap:6px;margin:8px 0 16px;flex-wrap:wrap}
.likert button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg2);cursor:pointer;font-weight:700;color:var(--fg)}
.likert button.sel{background:var(--gold);border-color:var(--gold2);color:#19233a}

/* Score panel */
.scorebox{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.scorebox .sc{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center}
.scorebox b{font-size:1.25rem;font-family:var(--font-d);color:var(--navy);font-variant-numeric:tabular-nums}
.scorebox span{font-size:.72rem;color:var(--fg2);display:block}
.verdict{border-radius:12px;padding:12px 16px;font-weight:600;text-align:center;margin-top:10px}
.verdict.dat{background:color-mix(in srgb,var(--ok) 15%,var(--card));color:var(--ok);border:1px solid var(--ok)}
.verdict.nc{background:color-mix(in srgb,var(--gold) 22%,var(--card));color:var(--gold2);border:1px solid var(--gold2)}
.verdict.chua{background:color-mix(in srgb,var(--warn) 14%,var(--card));color:var(--warn);border:1px solid var(--warn)}

/* Tutor */
.tutor{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.tutor .head{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;color:var(--navy)}
.tmsgs{display:flex;flex-direction:column;gap:9px;padding:12px;max-height:290px;overflow:auto;font-size:.9rem}
.tmsg{border-radius:11px;padding:9px 12px;max-width:92%;white-space:pre-wrap}
.tmsg.u{background:var(--chip);align-self:flex-end}
.tmsg.a{background:var(--bg2);align-self:flex-start}
.tin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.tchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.tchip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:5px 11px;font-size:.8rem;cursor:pointer;font-family:var(--font-b)}
.tchip:hover{border-color:var(--gold)}
.topts{display:flex;flex-direction:column;gap:6px;margin:8px 0}.topt{border-radius:10px;text-align:left}.topt.tok{background:#cfeedd;border-color:#2e9d62;color:#12402a}.topt.tbad{background:#f8d7d7;border-color:#c0392b;color:#5a1a14}
.tcite{display:inline-block;font-size:.75rem;color:var(--muted,#6b7a90);margin-top:3px}
.tq{display:block;margin-top:6px;font-style:italic;color:var(--navy)}
.tmsg a,.tmsg p{margin:0}
.rp h4{margin:14px 0 6px;color:var(--navy)}.rpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.rpgrid>div{background:var(--bg2);border-radius:10px;padding:9px;text-align:center}.rpgrid b{display:block;font-size:1.3rem;color:var(--navy)}.rpgrid span{font-size:.72rem}
.rpbar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.85rem}.rpbar span{width:90px}.rpbar i{flex:1;height:8px;border-radius:5px;background:linear-gradient(90deg,var(--gold) var(--w),var(--line) var(--w))}
.rpwrong{border-left:3px solid #c0392b;padding:6px 10px;margin:6px 0;background:var(--bg2);border-radius:6px;font-size:.88rem}
.kktab{width:100%;border-collapse:collapse;margin:8px 0;font-size:.85rem}.kktab td{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top}
.qtab{width:100%;border-collapse:collapse;font-size:.84rem}.qtab th,.qtab td{border-bottom:1px solid var(--line);padding:6px;text-align:left}.qflag{color:#c0392b;font-weight:600}.qok{color:#2e9d62;font-weight:600}
.tin input{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--fg);font-family:var(--font-b)}

/* Tables & admin */
table.tb{width:100%;border-spacing:0;font-size:.88rem}
table.tb th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fg2);padding:8px 10px;border-bottom:1px solid var(--line)}
table.tb td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:13px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld label{font-size:.8rem;font-weight:600;color:var(--fg2)}
.fld input,.fld select,.fld textarea{width:100%}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:640px){.formgrid{grid-template-columns:1fr}}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0;flex-wrap:wrap}
.tabbar button{background:none;border:0;padding:9px 14px;font-size:.9rem;color:var(--fg2);cursor:pointer;border-bottom:2.5px solid transparent;font-weight:500}
.tabbar button.on{color:var(--navy);border-bottom-color:var(--gold);font-weight:600}
.note{font-size:.84rem;color:var(--fg2)}
.alertbox{border-radius:12px;padding:12px 15px;font-size:.9rem;margin:12px 0;border:1px solid var(--gold2);background:color-mix(in srgb,var(--gold) 12%,var(--card))}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;background:#fff;border-radius:14px;border:1px solid var(--line)}
.qrbox canvas,.qrbox img,.qrbox svg{max-width:220px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv b{font-variant-numeric:tabular-nums}
body:has(#modalHost .modalwrap) .consent{display:none}
.cbox{display:flex;gap:12px;align-items:flex-start;margin:10px 0;padding:12px 14px;border:2px solid var(--gold);border-radius:12px;background:var(--bg2);cursor:pointer;font-size:.92rem;line-height:1.5;color:var(--fg)}
.cbox:hover{border-color:var(--navy)}
.cbox input[type=checkbox]{flex:none;width:24px;height:24px;margin:1px 0 0;accent-color:var(--navy,#0f2a4a);cursor:pointer}
.cbox:has(input:checked){border-color:#2e9d62;background:rgba(46,157,98,.08)}
.cbox.err{border-color:#c0392b;background:rgba(192,57,43,.08);animation:cbshake .45s}
.cberr{color:#c0392b;font-weight:600;font-size:.88rem;margin:-4px 0 8px}
.ferr{border-color:#c0392b!important;box-shadow:0 0 0 2px rgba(192,57,43,.2)}
@keyframes cbshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:99px;font-size:.9rem;z-index:120;box-shadow:var(--shadow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:var(--gold2);color:#0c1a2c}}
:root[data-theme="dark"] .toast{background:var(--gold2);color:#0c1a2c}

/* Consent */
.consent{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--gold);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));z-index:110;box-shadow:0 -10px 30px rgba(15,42,74,.12)}
.consent .in{max-width:1100px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.88rem}

footer.ft{border-top:1px solid var(--line);margin-top:56px;padding-block:26px;color:var(--fg2);font-size:.84rem}
footer.ft .in{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
footer.ft .ftv{display:flex;justify-content:flex-end;margin-top:14px;font-size:.8rem;color:var(--fg2);font-variant-numeric:tabular-nums}
footer.ft .ftv:empty{display:none}
footer.ft{padding-bottom:90px} /* chừa chỗ nút trợ giảng nổi góc phải để không che bộ đếm */
footer.ft .ftv span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--card,#fff)}
footer.ft .ftv b{color:var(--navy);font-weight:700}
:root[data-theme="dark"] footer.ft .ftv b{color:var(--gold)}
footer.ft .in span:last-child{margin-left:auto;font-style:italic}
@media(max-width:600px){footer.ft .in span:last-child{margin-left:0}}

/* ===== KK-Bot chatbot ===== */
#cbFab{position:fixed;right:18px;bottom:18px;z-index:140;width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);background:var(--navy,#0f2a4a);color:#fff;font-size:1.5rem;line-height:1;cursor:pointer;box-shadow:0 8px 24px rgba(15,42,74,.35);transition:transform .15s}
#cbFab:hover{transform:scale(1.08)}
#cbPanel{position:fixed;right:18px;bottom:84px;z-index:141;width:min(370px,calc(100vw - 24px));max-height:min(72vh,620px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(15,42,74,.3);overflow:hidden}
#cbPanel[hidden]{display:none}
.cbHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:linear-gradient(135deg,#0f2a4a,#17406e);color:#fff}
.cbHead b{font-size:.98rem}
.cbHead span{display:block;font-size:.72rem;opacity:.75;margin-top:2px}
.cbHead button{background:transparent;border:0;color:#fff;font-size:1.05rem;cursor:pointer;padding:4px 8px;border-radius:8px}
.cbHead button:hover{background:rgba(255,255,255,.14)}
.cbBody{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px;min-height:170px;background:var(--bg)}
.cbMsg{display:flex}
.cbMsg.u{justify-content:flex-end}
.cbMsg .bub{max-width:86%;padding:9px 12px;border-radius:13px;font-size:.87rem;line-height:1.5}
.cbMsg.b .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.cbMsg.u .bub{background:var(--gold);color:#1d1403;border-bottom-right-radius:4px;font-weight:600}
.cbActs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cbActs button{border:1px solid var(--gold);background:transparent;color:var(--gold2,#8a6a1f);font-size:.78rem;font-weight:700;padding:5px 10px;border-radius:999px;cursor:pointer}
.cbActs button:hover{background:var(--gold);color:#1d1403}
.cbChips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--line);background:var(--card);scrollbar-width:thin}
.cbChips button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:.76rem;padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.cbChips button:hover{border-color:var(--gold);color:var(--gold2,#8a6a1f)}
.cbIn{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card)}
.cbIn input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 11px;font-size:.87rem;min-width:0}
.cbIn input:focus{outline:2px solid var(--gold);outline-offset:-1px}
@media(max-width:600px){#cbPanel{right:8px;left:8px;width:auto;bottom:78px;max-height:68vh}#cbFab{right:12px;bottom:12px}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cbActs button{color:var(--gold)}:root:not([data-theme="light"]) .cbChips button:hover{color:var(--gold)}}
:root[data-theme="dark"] .cbActs button{color:var(--gold)}
:root[data-theme="dark"] .cbChips button:hover{color:var(--gold)}
</style>

async function countVisit(){
  const db=S.caps&&S.caps.db; const box=$("#ftVisits"); if(!db||!box||!S.fb||!S.fb.firestore) return;
  const day=new Date(Date.now()+7*3600e3).toISOString().slice(0,10); // ngày theo giờ Việt Nam
  const FV=S.fb.firestore.FieldValue;
  let first=false; try{ first=!sessionStorage.getItem("kkVisit"); sessionStorage.setItem("kkVisit",day); }catch(e){ first=false; }
  if(first&&!/bot|crawl|spider|headless|lighthouse/i.test(navigator.userAgent||"")){
    try{ await Promise.all([db.doc("stats/visits").set({n:FV.increment(1)},{merge:true}), db.doc("stats/d-"+day).set({n:FV.increment(1)},{merge:true})]); }catch(e){}
  }
  try{
    const [t,d]=await Promise.all([db.doc("stats/visits").get(),db.doc("stats/d-"+day).get()]);
    const nf=x=>Number(x||0).toLocaleString("vi-VN");
    const tot=t.exists?t.data().n:0, td=d.exists?d.data().n:0;
    if(tot) box.innerHTML=`<span title="Số lượt truy cập website (mỗi phiên trình duyệt tính 1 lượt)">👁 Lượt truy cập: <b>${nf(tot)}</b> · Hôm nay: <b>${nf(td)}</b></span>`;
  }catch(e){}
}
async function initFirebase(){
  try{
    const V="10.14.1", B="https://www.gstatic.com/firebasejs/"+V+"/";
    await loadScript(B+"firebase-app-compat.js");
    await Promise.all([loadScript(B+"firebase-auth-compat.js"), loadScript(B+"firebase-firestore-compat.js")]);
    firebase.initializeApp(FIREBASE_CONFIG);
    S.fb = firebase;
    // Bộ nhớ đệm ngoại tuyến: đọc lại dữ liệu đã có và XẾP HÀNG các lệnh ghi khi Firestore/mạng lỗi, tự đồng bộ khi có lại
    try{ await firebase.firestore().enablePersistence({synchronizeTabs:true}); }catch(e){}
    S.caps.db = firebase.firestore();
    S.mode = "firebase";
    // chờ khôi phục phiên đăng nhập đầu tiên (nếu có)
    await new Promise(res=>{ const un=firebase.auth().onAuthStateChanged(()=>{ un(); res(); }); });
    applyFbUser(firebase.auth().currentUser);
    let lastUid = S.uid;
    firebase.auth().onAuthStateChanged(async u=>{
      if((u&&u.uid)===lastUid) { applyFbUser(u); return; }
      lastUid = u&&u.uid; applyFbUser(u);
      await reloadUserData(); render();
    });
    return true;
  }catch(e){ S.mode="guest"; return false; }
}

  }
  try{
    const cs = await db.collection("content").limit(500).get();
    cs.docs.forEach(d=>{ if(d.exists) S.content[d.id]=d.data(); });
  }catch(e){}

    const cl = await db.collection("classes").limit(200).get();

  }catch(e){}
  if(S.uid){
    try{ const rg = await db.doc("regs/"+S.uid).get();
      if(rg.exists) Object.assign(S.myRegs, (rg.data()||{}).classes||{}); }catch(e){}

    /* Sổ thành viên: mỗi lần đăng nhập ghi email, tên, cách đăng nhập, ngày tạo, lần đăng nhập gần nhất (Admin xem đủ mọi tài khoản) */
    try{ const u=S.fb&&S.fb.auth&&S.fb.auth().currentUser;
      if(u){ const pr=(u.providerData&&u.providerData[0]&&u.providerData[0].providerId)||"password";
        db.doc("members/"+S.uid).set({email:u.email||"",name:(u.displayName||S.name||"").slice(0,119),provider:pr,created:u.metadata&&u.metadata.creationTime?new Date(u.metadata.creationTime).toISOString():"",last:new Date().toISOString(),verified:!!u.emailVerified}).catch(()=>{}); } }catch(e){}
    try{ const rq = await db.doc("reqs/"+S.uid).get();
      if(rq.exists) S.myReq = rq.data(); }catch(e){}
  }
  if(S.mode==="firebase" && !S.isAdmin){
    // Firestore: người thường chỉ đọc được grants của chính mình
    if(S.uid){ try{ const g=await db.doc("grants/"+S.uid).get(); if(g.exists) S.grants[S.uid]=g.data(); }catch(e){} }
  } else {
    try{
      const gr = await db.collection("grants").limit(1000).get();
      gr.docs.forEach(d=>{ if(d.exists) S.grants[d.id]=d.data(); });
    }catch(e){}
  }
  if(S.uid){
    if(S.mode!=="firebase"){
      try{
        const en = await db.collection("enroll").limit(1000).get();
        en.docs.forEach(d=>{ if(d.exists) S.enroll[d.id]=true; });
      }catch(e){}
    }
    try{

      const pg = await db.collection("data/users/"+S.uid).limit(500).get();

  let buf=null, why="";
  try{
    try{ await window.KK_API_READY; }catch(e){}
    const get=async()=>{ const tok=await u.getIdToken(); return withTimeout(fetch(window.KK_API+"/book/"+encodeURIComponent(b.code),{headers:{authorization:"Bearer "+tok},cache:"no-store"}),45000); };

    if(r.ok) buf=await r.arrayBuffer(); else if(!why) why="http "+r.status;
  }catch(e){ why="net"; }
  if(!$("#bvPages")) return;
  if(!buf){
    if(S.isAdmin){ driveFallback(); return; }
    if(why==="age"){ closeModal(); openAgeGate(b); return; }
    if(why==="profile"){ closeModal(); openProfileForm(()=>openBookViewer(b)); return; }
    say(`<div>Chưa tải được sách (mạng chập chờn).<br><br><button class="btn pri" id="bvRetry">Thử lại</button></div>`); const rb=$("#bvRetry"); if(rb) rb.onclick=()=>bvLoadPdf(b, driveId); return;
  }
  try{
    if(!window.pdfjsLib){ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"); }
    window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const doc=await window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
    if(!$("#bvPages")){ doc.destroy(); return; }
    if(ld) ld.style.display="none";
    let zoom=1; const dpr=Math.min(window.devicePixelRatio||1,2.5);
    const p1=await doc.getPage(1); const v1=p1.getViewport({scale:1});
    const slots=[];
    const layout=()=>{ const W=Math.max(200,(box.clientWidth-16)*zoom); slots.forEach(sl=>{ sl.el.style.width=W+"px"; sl.el.style.height=(W*sl.ratio)+"px"; if(sl.done&&Math.abs(sl.w-W)>2){ sl.done=false; sl.el.innerHTML=""; } }); };
    for(let i=1;i<=doc.numPages;i++){ const el=document.createElement("div"); el.style.cssText="margin:0 auto 10px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);position:relative"; el.dataset.p=i; box.appendChild(el); slots.push({el, i, ratio:v1.height/v1.width, done:false, w:0}); }
    layout();
    const render=async sl=>{ if(sl.done||sl.busy) return; sl.busy=true;
      try{ const pg=await doc.getPage(sl.i); const W=sl.el.clientWidth; const vp0=pg.getViewport({scale:1}); sl.ratio=vp0.height/vp0.width; sl.el.style.height=(W*sl.ratio)+"px";
        const vp=pg.getViewport({scale:W/vp0.width*dpr}); const cv=document.createElement("canvas"); cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height); cv.style.cssText="width:100%;height:100%;display:block";
        cv.oncontextmenu=()=>false; await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise; sl.el.innerHTML=""; sl.el.appendChild(cv); sl.done=true; sl.w=W; }catch(e){} sl.busy=false; };
    const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ const sl=slots[Number(e.target.dataset.p)-1]; if(sl) render(sl); } }),{root:box,rootMargin:"600px 0px"});
    slots.forEach(sl=>io.observe(sl.el));
    const rez=()=>{ layout(); slots.forEach(sl=>{ if(!sl.done){ const r=sl.el.getBoundingClientRect(), R=box.getBoundingClientRect(); if(r.bottom>R.top-600&&r.top<R.bottom+600) render(sl); } }); };
    const zb=(d)=>{ const top=box.scrollTop/(box.scrollHeight||1); zoom=Math.max(.6,Math.min(3,Math.round((zoom+d)*10)/10)); rez(); box.scrollTop=top*box.scrollHeight; };
    const zi=$("#bvZi"), zo=$("#bvZo"); if(zi) zi.onclick=()=>zb(.25); if(zo) zo.onclick=()=>zb(-.25);
    let rt=0; const onR=()=>{ if(!$("#bvPages")){ window.removeEventListener("resize",onR); document.removeEventListener("fullscreenchange",onR); io.disconnect(); doc.destroy(); return; } clearTimeout(rt); rt=setTimeout(rez,150); };
    window.addEventListener("resize",onR); document.addEventListener("fullscreenchange",onR);
    const mo=new MutationObserver(()=>{ if(!$("#bvPages")){ mo.disconnect(); onR(); } }); mo.observe($("#modalHost"),{childList:true});
  }catch(e){ if(S.isAdmin){ driveFallback(); return; } say(`<div>Thiết bị chưa mở được trình đọc sách.<br><br><button class="btn pri" id="bvRetry">Thử lại</button></div>`); const rb=$("#bvRetry"); if(rb) rb.onclick=()=>bvLoadPdf(b, driveId); }
}

/* ---------- Học tuần tự: xong bài trước mới mở bài sau (Cài đặt bật/tắt, mặc định BẬT) ---------- */
function seqOn(){ return S.settings.sequential!==false; }
/* Học thử: N bài đầu mỗi sách (mặc định 7 - khớp tiến độ tháng 9-10 của năm học) mở cho mọi người, không cần đăng nhập/hồ sơ/khóa tuần tự */
function trialN(){ const n=Number(S.settings&&S.settings.trialLessons); return n>0?Math.floor(n):7; }
function isTrial(i){ return Number(i||0) < trialN(); }
function seqBlocked(b, pack, i){
  if(S.isAdmin||!seqOn()||!i||isTrial(i)) return false;
  if(b.level==="Mầm non") return false; // mầm non chơi mà học, không khóa tuần tự
  const prev=pack&&pack.lessons[i-1]; if(!prev) return false;
  const pr=(S.progress[b.code]||{}).lessons||{};
  return !(pr[prev.ma]&&pr[prev.ma].done);
}
function openSeqGate(b, i){
  modal(`<div class="eyebrow">Lộ trình học tuần tự</div><h3>Hoàn thành bài ${i} trước đã nhé!</h3>
  <p class="note">KK-EDU mở khóa từng bài theo thứ tự: học xong (đạt mốc hoàn thành) bài trước thì bài sau và tài liệu tiếp theo tự mở. Cách học này giúp kiến thức nối mạch, không hổng.</p>
  <div class="mrow"><button class="btn pri" id="sqGo">Vào học bài ${i}</button><button class="btn ghost" id="sqNo">Đóng</button></div>`);
  $("#sqNo").onclick=closeModal; $("#sqGo").onclick=()=>{ closeModal(); go({name:"hoc", code:b.code, i:i-1}); };
}
function isUnlocked(code){
  const c = S.content[code]||{};
  const price = c.price!=null ? c.price : S.settings.defaultPrice||0;
  if(c.free || !price) return true;

  if(S.uid && S.enroll[S.uid+"-"+code]) return true;
  if(S.enroll["local-"+code]) return true;

function academicYear(){ return Number(S.settings.academicYear)||2026; }
function gradeFromBirthYear(y){
  y=Number(y); const AY=academicYear(); const age=AY-y;
  if(!y||y<AY-100||age<1) return null;
  if(age>=18) return {kind:"adult", label:"Người lớn - Đại học trở lên", levels:["Đại học","Thạc sĩ","Tiến sĩ"]};
  if(age>=6) return {kind:"grade", label:"Lớp "+(age-5), grade:"Lớp "+(age-5)};
  if(age===5) return {kind:"mn", label:"Mẫu giáo lớn (5-6 tuổi)", grade:"Mẫu giáo lớn"};
  if(age===4) return {kind:"mn", label:"Mẫu giáo nhỡ (4-5 tuổi)", grade:"Mẫu giáo nhỡ"};
  if(age===3) return {kind:"mn", label:"Mẫu giáo bé (3-4 tuổi)", grade:"Mẫu giáo bé"};
  return {kind:"mn", label:"Nhà trẻ (24-36 tháng)", grade:"Nhà trẻ"};
}
function myGrade(){ return S.profile?gradeFromBirthYear(S.profile.namSinh):null; }
function myExtraGrants(){
  const fromDb = (S.uid&&S.grants[S.uid]&&S.grants[S.uid].grades)||[];
  const local = (S.profile&&S.profile.extraGrades)||[];
  return fromDb.concat(local);
}
// Trả về {ok, why: "profile"|"age", granted}
function bookAllowed(b){
  if(S.isAdmin) return {ok:true};
  const g=myGrade(); if(!g) return {ok:false, why:"profile"};
  const extra=myExtraGrants();
  if(extra.includes(b.grade)||extra.includes(b.level)) return {ok:true, granted:true};
  if(g.kind==="adult") return {ok:["Đại học","Thạc sĩ","Tiến sĩ"].includes(b.level), why:"age"};
  if(g.kind==="grade") return {ok:b.grade===g.grade, why:"age"};
  return {ok:b.level==="Mầm non"&&((b.grade||"").startsWith(g.grade)||(b.grade||"").startsWith("Trẻ")), why:"age"};
}

/* ---------- Xác thực độ tuổi 3 lớp ----------
   Lớp 1: tự khai năm sinh (khóa sau khi được xác thực - đổi là mất xác thực)
   Lớp 2: dưới 16 tuổi bắt buộc cha mẹ/người giám hộ xác nhận (NĐ 13/2023)
   Lớp 3: xác thực danh tính - admin đối chiếu giấy tờ rồi bấm Xác thực (thành viên)
           hoặc cấp Mã xác thực 1 lần gắn đúng năm sinh (khách) */
function verifyState(){
  if(S.isAdmin) return {ok:true, level:"admin"};
  if(!S.profile) return {ok:false, level:null};
  const y=Number(S.profile.namSinh);
  if(S.uid){
    const g=S.grants[S.uid];
    if(g&&g.verified&&Number(g.verifiedYear)===y) return {ok:true, level:"admin_xacthuc"};
  }
  const lv=LS.get("verify", null); // khách hoặc thành viên dùng mã
  if(lv&&Number(lv.year)===y) return {ok:true, level:"ma_xacthuc"};
  return {ok:false, level:null};
}
function isVerified(){ return verifyState().ok; }
async function redeemVerifyCode(codeRaw){
  const code=(codeRaw||"").trim().toUpperCase().replace(/\s+/g,"");
  if(!code) return {ok:false, msg:"Hãy nhập mã."};
  if(!S.caps.db) return {ok:false, msg:"Không có kết nối dữ liệu - thử lại khi mở trang qua liên kết chính thức."};
  const h=await sha256(code);
  if(!h) return {ok:false, msg:"Trình duyệt không hỗ trợ."};
  try{
    const d=await S.caps.db.doc("vcodes/"+h).get();
    if(!d.exists) return {ok:false, msg:"Mã không đúng hoặc đã bị thu hồi."};
    const data=d.data()||{};
    if(data.revoked) return {ok:false, msg:"Mã này đã bị thu hồi - liên hệ quản trị để được cấp mã mới."};
    if(Number(data.namSinh)!==Number(S.profile.namSinh))
      return {ok:false, msg:"Mã này được cấp cho người sinh năm "+data.namSinh+", không khớp hồ sơ của bạn ("+S.profile.namSinh+")."};
    LS.set("verify",{year:S.profile.namSinh, code:h.slice(0,10), at:new Date().toISOString()});
    return {ok:true};
  }catch(e){ return {ok:false, msg:"Lỗi kiểm tra mã ("+(e&&e.code||"mạng")+")."}; }
}

// Cổng kiểm tra trước khi vào học: trả true nếu được phép (lessonIndex để cho học thử bài 1)
function learnGate(b, lessonIndex, pack){
  if(S.isAdmin) return true;
  if(!S.profile||!myGrade()){ openProfileForm(); return false; }
  const al=bookAllowed(b);
  if(!al.ok){ openAgeGate(b); return false; } // đúng tuổi - đúng lớp, kể cả học thử
  if(isTrial(lessonIndex)) return true; // học thử N bài đầu (đúng lớp): không cần đăng nhập/xác thực/tuần tự
  if(S.settings.requireVerify && !isVerified() && Number(lessonIndex||0)>0){ openVerifyGate(); return false; }
  if(pack && seqBlocked(b, pack, Number(lessonIndex||0))){ openSeqGate(b, Number(lessonIndex)); return false; }
  return true;
}

/* ---------- Tải gói tương tác ---------- */
/* Gói bài học lưu trong Firestore (không còn file công khai):
   packs/<mã>      = mục lục (s) + bài 1 học thử (t) - ai cũng đọc được
   packs/<mã>/c/k  = toàn bộ gói nén gzip - Firestore rules chỉ cho người có quyền đọc */
async function gunzipBytes(u8){
  if(typeof DecompressionStream==="function"){
    const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(s).text();
  }
  if(!window.pako) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js");
  return window.pako.ungzip(u8,{to:"string"});
}
function withTimeout(p,ms){ return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error("timeout"),{code:"deadline-exceeded"})),ms))]); }
function packFromMeta(meta,why){
  // Chưa đủ quyền (chưa đăng nhập / sách chưa mở khóa): chỉ có mục lục + bài 1 học thử
  const lessons=JSON.parse(meta.s||"[]").map(L=>Object.assign({_locked:true},L));
  const t=meta.t?JSON.parse(meta.t):null; if(t&&lessons.length) lessons[0]=t;
  try{ const tt=meta.tt?JSON.parse(meta.tt):null; if(Array.isArray(tt)) tt.forEach((L,k)=>{ if(L&&k<lessons.length) lessons[k]=L; }); }catch(e){}
  return {schema:meta.schema, book:meta.book, ten:meta.ten, lessons, _partial:true, _why:why||"error"};
}
/* DỰ PHÒNG khi Firestore lỗi / quá hạn mức / mất kết nối:
   Cloudflare Worker /api/pack đọc từ kho GitHub private (kk-edu-content), áp cùng chính sách quyền đọc */
async function fetchPackCF(code){
  let tok=null;
  try{ const u=S.fb&&S.fb.auth().currentUser; if(u) tok=await withTimeout(u.getIdToken(),6000); }catch(e){}
  try{ await window.KK_API_READY; }catch(e){}
  const base=window.KK_API+"/pack/"+encodeURIComponent(code);
  if(tok){
    const r=await withTimeout(fetch(base,{headers:{authorization:"Bearer "+tok}}),20000);
    if(r.ok){ const d=await r.json(); d._src="github"; return d; }
    if(r.status!==401&&r.status!==403) throw Object.assign(new Error("cf "+r.status),{code:"unavailable"});
  }
  const t=await withTimeout(fetch(base+"?mode=trial"),15000);
  if(!t.ok) throw Object.assign(new Error("cf trial "+t.status),{code:"unavailable"});
  const p=packFromMeta(await t.json(), "permission-denied"); p._src="github"; return p;
}
async function fetchPackFS(code){
  const db=S.caps.db; let meta;
  try{
    const m=await withTimeout(db.doc("packs/"+code).get(),8000);
    if(!m.exists) return await fetchPackCF(code);
    meta=m.data()||{};
  }catch(e){ return await fetchPackCF(code); }
  try{
    const snaps=await withTimeout(Promise.all(Array.from({length:meta.nc||1},(_,k)=>db.doc("packs/"+code+"/c/"+k).get())),15000);
    if(snaps.some(s=>!s.exists)) throw Object.assign(new Error("missing"),{code:"not-found"});
    const parts=snaps.map(s=>s.data().z.toUint8Array());
    const u=new Uint8Array(parts.reduce((a,p)=>a+p.length,0)); let o=0; parts.forEach(p=>{ u.set(p,o); o+=p.length; });
    return JSON.parse(await gunzipBytes(u));
  }catch(e){
    if(e&&e.code==="permission-denied"){
      // bài học thử (tt) chưa có trong Firestore -> lấy bản học thử 7 bài từ kho dự phòng qua Worker
      if(!meta.tt){ try{ return await fetchPackCF(code); }catch(e3){} }
      return packFromMeta(meta,"permission-denied");
    }
    try{ return await fetchPackCF(code); }catch(e2){ return packFromMeta(meta,(e&&e.code)||"error"); }
  }
}
async function loadPack(code){
  if(S.goiCache[code]) return S.goiCache[code];
  if(!GOI_SET.has(code)) return null;
  if(S.packLoading[code]) return S.packLoading[code];
  S.packLoading[code] = (async()=>{
    if(S.capsReady) await S.capsReady;
    if(S.mode==="firebase"&&S.caps.db) return fetchPackFS(code);
    const r=await fetch("goi/GOI_"+code+".json"); if(!r.ok) throw new Error(r.status); return r.json();
  })().then(d=>{ if(d) S.goiCache[code]=d; delete S.packLoading[code]; return d; })
    .catch(e=>{ delete S.packLoading[code]; return null; });
  return S.packLoading[code];
}

/* ---------- MÃ QR TRONG SÁCH: "KK-EDU|<mã bài>|<mã video>" hoặc link ?bai=<mã bài> -> mở đúng bài (qua đủ cổng tuổi/lớp/học thử) ---------- */
function kkQRParse(txt){
  txt=String(txt||"").trim(); if(!txt) return null;
  let m=txt.match(/[?&#]bai=([A-Za-z0-9.\-]+)/); if(m) txt=m[1];
  m=txt.match(/#hoc_(.+)_(\d+)$/); if(m) return {code:m[1], i:Number(m[2])};
  const parts=txt.split("|").map(x=>x.trim()).filter(Boolean);
  for(const t of parts.length>1?parts.slice(1).concat(parts):parts){
    let k=t.toUpperCase().match(/^([A-Z0-9][A-Z0-9-]*?)\.C\d+\.B(\d+)$/);
    if(k&&CATALOG.find(b=>b.code===k[1])) return {code:k[1], i:Math.max(0,Number(k[2])-1)};
    k=t.toUpperCase().match(/^V-([A-Z0-9][A-Z0-9-]*?)-(\d+)$/);
    if(k&&CATALOG.find(b=>b.code===k[1])) return {code:k[1], i:Math.max(0,Number(k[2])-1)};
  }
  return null;
}
function qrOpenLesson(txt){
  const q=kkQRParse(txt);
  if(!q){ toast("Mã không phải mã bài học KK-EDU"); return false; }
  const b=CATALOG.find(x=>x.code===q.code);
  if(b&&b.lessons&&q.i>=b.lessons){ toast("Sách "+b.code+" không có bài "+(q.i+1)); return false; }
  closeModal(); go({name:"hoc", code:q.code, i:q.i}); return true;
}
function openQRScan(){
  modal(`<div class="eyebrow">Mã QR trong sách</div><h3>📷 Quét mã bài học</h3>
  <p class="note">Đưa mã QR in cạnh bảng "Học cùng video tương tác" vào khung hình. Hệ thống mở đúng bài; quyền xem vẫn theo đúng lớp/độ tuổi của bạn.</p>
  <div id="qsBox" style="position:relative;background:#111;border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-height:52vh;display:none">
    <video id="qsVid" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
    <div style="position:absolute;inset:18%;border:3px solid rgba(255,214,102,.9);border-radius:14px;pointer-events:none"></div></div>
  <div class="note" id="qsMsg" style="margin:8px 0"></div>
  <div class="mrow" style="flex-wrap:wrap;gap:8px">

  <div class="mrow" style="margin-top:10px;gap:8px"><input type="text" id="qsTxt" placeholder="Hoặc nhập mã bài, ví dụ NC-MN.C01.B003 hoặc V-NC-MN-003" style="flex:1;min-width:0">
    <button class="btn" id="qsGo">Mở bài</button></div>
  <div class="mrow"><button class="btn ghost" id="qsClose">Đóng</button></div>`);
  let stream=null, raf=0, alive=true, det=null;
  const msg=t=>{ const e=$("#qsMsg"); if(e) e.textContent=t; };
  const stop=()=>{ alive=false; cancelAnimationFrame(raf); try{ stream&&stream.getTracks().forEach(t=>t.stop()); }catch(e){} };
  const done=txt=>{ if(kkQRParse(txt)){ stop(); qrOpenLesson(txt); return true; } msg("Đã đọc được mã nhưng không phải mã bài học KK-EDU: "+String(txt).slice(0,60)); return false; };
  const host=$("#modalHost");
  const obs=new MutationObserver(()=>{ if(!$("#qsBox")){ stop(); obs.disconnect(); } }); obs.observe(host,{childList:true});
  $("#qsClose").onclick=()=>{ stop(); closeModal(); };
  $("#qsGo").onclick=()=>{ const t=$("#qsTxt").value; if(!qrOpenLesson(t)) msg("Không nhận ra mã. Mã bài có dạng NC-MN.C01.B003."); };
  $("#qsTxt").onkeydown=e=>{ if(e.key==="Enter") $("#qsGo").click(); };
  async function decoder(){
    if(det) return det;
    if("BarcodeDetector" in window){ try{ const f=await BarcodeDetector.getSupportedFormats(); if(f.includes("qr_code")){ const bd=new BarcodeDetector({formats:["qr_code"]}); det=async src=>{ const r=await bd.detect(src); return r[0]&&r[0].rawValue; }; return det; } }catch(e){} }
    if(!window.jsQR) await loadScript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js");
    const cv=document.createElement("canvas"), cx=cv.getContext("2d",{willReadFrequently:true});
    det=async src=>{ const w=src.videoWidth||src.naturalWidth||src.width, h=src.videoHeight||src.naturalHeight||src.height; if(!w||!h) return null;
      const sc=Math.min(1,960/Math.max(w,h)); cv.width=Math.round(w*sc); cv.height=Math.round(h*sc); cx.drawImage(src,0,0,cv.width,cv.height);
      const d=cx.getImageData(0,0,cv.width,cv.height); const r=window.jsQR(d.data,cv.width,cv.height,{inversionAttempts:"attemptBoth"}); return r&&r.data; };

      let busy=false, last=0;
      const tick=async ts=>{ if(!alive) return; raf=requestAnimationFrame(tick); if(busy||ts-last<250) return; last=ts; busy=true;
        try{ const t=await dec(vd); if(t&&done(t)) return; }catch(e){} busy=false; };
      raf=requestAnimationFrame(tick);
    }catch(e){ msg(e&&e.name==="NotAllowedError"?"Bạn chưa cho phép dùng camera. Bấm biểu tượng ổ khóa trên thanh địa chỉ để cho phép, hoặc dùng Chọn ảnh chụp mã.":"Không mở được camera - hãy dùng nút Chọn ảnh chụp mã."); }
  };
  $("#qsFile").onchange=async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return; msg("Đang đọc ảnh...");
    try{ const img=new Image(); img.src=URL.createObjectURL(f); await img.decode(); const dec=await decoder(); const t=await dec(img); URL.revokeObjectURL(img.src);
      if(!t){ msg("Không thấy mã QR trong ảnh. Chụp gần hơn, đủ sáng, mã nằm trọn trong ảnh."); return; } done(t);
    }catch(err){ msg("Không đọc được ảnh này."); }
  };
}
function parseHash(){
  try{ const qb=new URLSearchParams(location.search).get("bai"); if(qb){ const q=kkQRParse("?bai="+qb);
    const u=new URLSearchParams(location.search); u.delete("bai"); const qs=u.toString();
    if(q){ history.replaceState(null,"",location.pathname+(qs?"?"+qs:"")+"#hoc_"+q.code+"_"+q.i); return {name:"hoc", code:q.code, i:q.i}; } } }catch(e){}
  const h = (location.hash||"").replace(/^#/,""); if(!h) return {name:"home"};
  if(/^bai=/.test(h)){ const q=kkQRParse("#"+h); if(q) return {name:"hoc", code:q.code, i:q.i}; }
  const p = h.split("_");
  if(p[0]==="book" && p[1]) return {name:"book", code:p.slice(1).join("_")};
  if(p[0]==="hoc" && p.length>=3){ const i=Number(p[p.length-1]); return {name:"hoc", code:p.slice(1,-1).join("_"), i:isNaN(i)?0:i}; }
  if(p[0]==="catalog") return {name:"video"};
  if(["video","tailieu","live","dash","admin","about","thi"].includes(p[0])) return {name:p[0]};
  return {name:"home"};
}

    if(t<1.6){ o("hdPlay",1); o("hdBoard",0); o("hdQ",0); o("hdOK",0); chipOn(-1); if(cap) cap.textContent="▶ Video bài giảng đang phát..."; set("hdA1","fill","#faf6ec"); }
    else if(t<4.2){ o("hdPlay",0); o("hdBoard",1); chipOn(1); if(cap) cap.textContent="▶ Sơ đồ chuẩn hiện đúng lúc trong bài giảng";
      o("hdArrow", t>2.4?1:0); o("hdSum", t>2.4?1:0); o("hdSumT", t>2.4?1:0); }
    else if(t<5.8){ o("hdQ",1); chipOn(0); if(cap) cap.textContent="⏸ Video tự dừng đúng giây - hỏi đúng lúc"; }
    else if(t<7.4){ set("hdA1","fill","#7ad48a"); o("hdOK",1); if(cap) cap.textContent="✓ Chọn đúng - cộng điểm, gợi ý 2 mức nếu sai"; }
    else if(t<9.6){ o("hdQ",0); o("hdOK",0); chipOn(2); if(cap) cap.textContent="▶ Học tiếp - cuối bài có kiểm tra thành thạo"; }
    else if(t<11){ chipOn(3); if(cap) cap.textContent="🔊 Giọng đọc AI + Trợ giảng giải đáp theo bài"; }
    else { if(cap) cap.textContent="Điểm bài học: Video 40% · Thành thạo 40% · Tự luận 20%"; }
  },100);
}

/* ---------- Bộ lọc lớp / độ tuổi / chương trình dùng chung cho MỌI cấp (Video Online + Kho tài liệu) ---------- */
function gradeSelectHTML(f,id){
  const lv=f.level, isMN=lv==="Mầm non", isHigher=["Đại học","Thạc sĩ","Tiến sĩ"].includes(lv);
  const head=!lv?"Mọi lớp / độ tuổi / chương trình":isMN?"Mọi độ tuổi":isHigher?"Mọi chương trình đào tạo":"Mọi lớp";
  const groups=LEVELS.filter(L=>!lv||L.key===lv).map(L=>{
    const gs=[...new Set(CATALOG.filter(b=>b.level===L.key).map(b=>b.grade).filter(Boolean))].sort((a,b)=>gradeOrder(a)-gradeOrder(b)||a.localeCompare(b,"vi"));
    const opts=gs.map(g=>`<option ${f.grade===g?"selected":""} value="${esc(g)}">${esc(g)}</option>`).join("");
    return lv?opts:`<optgroup label="${esc(L.icon+" "+L.short)}">${opts}</optgroup>`;
  }).join("");
  return `<select id="${id}" aria-label="Lọc theo lớp / độ tuổi / chương trình"><option value="">${head}</option>${groups}</select>`;
}

const tlFilter={level:"",grade:"",q:"",mine:false};

  const f=tlFilter;

  list=list.slice().sort((a,b)=>(LEVELS.findIndex(l=>l.key===a.level)-LEVELS.findIndex(l=>l.key===b.level))||(gradeOrder(a.grade)-gradeOrder(b.grade))||a.subject.localeCompare(b.subject,"vi"));
  const nLinked=CATALOG.filter(b=>{const c=S.content[b.code]||{};return sachIdOf(b.code)||c.sachUrl||c.scriptUrl;}).length;
  v.innerHTML=`
  <div class="sec" style="margin-top:26px"><div><div class="eyebrow">Phân hệ 1 · Kho tài liệu</div><h2 style="margin:0">Sách và kịch bản video · ${list.length} đầu sách</h2></div></div>
  <p class="note" style="max-width:46em">Mỗi đầu sách gồm <b>Sách PDF (Bộ A)</b> và <b>Kịch bản video có minh họa (Bộ B)</b>. Sách PDF mở ngay trong trình đọc bảo vệ (chỉ xem, không tải); mỗi học viên xem tài liệu <b>đúng lớp theo năm sinh</b>, lớp khác bấm để gửi yêu cầu Quản trị viên.${nLinked?"":" <b>Quản trị viên chưa gắn link</b> - vào Quản trị → Nội dung để dán link chia sẻ."}</p>
  <div class="controls">
    <select id="tlLevel"><option value="">Mọi cấp học</option>${LEVELS.map(L=>`<option ${f.level===L.key?"selected":""} value="${esc(L.key)}">${esc(L.short)}</option>`).join("")}</select>
    ${gradeSelectHTML(f,"tlGrade")}
    <input type="search" id="tlQ" placeholder="Tìm môn học, mã sách..." value="${esc(f.q)}">
    ${mineBtnHTML(f,"tlMine")}
    <button class="btn sm ghost" id="tlQR" title="Quét mã QR in trong sách để mở đúng bài">📷 Quét mã QR</button>
  </div>
  <div class="tbwrap"><table class="tb"><thead><tr><th>Tài liệu</th><th>Cấp / Lớp</th><th>Quy mô</th><th>Mở tài liệu</th></tr></thead><tbody>
  ${list.map(b=>{const c=S.content[b.code]||{}; const lk=!S.isAdmin&&myGrade()&&!bookAllowed(b).ok;
    const btns=[
      sachIdOf(b.code)?`<button class="btn sm" data-pdf="${esc(b.code)}">📖 Sách PDF${lk?" 🔒":""}</button>`:"",
      c.scriptUrl?`<button class="btn sm" data-kb="${esc(b.code)}">🎬 Kịch bản${lk?" 🔒":""}</button>`:"",
      `<button class="btn sm ghost" data-code="${esc(b.code)}">Trang sách →</button>`
    ].filter(Boolean).join(" ");
    return `<tr><td><b>${esc(b.subject)}</b>${b.type==="NC"?' <span class="badge gold">NC</span>':""}<br><span class="note">${esc(b.code)}</span></td>

function regKey(){ return "myregs"; }
function isRegistered(id){ return !!(S.myRegs&&S.myRegs[id]); }
async function registerClass(cls){
  S.myRegs=S.myRegs||{}; S.myRegs[cls.id]=new Date().toISOString();
  LS.set(regKey(), S.myRegs);
  if(S.caps.db&&S.uid){
    try{
      const ref=S.caps.db.doc("regs/"+S.uid);
      const cur=await ref.get(); const data=cur.exists?JSON.parse(JSON.stringify(cur.data())):{};
      data.name=S.name; data.classes=data.classes||{}; data.classes[cls.id]=S.myRegs[cls.id];
      await ref.set(data);
    }catch(e){}
  }
  toast("Đã đăng ký lớp: "+cls.ten);
}
function fmtClassTime(iso, phut){
  try{ const d=new Date(iso);
    const s=new Intl.DateTimeFormat("vi-VN",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",timeZone:LOCALE.tz}).format(d);
    return s+(phut?` · ${phut} phút`:""); }catch(e){ return iso; }
}
function viewLive(v){
  const now=Date.now();
  const list=(S.classes||[]).filter(c=>c.active!==false).slice().sort((a,b)=>(a.start||"").localeCompare(b.start||""));
  const up=list.filter(c=>!c.start||new Date(c.start).getTime()>now-3*3600e3);
  const past=list.filter(c=>c.start&&new Date(c.start).getTime()<=now-3*3600e3);
  const card=c=>{
    const t=c.start?new Date(c.start).getTime():0;
    const soon=t&&Math.abs(t-now)<45*60e3;
    const reg=isRegistered(c.id);
    return `<div class="card">
      <div class="rowline"><span class="badge">${esc(c.cap||"Mọi cấp")}</span><span class="badge gold">${esc(c.mon||"")}</span>${soon?'<span class="badge ok">Sắp vào lớp</span>':""}</div>
      <h3 style="margin:.4em 0 .2em">${esc(c.ten)}</h3>
      <div class="meta">👨‍🏫 ${esc(c.gv||"Giáo viên KK-EDU")} · 🕐 ${c.start?fmtClassTime(c.start,c.phut):"Lịch linh hoạt"}</div>
      ${c.mota?`<div class="note" style="margin-top:6px">${esc(c.mota)}</div>`:""}
      <div class="rowline" style="margin-top:12px">
        ${reg?'<span class="badge ok">✓ Đã đăng ký</span>':`<button class="btn pri sm regBtn" data-id="${esc(c.id)}">Đăng ký chỗ</button>`}
        ${c.link?`<a class="btn ${soon?"gold":"ghost"} sm" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(c.link)}">▶ Vào lớp (${c.link.includes("meet.google")?"Google Meet":c.link.includes("zoom")?"Zoom":"trực tuyến"})</a>`:'<span class="note">Link lớp sẽ hiện trước giờ học</span>'}
      </div>
    </div>`;
  };
  v.innerHTML=`
  <div class="sec" style="margin-top:26px"><div><div class="eyebrow">Phân hệ 3 · Giáo viên dạy Online</div><h2 style="margin:0">Lớp học trực tuyến</h2></div></div>
  <p class="note" style="max-width:46em">Học trực tiếp với giáo viên qua Google Meet / Zoom. Đăng ký chỗ để giữ suất và nhận nhắc lịch; đến giờ học bấm "Vào lớp". Kết hợp với Video Online: xem bài giảng tương tác trước, vào lớp để được chữa bài và hỏi đáp sâu.</p>
  ${up.length?`<div class="grid lv" style="grid-template-columns:repeat(auto-fill,minmax(310px,1fr))">${up.map(card).join("")}</div>`
    :`<div class="card"><h3>Chưa có lớp nào được mở</h3><div class="note">${S.isAdmin?"Vào Quản trị → Lớp Online để tạo lớp đầu tiên (tên lớp, giáo viên, lịch, link Meet/Zoom).":"Lịch lớp sẽ được cập nhật tại đây. Trong lúc chờ, bạn có thể học Video Online - bài 1 của mọi sách đều miễn phí."}</div>
    <div style="margin-top:12px"><button class="btn pri" id="lvGo">${S.isAdmin?"Mở trang Quản trị":"Vào học Video Online"}</button></div></div>`}
  ${past.length?`<div class="sec"><h2>Lớp đã diễn ra</h2></div><div class="grid lv" style="grid-template-columns:repeat(auto-fill,minmax(310px,1fr))">${past.slice(-6).map(card).join("")}</div>`:""}`;
  const g=$("#lvGo"); if(g) g.onclick=()=>go({name:S.isAdmin?"admin":"video"});
  v.querySelectorAll(".regBtn").forEach(b=>b.onclick=async()=>{ const c=list.find(x=>x.id===b.dataset.id); if(c){ await registerClass(c); viewLive(v); } });
}

<script>
"use strict";
/* =====================================================================
   KK-TRỢ GIẢNG v1 - trợ giảng chạy NGAY TRONG TRÌNH DUYỆT (không cần máy chủ AI)
   - Truy hồi có trích dẫn: BM25 + bigram trên lời giảng, mục tiêu, sơ đồ, giải thích đáp án
   - Hiểu ý định: định nghĩa / vì sao / ví dụ / tóm tắt / mục tiêu / đoạn đang xem / luyện tập / tiến độ
   - Sư phạm: gợi mở trước, không lộ đáp án câu chưa làm, luôn có nút "nghe lại đúng đoạn"
   - KK-CHẤM: chấm sơ bộ tự luận theo rubric (kiến thức - lập luận - diễn đạt) có giải thích
   - KK-BÁO CÁO: báo cáo học tập từng bài + dữ liệu ẩn danh cho bảng chất lượng dạy-học của Admin
   ===================================================================== */
const TG=(()=>{
  const strip=s=>String(s==null?"":s).toLowerCase().replace(/∈/g," thuoc ").replace(/∉/g," khong thuoc ").replace(/⊂/g," tap con ").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");
  const STOP=new Set("la va cua co cho the nao gi nhu nay do duoc em minh ban hay khong trong mot cac nhung de o thi se den voi tu bai hoc a oi nhe nha vay sao khi neu thay ay kia day dau roi con cung rat qua ma hoac tren duoi ve boi bang theo nen lai da dang sap xin cam on vi tai the nhi ha ah u".split(" "));
  const QSTOP=new Set("du bao nhieu giai thich dinh nghia khai niem tom tat cach lam buoc minh hoa vd tinh ra sao gi nao the".split(" "));
  const toks=s=>strip(s).replace(/[^a-z0-9]+/g," ").trim().split(" ").filter(Boolean);
  const content=s=>{ const a=toks(s).filter(t=>!STOP.has(t)&&(t.length>1||/\d/.test(t))); const w=a.filter(t=>!/^\d$/.test(t)); return w.length>=2?w:a; };
  const bigrams=a=>{ const r=[]; for(let i=0;i<a.length-1;i++) r.push(a[i]+"_"+a[i+1]); return r; };
  const sents=t=>String(t||"").split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(x=>x.length>3);
  const PH={HOOK:"Mở đầu",OBJECTIVE:"Mục tiêu",CORE:"Nội dung chính",PRACTICE:"Luyện tập",ACTION:"Vận dụng",SUMMARY:"Tóm tắt"};
  const fmt=t=>{ t=Math.max(0,Math.round(t||0)); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); };
  const cache={};
  /* ---------- chỉ mục ---------- */
  function build(L){
    if(cache[L.ma]) return cache[L.ma];
    const ps=[];
    const add=(type,text,m)=>{ text=String(text||"").trim(); if(text.length<4) return; const c=content(text); ps.push(Object.assign({type,text,c,bi:new Set(bigrams(c)),n:c.length||1},m||{})); };
    (L.muc_tieu||[]).forEach((x,i)=>add("muc_tieu",x,{label:"Mục tiêu "+(i+1),t0:null}));
    (L.storyboard||[]).forEach(s=>(s.khung||[]).forEach(k=>{
      const txt=k.loi;
      add("giang",txt,{scr:k.chu_man_hinh||"",label:(PH[s.phan]||s.phan)+" "+fmt(s.t0)+"-"+fmt(s.t1),t0:s.t0,t1:s.t1,phan:s.phan,sid:s.id});
    }));
    (L.so_do||[]).forEach(s=>add("so_do",(s.ten?s.ten+". ":"")+(s.alt||""),{label:"Sơ đồ: "+(s.ten||s.id),t0:null}));
    const qs=[...(L.tuong_tac.diem||[]),...(L.tuong_tac.ngan_hang||[])];
    qs.forEach(q=>{ if(q.giai_thich) add("giai_thich",q.giai_thich,{label:"Giải thích câu hỏi",t0:q.quay_lai_t!=null?q.quay_lai_t:null,qid:q.id}); });
    const df={}; ps.forEach(p=>{ new Set(p.c.concat([...p.bi])).forEach(t=>df[t]=(df[t]||0)+1); });
    const N=ps.length||1, avg=ps.reduce((a,p)=>a+p.n,0)/N||1;
    const idf=t=>Math.log(1+(N-(df[t]||0)+.5)/((df[t]||0)+.5));
    const vocab=new Set(); ps.forEach(p=>p.c.forEach(t=>vocab.add(t))); toks(L.bai).forEach(t=>vocab.add(t));

  /* ---------- ý định ---------- */
  function intent(q){

    if(has(/\b(cam on|thanks|thank)\b/)&&s.split(" ").length<=6) return "thanks";
    if(has(/\b(tom tat|tong ket|noi dung chinh|bai nay noi ve|bai nay hoc gi|hoc gi trong bai)\b/)) return "summary";
    if(has(/\b(muc tieu|hoc xong .* gi|can dat|yeu cau can dat)\b/)) return "objectives";
    if(has(/\b(doan nay|doan dang xem|dang xem|vua roi|canh nay|giai thich lai doan|doan vua)\b/)) return "current";
    if(has(/\b(luyen tap|cho em .*(cau|bai) (hoi|tap)|cau hoi on|kiem tra em|ra de|quiz|thu suc|tu kiem tra|cho .* cau hoi)\b/)) return "practice";
    if(has(/\b(diem cua em|ket qua|em dat|tien do|em (dang )?yeu|yeu cho nao|em sai|nen on|can on|on tap|danh gia em|em hoc the nao)\b/)) return "status";
    if(has(/\b(o dau|doan nao|phut may|nghe lai|xem lai|tua toi|noi o dau)\b/)) return "where";
    if(has(/\b(vi du|minh hoa|vd)\b/)) return "example";

  /* ---------- tạo câu hỏi điền khuyết từ lời giảng (khi chưa được xem đáp án ngân hàng) ---------- */
  function cloze(ix,seed){
    const ALPHA=/^[\p{L}]+$/u; const cand=[];
    const terms=ix.terms.filter(t=>!t.includes("_")&&t.length>=3&&/^[a-z]+$/.test(t)).slice(0,30);
    const src=ix.ps.filter(p=>p.type==="giang"&&(p.phan==="CORE"||p.phan==="SUMMARY"||p.phan==="PRACTICE")).concat(ix.ps.filter(p=>p.type==="giai_thich"&&okp(ix,p)));

      if(s.length<40||s.length>170||/^\(màn hình/.test(s)) return;
      const w=s.split(/\s+/);
      for(const t of terms){ const k=w.findIndex(x=>strip(x).replace(/[^a-z0-9]/g,"")===t&&ALPHA.test(x.replace(/[.,;:!?]+$/,""))); if(k>1&&k<w.length-1){ cand.push({s,w,k,t,p}); break; } }
    }));

    const c=cand[((seed||0)%cand.length+cand.length)%cand.length];
    const ans=c.w[c.k].replace(/[.,;:!?]+$/,"");
    const all=ix.ps.map(p=>p.text).join(" ").split(/\s+/).map(x=>x.replace(/[.,;:!?()“”"]+/g,"")).filter(x=>ALPHA.test(x)&&x.length>=3);

  /* ---------- KK-CHẤM: tự luận ---------- */
  function scoreEssay(text,q,ix){
    const L=ix.L, T=String(text||"").trim();

    const tset=new Set(content(T)); const bset=new Set(bigrams(content(T)));
    const key=ix.terms.filter(t=>!t.includes("_")).slice(0,10);
    const objBi=new Set(bigrams(content((L.muc_tieu||[]).join(". ")))); ix.terms.filter(t=>t.includes("_")).slice(0,16).forEach(t=>objBi.add(t));

    const qcov=qk.length?qk.filter(t=>tset.has(t)).length/qk.length:0;
    const kScore=Math.min(1, hitBi.length*.2 + qcov*.4 + cov*.45);
    const lessonSents=ix.ps.filter(p=>p.type==="giang"||p.type==="muc_tieu").flatMap(p=>sents(p.text)).map(s=>new Set(content(s)));

      [`${ss.length} câu, ${words} từ.`,(words<25?"Viết đủ 3-5 câu để ý rõ ràng hơn.":(copyRatio>.5?"Hãy diễn đạt bằng lời của em thay vì chép lời giảng.":offTopic?"Câu văn ổn nhưng nội dung lạc đề.":lv[2]>=3?"Diễn đạt rõ ràng, mạch lạc.":"Chia thành câu ngắn, mở đầu viết hoa, kết thúc bằng dấu chấm."))]
    ];

    const total=lv.reduce((a,x,i)=>a+((rb[i]?rb[i].trong_so:[.4,.35,.25][i])*((x-1)/3)),0);
    return {levels:lv,notes:notes.map((n,i)=>({tc:nm(i),a:n[0],b:n[1]})),total,copyRatio,words,sentences:ss.length,cov};
  }
  /* ---------- KK-BÁO CÁO ---------- */
  const BL={nho:"Nhớ",hieu:"Hiểu",vandung:"Vận dụng",phantich:"Phân tích",danhgia:"Đánh giá"};
  function analyse(L,st){
    const T=L.tuong_tac, qs=[...(T.diem||[]).filter(q=>["mcq","tf","num","order"].includes(q.loai)),...(T.ngan_hang||[]).filter(q=>["mcq","tf","num","order"].includes(q.loai))];
    const an=st.answers||{}; const rows=qs.map(q=>{ const a=an[q.id]; return {q,a,done:!!(a&&a.done),first:!!(a&&a.correct&&a.attempts===1&&!a.hint),correct:!!(a&&a.correct),hint:a?a.hint||0:0,att:a?a.attempts||0:0}; });
    const done=rows.filter(r=>r.done);
    const by={}; done.forEach(r=>{ const b=r.q.bloom||"hieu"; (by[b]=by[b]||{n:0,ok:0,first:0}); by[b].n++; if(r.correct) by[b].ok++; if(r.first) by[b].first++; });
    const acc=done.length?done.filter(r=>r.correct).length/done.length:null;
    const firstRate=done.length?done.filter(r=>r.first).length/done.length:null;
    const hintRate=done.length?done.filter(r=>r.hint>0).length/done.length:null;
    const exp=done.filter(r=>r.q.p_ky_vong!=null); const expAcc=exp.length?exp.reduce((a,r)=>a+r.q.p_ky_vong,0)/exp.length:null;
    const actAcc=exp.length?exp.filter(r=>r.correct).length/exp.length:null;
    const wrong=done.filter(r=>!r.correct);
    const struggled=done.filter(r=>r.correct&&r.att>1);
    let idx=null; if(acc!=null){ const indep=1-(hintRate||0); const pers=Math.min(1,done.length/Math.max(1,rows.length)); const refl=st.essay!=null?st.essay:null; idx=Math.round(100*(.55*acc+.15*(firstRate||0)+.15*indep+.15*(refl!=null?refl:pers))); }
    return {rows,done,by,acc,firstRate,hintRate,expAcc,actAcc,wrong,struggled,idx,total:rows.length};
  }
  function reportHTML(L,st,ix){
    const a=analyse(L,st); const pct=x=>x==null?"-":Math.round(x*100)+"%";
    if(!a.done.length) return `<div class="note">Em chưa làm câu hỏi nào có chấm điểm. Hãy xem video và trả lời các điểm dừng, rồi quay lại xem báo cáo.</div>`;
    const bl=Object.keys(a.by).map(b=>{ const x=a.by[b]; const p=x.ok/x.n; return `<div class="rpbar"><span>${BL[b]||b}</span><i style="--w:${Math.round(p*100)}%"></i><b>${x.ok}/${x.n}</b></div>`; }).join("");
    const weakB=Object.keys(a.by).filter(b=>a.by[b].ok/a.by[b].n<.6).map(b=>BL[b]||b);
    const advice=[];
    if(a.wrong.length) advice.push(`Ôn lại ${a.wrong.length} câu chưa đúng (bên dưới) - bấm nút xem lại đúng đoạn video.`);
    if(a.hintRate>.5) advice.push("Em dùng gợi ý khá nhiều: lần sau thử nhìn lại video trước (xem lại không bị trừ điểm).");
    if(weakB.length) advice.push("Mức tư duy cần luyện thêm: "+weakB.join(", ")+".");
    if(a.expAcc!=null&&a.actAcc!=null){ if(a.actAcc>=a.expAcc+.1) advice.push("Em làm tốt hơn mức kỳ vọng của bài - có thể thử bài kế tiếp hoặc câu nâng cao."); else if(a.actAcc<a.expAcc-.15) advice.push("Kết quả thấp hơn mức kỳ vọng của bài - nên xem lại phần Nội dung chính rồi làm lại."); }
    if(!st.reflectText) advice.push("Hoàn thành câu suy ngẫm (tự luận) để có điểm đầy đủ.");
    if(!advice.length) advice.push("Em học rất chắc bài này. Hãy sang bài tiếp theo.");
    const days=[1,3,7].map(d=>new Date(Date.now()+d*864e5).toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit"}));
    const wr=a.wrong.slice(0,5).map(r=>{ const q=r.q; const hit=search(ix,(q.giai_thich||q.hoi||""),1)[0]; const t=q.quay_lai_t!=null?q.quay_lai_t:(hit&&hit.p.t0!=null?hit.p.t0:null);
      return `<div class="rpwrong"><b>${esc(q.hoi)}</b><br><span class="note">${esc(q.giai_thich||"")}</span>${t!=null?`<br>${chip("seek","▶ Xem lại "+fmt(t),{t})}`:""}</div>`; }).join("");
    return `<div class="rp">
      <div class="rpgrid"><div><b>${a.idx==null?"-":a.idx}</b><span>Chỉ số học tập /100</span></div><div><b>${pct(a.acc)}</b><span>Đúng</span></div><div><b>${pct(a.firstRate)}</b><span>Đúng ngay lần 1, không gợi ý</span></div><div><b>${pct(a.hintRate)}</b><span>Câu có dùng gợi ý</span></div></div>
      <h4>Theo mức tư duy (Bloom)</h4>${bl}
      <h4>Nhận xét và việc nên làm</h4><ul>${advice.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      ${wr?`<h4>Câu cần ôn lại</h4>${wr}`:""}
      <h4>Lịch ôn tập gợi ý (nhắc lại cách quãng)</h4><div class="note">Ôn nhanh bằng "Cho em câu luyện tập" vào các ngày: ${days.join(" · ")}</div>
      <div class="note" style="margin-top:8px">Chỉ số = 55% đúng + 15% đúng ngay lần 1 + 15% tự lập (ít gợi ý) + 15% tự luận (hoặc mức hoàn thành). Báo cáo do máy tính tự động từ kết quả làm bài; điểm tự luận chờ giáo viên xác nhận.</div></div>`;
  }
  /* ---------- bản ghi ẩn danh cho bảng chất lượng dạy-học ---------- */
  function record(L,st){
    const T=L.tuong_tac; const qs=[...(T.diem||[]),...(T.ngan_hang||[])].filter(q=>["mcq","tf","num","order"].includes(q.loai));
    const a=st.answers||{}; const items={};
    qs.forEach(q=>{ const x=a[q.id]; if(x&&x.done) items[q.id]=[x.correct?1:0,x.attempts||0,x.hint||0,(x.picks&&x.picks.length)?String(x.picks[0]):""]; });
    return {ma:L.ma,at:Date.now(),items,total:st.total==null?null:+st.total.toFixed(3),vid:st.vid==null?null:+st.vid.toFixed(3),mast:st.mast==null?null:+st.mast.toFixed(3),essay:st.essay==null?null:+st.essay.toFixed(3),done:!!st.done,sv:st.survey||null,tOn:Math.round(st.timeOn||0),rep:st.replays||0,miss:(st.tutorMiss||[]).slice(0,8),tq:st.tutorQ||0,prac:st.pracN?[st.pracN,st.pracOk||0]:null};
  }
  return {strip,toks,content,build,search,intent,reply,cloze,scoreEssay,analyse,reportHTML,record,fmt,chip,BL};
})();
</script>

<script>
"use strict";
/* ================= PLAYER - VIDEO TƯƠNG TÁC ================= */
let P = null; // trạng thái phiên học
function stopPlayerLoop(){ if(P){ clearInterval(P.timer); P.timer=null; if(P.wmTimer) clearInterval(P.wmTimer); P=null; } ttsStop(); try{ nrCancel(); nrFlush(); }catch(e){} }

/* ----- Giọng đọc AI v2 (Web Speech API, vi-VN - ưu tiên giọng Bắc) -----
   Giọng do thiết bị cung cấp: Edge có HoaiMy/NamMinh (Natural, Bắc), Chrome có
   "Google Tiếng Việt" (Bắc, cần mạng), iOS/macOS có Linh, Android có Google TTS.
   Máy KHÔNG có giọng Việt → hướng dẫn bật theo từng hệ máy + chế độ CHỮ CHẠY
   theo lời giảng (chạy được trên mọi trình duyệt, hỗ trợ cả người khiếm thính). */
const TTS={on:false, idx:0, items:[], mode:null, textTimer:null, paused:false};
function ttsAll(){ try{ return speechSynthesis.getVoices()||[]; }catch(e){ return []; } }
function ttsVoices(){ return ttsAll().filter(v=>(v.lang||"").toLowerCase().startsWith("vi")); }
/* Giọng TIẾNG ANH của thiết bị cho câu/từ tiếng Anh (bài Tiếng Anh): ưu tiên giọng tự nhiên en-US */
function ttsEnVoice(){
  const en=ttsAll().filter(v=>/^en[-_]/i.test(v.lang||"")); if(!en.length) return null;
  const sc=v=>(/en[-_]us/i.test(v.lang)?4:/en[-_]gb/i.test(v.lang)?3:1)+(/natural|neural|online/i.test(v.name)?4:0)+(/google|aria|jenny|guy|andrew|ava|samantha|daniel/i.test(v.name)?2:0);
  return en.sort((a,b)=>sc(b)-sc(a))[0];
}
// Giọng nạp KHÔNG đồng bộ trên Chrome/Android - phải chờ, đây là lý do nhiều máy "không thấy tiếng Việt"
function ensureVoices(maxMs){
  if(!("speechSynthesis" in window)) return Promise.resolve([]);
  if(ttsVoices().length) return Promise.resolve(ttsVoices());
  const lim=Math.max(1,Math.round((maxMs||4000)/150));
  return new Promise(res=>{
    let n=0; const t=setInterval(()=>{ n++;
      if(ttsVoices().length || n>lim){ clearInterval(t); res(ttsVoices()); } },150);
    try{ speechSynthesis.onvoiceschanged=()=>{ if(ttsVoices().length){ clearInterval(t); res(ttsVoices()); } }; }catch(e){}
    try{ speechSynthesis.getVoices(); }catch(e){}
  });
}
/* --- Chế độ CHỮ CHẠY: hiện lời giảng từng đoạn, tự chuyển theo nhịp đọc --- */
function ttsText(texts){
  ttsStop();
  TTS.on=true; TTS.mode="text"; TTS.items=texts.filter(t=>t&&String(t).trim()); TTS.idx=0;
  const sb=document.querySelector(".screenbox"); if(!sb) return;
  const bar=document.createElement("div"); bar.id="ttsBar";
  bar.style.cssText="margin-top:10px;background:var(--navy);color:#fff;border-radius:12px;padding:14px 16px;position:relative";
  sb.insertAdjacentElement("afterend", bar);
  const b=document.getElementById("ttsBtn"); if(b){ b.classList.add("on"); b.innerHTML="⏹ Dừng"; }
  const show=()=>{
    if(!TTS.on||TTS.mode!=="text") return;
    if(TTS.idx>=TTS.items.length){ ttsStop(); return; }
    const t=String(TTS.items[TTS.idx]);
    bar.innerHTML=`<div style="font-size:.72rem;letter-spacing:.1em;opacity:.75;text-transform:uppercase;margin-bottom:6px">Lời giảng ${TTS.idx+1}/${TTS.items.length} · chế độ chữ chạy</div>
      <div style="font-size:1.06rem;line-height:1.65">${esc(t)}</div>
      <div class="rowline" style="margin-top:10px;gap:6px">
        <button class="btn sm ghost" id="tbPrev" style="color:#fff;border-color:rgba(255,255,255,.4)">⏮</button>
        <button class="btn sm ghost" id="tbPause" style="color:#fff;border-color:rgba(255,255,255,.4)">${TTS.paused?"▶ Tiếp":"⏸ Dừng nhịp"}</button>
        <button class="btn sm ghost" id="tbNext" style="color:#fff;border-color:rgba(255,255,255,.4)">⏭</button>
        <button class="btn sm ghost" id="tbX" style="color:#fff;border-color:rgba(255,255,255,.4);margin-left:auto">✕ Thoát</button>
      </div>`;
    bar.querySelector("#tbPrev").onclick=()=>{ TTS.idx=Math.max(0,TTS.idx-1); clearTimeout(TTS.textTimer); show(); };
    bar.querySelector("#tbNext").onclick=()=>{ TTS.idx++; clearTimeout(TTS.textTimer); show(); };
    bar.querySelector("#tbX").onclick=ttsStop;
    bar.querySelector("#tbPause").onclick=()=>{ TTS.paused=!TTS.paused; clearTimeout(TTS.textTimer); show(); };
    if(!TTS.paused){
      const words=t.split(/\s+/).length;
      TTS.textTimer=setTimeout(()=>{ TTS.idx++; show(); }, Math.max(2600, words*340+900));
    }
  };
  show();
}
function ttsLessonTexts(b,L){
  const out=[`Bài học: ${L.bai||""}. Môn ${b.subject||""}, ${b.grade||b.level||""}.`];
  const mt=L.muc_tieu||[];
  if(mt.length) out.push("Mục tiêu bài học: "+(Array.isArray(mt)?mt.join(". "):String(mt)));
  (L.storyboard||[]).forEach(sc=>{
    (sc.khung||[]).forEach(k=>{
      if(k&&k.loi) out.push(String(k.loi));
      else if(k&&k.chu_man_hinh) out.push(String(k.chu_man_hinh));
    });
  });
  out.push("Hết phần lời giảng. Chúc bạn làm bài thật tốt!");
  return out;
}

function lessonState(code, ma){
  if(!S.progress[code]) S.progress[code]={lessons:{},pct:0,ts:Date.now()};
  const pg=S.progress[code];
  if(!pg.lessons[ma]) pg.lessons[ma]={answers:{},done:false};
  return pg.lessons[ma];
}
function recomputeBook(code){
  const pack=S.goiCache[code]; if(!pack) return;
  const pg=S.progress[code]; if(!pg) return;
  const done=Object.values(pg.lessons).filter(l=>l.done).length;
  pg.pct = done/Math.max(1,pack.lessons.length); pg.ts=Date.now();
}

/* Gộp các điểm dừng sát nhau (cùng một mốc) thành MỘT chấm có số đếm - tránh chấm chồng lên nhau trên thanh thời gian */
function seekClusters(points,dur){
  const gap=Math.max(3,dur*0.025), out=[];
  points.slice().sort((a,b)=>a.t-b.t).forEach(q=>{ const g=out[out.length-1]; if(g&&q.t-g[0].t<=gap) g.push(q); else out.push([q]); });
  return out;
}

  const L = pack.lessons[i];

  const gradable = points.filter(q=>["mcq","tf","num","order"].includes(q.loai));
  v.innerHTML = `

            ${seekClusters(points,dur).map(g=>`<span class="dot${g.length>1?" multi":""}" data-ids="${esc(g.map(q=>q.id).join(","))}" data-t="${g[0].t}" style="left:${Math.min(99,Math.max(1,g[0].t/dur*100))}%" title="${esc(g.map(q=>fmtTime(q.t)+" · "+(q.hoi||q.loai)).join("\n"))}">${g.length>1?`<b>${g.length}</b>`:""}</span>`).join("")}
            <span class="knob" id="seekKnob" style="left:0"></span>
          </div>

        </div>

      <div class="card" style="margin-top:14px">
        <div class="rowline" style="justify-content:space-between"><h3 style="margin:0">Điểm số bài học</h3><span class="note">${mn?"Mầm non: quan sát, không chấm điểm":"Trong video 40% · Thành thạo 40% · Tự luận 20%"}</span></div>
        <div id="scorePanel" style="margin-top:10px"></div>
      </div>
    </div>
    <div class="sidepanel">
      <div class="card">
        <h3 style="margin-top:0">${mn?"Hoạt động cùng bé":"Điểm dừng tương tác"} <span class="note">(${points.length})</span></h3>
        <div class="qlist" id="qList"></div>
      </div>
      <div class="card">

        <div class="tmsgs" id="tMsgs"></div>
