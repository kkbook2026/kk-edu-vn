    </div>
  </div>`;

  $("#backBk").onclick=()=>go({name:"book", code});
  const nx=$("#nextLess"); if(nx) nx.onclick=()=>go({name:"hoc", code, i:i+1});
  $("#spdBtn").onclick=()=>{ P.speed = P.speed===1?1.5:(P.speed===1.5?2:1); $("#spdBtn").textContent=P.speed+"x"; if(P.video) P.video.playbackRate=P.speed; };
  $("#ttsBtn").onclick=()=>{
    nrUnlock();
    if(!P.playing){ P.voiceOn=true; LS.set("lessonVoice",true); if(P.video) P.video.muted=false; togglePlay(); }
    else if(P.video){ P.video.muted=!P.video.muted; }
    else { P.voiceOn=!P.voiceOn; LS.set("lessonVoice",P.voiceOn); nrCancel(); P.narr=null; }
    updateVoiceBtn();
  };
  $("#ttsCfg").onclick=()=>openVoicePicker();
  // Phóng to 2x: khung học chiếm toàn bộ bề ngang - chỉ khi học viên bấm; mỗi lần mở bài luôn về tỉ lệ chuẩn
  const pl=v.querySelector(".player");
  const applyWide=(on)=>{ pl.classList.toggle("wide", !!on); const w=$("#wideBtn"); if(w){ w.textContent=on?"🔍 Thu nhỏ":"🔍 2x"; w.classList.toggle("on", !!on); } };
  applyWide(false); /* mặc định: khung học + cột hoạt động bên phải; phóng to bằng tay */
  $("#wideBtn").onclick=()=>{ const on=!pl.classList.contains("wide"); applyWide(on); };
  // Toàn màn hình thật (Fullscreen API) - tự thoát khi có câu hỏi/hộp thoại để không bị che
  $("#fsBtn").onclick=()=>{
    const sb=v.querySelector(".screenbox"); if(!sb) return;
    if(document.fullscreenElement||document.webkitFullscreenElement){
      try{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }catch(e){}
      return;
    }
    const req=sb.requestFullscreen||sb.webkitRequestFullscreen;
    const fallback=()=>{ applyWide(true); toast("Trình duyệt không cho toàn màn hình - đã bật chế độ 2x"); };
    if(!req){ fallback(); return; }
    try{ const p=req.call(sb); if(p&&p.catch) p.catch(fallback); }catch(e){ fallback(); }
  };
  $("#btnPlay").onclick=()=>{ nrUnlock(); togglePlay(); };
  $("#seek").onclick=e=>{ const r=e.currentTarget.getBoundingClientRect(); seekTo(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*P.dur); };
  $("#mastBtn").onclick=()=> mn ? openObserve() : openMastery();
  const rb=$("#reflBtn"); if(rb) rb.onclick=()=>openReflect();

  // Video thật (nếu có) hoặc màn mô phỏng
  if(real){
    const sc=$("#screen");
    sc.innerHTML = `<video id="vid" playsinline preload="metadata"><source src="${esc(real.src)}" type="video/mp4"></video>`; /* video demo đã có phụ đề in sẵn trong hình: không gắn thêm phụ đề VTT để tránh chữ chồng 2 lớp */
    P.video = $("#vid");
    try{ [...P.video.textTracks].forEach(t=>t.mode="disabled"); }catch(e){}
    let metaOk=false;
    const simFallback=()=>{ if(!P||!P.video) return; try{P.video.pause();}catch(e){} P.video=null; sc.innerHTML=""; sc._key=null; clearInterval(P.timer); P.playing=false; updatePlayBtn(); renderScene(); toast("Trình duyệt không phát được video - chuyển sang chế độ bài giảng minh họa"); };
    P.video.addEventListener("loadedmetadata",()=>{ metaOk=true; if(P&&P.video&&P.video.duration) P.dur=P.video.duration; const te=$("#tEnd"); if(te) te.textContent=fmtTime(P.dur); });
    P.video.addEventListener("error",simFallback);
    setTimeout(()=>{ if(P&&P.video&&!metaOk&&P.video.readyState===0) simFallback(); }, 8000);
    P.video.addEventListener("timeupdate",()=>{ if(!P||!P.video) return; P.t=P.video.currentTime; if(P.playing) P.st.timeOn=(P.st.timeOn||0)+0.25; tick(true); });
    P.video.addEventListener("ended",()=>{ if(P){P.playing=false; updatePlayBtn(); markVideoDone();} });
    if(P.t>1) P.video.currentTime=P.t;
  }
  startWatermark();
  renderQList(); renderScene(); renderScore(); updateMastNote();
  initTutor(); updateVoiceBtn();
  try{ kkvPrewarm(); }catch(e){}
  try{ if(!P.video&&P.voiceOn){ const first=narrList().slice(0,NR_LOOK).map(z=>z.t); nrEngine().then(e=>{ if(!e) return; if(e.engine==="ai"&&!ttsSlow()&&kkvAllowed()) kkvInit().then(()=>nrPrefetch(first)).catch(()=>{}); else if(e.engine==="cloud") nrPrefetch(first); }).catch(()=>{}); } }catch(e){}
  maybeConsent();
}

function togglePlay(){
  if(!P) return;
  P.playing=!P.playing;
  if(P.video){ P.playing?P.video.play().catch(()=>{P.playing=false;updatePlayBtn();}):P.video.pause(); }
  else{
    clearInterval(P.timer);
    const st0=P.st;
    if(P.playing){ P.timer=setInterval(()=>{ if(!P||!P.playing) return;
      const nx=P.t+0.25*P.speed;
      if(P.voiceOn&&P.narr&&P.narr.busy&&nx>=P.narr.end-0.05) return; /* chờ giọng đọc xong câu rồi mới sang khung kế */
      P.t=Math.min(P.dur,nx); st0.timeOn=(st0.timeOn||0)+0.25; tick(false); if(P.t>=P.dur){P.playing=false;updatePlayBtn();clearInterval(P.timer);markVideoDone();} },250); }
  }
  if(P.playing) nrResume(); else nrPause();
  updatePlayBtn(); updateVoiceBtn();
}
function updateVoiceBtn(){
  const b=$("#ttsBtn"); if(!b||!P) return;
  const on=P.video?!P.video.muted:P.voiceOn;
  b.innerHTML=on?(P.playing?"🔊 Đang nghe":"🔊 Nghe giảng"):"🔇 Tắt tiếng"; b.classList.toggle("on",!!on&&P.playing);
  b.title=on?"Bấm để tắt tiếng (bài vẫn chạy)":"Bấm để bật tiếng và chạy bài";
}
function narrList(){
  if(P.nl) return P.nl; const a=[];
  (P.L.storyboard||[]).forEach(sc=>{ (sc.khung||[]).forEach((k,ki)=>{ if(k&&k.loi) a.push({key:sc.id+"|"+ki,t:String(k.loi)}); }); });
  return (P.nl=a);
}
function narrate(){
  if(!P||P.video||!P.playing||!P.voiceOn) return;
  const x=sceneAt(P.t); if(!x||!x.k||!x.k.loi) return;
  const key=x.sc.id+"|"+x.ki; if(P.narr&&P.narr.key===key) return;
  const mine={key,busy:true,end:x.kend}; P.narr=mine;
  nrSay(String(x.k.loi),()=>{ mine.busy=false; },Math.max(.5,Math.min(2,ttsRate()*P.speed)));
  try{ const nl=narrList(), ix=nl.findIndex(z=>z.key===key); if(ix>=0) nrPrefetch(nl.slice(ix+1,ix+1+NR_LOOK).map(z=>z.t)); }catch(e){}
}
function updatePlayBtn(){ const p=$("#playIco"); if(p) p.setAttribute("d", P&&P.playing ? "M6 5h4v14H6zM14 5h4v14h-4z" : "M8 5v14l11-7z"); }
function seekTo(t){ if(!P) return; if(t<P.t-5){ P.st.replays=(P.st.replays||0)+1; (P.st.replayAt=P.st.replayAt||[]).push(Math.round(t)); if(P.st.replayAt.length>30) P.st.replayAt.shift(); } nrCancel(); P.narr=null; P.t=Math.max(0,Math.min(P.dur,t)); if(P.video) P.video.currentTime=P.t; P.lastShown=null; tick(true); }
function tick(skipAdvance){
  if(!P) return;
  $("#tNow").textContent=fmtTime(P.t);
  $("#seekFill").style.width=(P.t/P.dur*100)+"%"; const kn=$("#seekKnob"); if(kn) kn.style.left=(P.t/P.dur*100)+"%";
  if(!P.video){ renderScene(); narrate(); }
  // kích hoạt điểm dừng
  for(const q of P.points){
    const a=P.st.answers[q.id];
    if(!a || !a.seen){
      if(P.t>=q.t && (P.lastShown!==q.id)){ P.lastShown=q.id; pauseAll(); openPoint(q); break; }
    }
  }
  P.st.resumeT=P.t;
}
function pauseAll(){ if(!P) return; nrPause(); P.playing=false; if(P.video)P.video.pause(); clearInterval(P.timer); updatePlayBtn(); }

/* ----- Cảnh mô phỏng từ storyboard ----- */
function sceneAt(t){
  const sb=P.L.storyboard||[];
  let sc=sb.find(s=>t>=s.t0&&t<s.t1) || sb[sb.length-1];
  if(!sc) return null;
  const kh=sc.khung||[]; if(!kh.length) return {sc,k:null,ki:0,kend:sc.t1};
  const span=(sc.t1-sc.t0)/kh.length;
  const ki=Math.max(0,Math.min(kh.length-1, Math.floor((t-sc.t0)/Math.max(1e-6,span))));
  return {sc,k:kh[ki],ki,kend:sc.t0+(ki+1)*span};
}
function renderScene(){
  const el=$("#screen"); if(!el||P.video) return;
  const x=sceneAt(P.t);
  if(!x){ el.innerHTML=`<div class="scene"><div class="chu">${esc(P.L.bai)}</div><div class="loi">Bấm nút phát để bắt đầu bài học.</div></div>`; return; }
  const {sc,k}=x;
  const svg = k&&k.so_do&&P.L._svg&&P.L._svg[k.so_do] ? `<div class="sodo">${P.L._svg[k.so_do]}</div>` : "";
  const key = sc.id+"|"+(k?(k.loi||"").slice(0,40):"");
  if(el._key===key) return; el._key=key;
  el.innerHTML = `<div class="scene">
    <div class="phan">${esc(sc.phan||"")} · ${fmtTime(sc.t0)}-${fmtTime(sc.t1)}</div>
    ${k&&k.chu_man_hinh?`<div class="chu">${esc(k.chu_man_hinh)}</div>`:`<div class="chu">${esc(P.L.bai)}</div>`}
    ${svg}
    ${k&&k.hinh?`<div class="hinh">🎨 ${esc(k.hinh)}</div>`:""}
    ${k&&k.loi?`<div class="loi">${esc(k.loi)}</div>`:""}
  </div>`;
}
function startWatermark(){
  const wm=$("#wm"); if(!wm) return;
  const label = (S.name||"Khách")+" · "+(S.uid?S.uid.slice(0,8):"guest")+" · "+new Date().toISOString().slice(0,10);
  wm.textContent=label;
  const mv=()=>{ wm.style.top=(8+Math.random()*70)+"%"; wm.style.left=(4+Math.random()*60)+"%"; };
  mv(); P.wmTimer=setInterval(mv, 8000);
}
function markVideoDone(){ if(!P) return; P.st.videoEnded=true; computeTotals(); renderScore(); saveProgress(P.code); }

/* ----- Danh sách điểm dừng ----- */
function renderQList(){
  const box=$("#qList"); if(!box||!P) return;
  const names={poll:"Thăm dò",mcq:"Trắc nghiệm",tf:"Đúng - Sai",num:"Điền số",order:"Sắp xếp",reflect:"Suy ngẫm"};
  box.innerHTML=P.points.map(q=>{
    const a=P.st.answers[q.id];
    const cls=a&&a.seen?(a.earned>0||!["mcq","tf","num","order"].includes(q.loai)?"hit":"miss"):"";
    return `<div class="qrow ${cls}" data-id="${esc(q.id)}"><span class="ic"></span><span class="tt">${fmtTime(q.t)}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${names[q.loai]||q.loai}: ${esc(q.hoi)}</span></div>`;
  }).join("");
  box.querySelectorAll(".qrow").forEach(r=> r.onclick=()=>{ const q=P.points.find(x=>x.id===r.dataset.id); if(q){ pauseAll(); openPoint(q,true); } });
  // tô màu mốc trên thanh thời gian
  document.querySelectorAll("#seek .dot").forEach(d=>{ const ids=(d.dataset.ids||"").split(",").filter(Boolean); const n=ids.filter(id=>{ const a=P.st.answers[id]; return a&&a.seen; }).length;
    d.classList.toggle("hit", n>0&&n===ids.length); d.classList.toggle("part", n>0&&n<ids.length); });
}

/* ================= BỘ MÁY CÂU HỎI & CHẤM ================= */
function qstate(q){ const st=P.st; if(!st.answers[q.id]) st.answers[q.id]={attempts:0,hint:0,earned:0,seen:false}; return st.answers[q.id]; }
function hintPenalty(h){ return h>=2?0.75:(h>=1?0.9:1); }
function checkAnswer(q, val){
  if(q.loai==="mcq") return val===q.dap_an;
  if(q.loai==="tf")  return val===(q.dap_an===true||q.dap_an===1||q.dap_an==="true");
  if(q.loai==="num"){ const x=parseFloat(String(val).replace(",",".")); return isFinite(x)&&Math.abs(x-Number(q.dap_an))<0.0051; }
  if(q.loai==="order") return JSON.stringify(val)===JSON.stringify(q.dap_an);
  return false;
}
function openPoint(q, review){
  const a=qstate(q);
  if(q.loai==="poll") return openPoll(q,a);
  if(q.loai==="reflect") return openReflect(q,a);
  return openGraded(q,a,review,"video");
}
function resumePlay(){ closeModal(); if(P&&!P.playing&&P.t<P.dur-0.5) togglePlay(); renderQList(); computeTotals(); renderScore(); saveProgress(P.code); }

function openPoll(q,a){
  const big=P.mn?"big":"";
  modal(`<div class="eyebrow">Thăm dò trước khi học · không tính điểm</div><h3>${esc(q.hoi)}</h3>
  <div class="opts">${q.lua_chon.map((c,ix)=>`<button class="opt ${big}" data-ix="${ix}">${esc(c)}</button>`).join("")}</div>
  <div id="pollFb"></div>`,{lock:true});
  document.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    a.seen=true; a.choice=Number(o.dataset.ix);
    document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); o.classList.add("sel");
    $("#pollFb").innerHTML=`${q.quan_niem_sai?`<div class="feedback hint">💡 ${esc(q.quan_niem_sai)}</div>`:""}
    <div class="mrow"><button class="btn pri" id="pGo">Tiếp tục video</button></div>`;
    $("#pGo").onclick=resumePlay;
  });
}

function openGraded(q,a,review,zone){
  a.seen=true;
  const names={mcq:"Trắc nghiệm",tf:"Đúng - Sai",num:"Điền số",order:"Sắp xếp"};
  const header=`<div class="eyebrow">${names[q.loai]} · ${q.bloom?("mức "+esc(q.bloom)+" · "):""}${zone==="video"?"trong video":"kiểm tra thành thạo"}</div><h3>${esc(q.hoi)}</h3>`;
  let bodyHTML="";
  if(q.loai==="mcq") bodyHTML=`<div class="opts">${q.lua_chon.map((c,ix)=>`<button class="opt ${P.mn?"big":""}" data-ix="${ix}">${esc(c)}</button>`).join("")}</div>`;
  else if(q.loai==="tf") bodyHTML=`<div class="opts"><button class="opt" data-tf="1">✔ Đúng</button><button class="opt" data-tf="0">✘ Sai</button></div>`;
  else if(q.loai==="num") bodyHTML=`<div class="fld" style="margin-top:12px"><label>Đáp số của em</label><input id="numIn" inputmode="decimal" placeholder="Ví dụ: 1,25"></div>`;
  else if(q.loai==="order"){
    if(!a.ord) a.ord=q.lua_chon.map((_,ix)=>ix);
    bodyHTML=`<div class="ordlist" id="ordList"></div>`;
  }
  const done = a.done;
  modal(`${header}${bodyHTML}
  <div id="qFb">${done?gradedResultHTML(q,a):""}</div>
  <div class="mrow" id="qActions"></div>`,{lock:true});
  const actions=$("#qActions");
  const renderOrd=()=>{ const el=$("#ordList"); if(!el) return;
    el.innerHTML=a.ord.map((oi,pos)=>`<div class="orditem"><b>${pos+1}.</b> <span>${esc(q.lua_chon[oi])}</span>
      <span class="mv"><button data-p="${pos}" data-d="-1" ${pos===0?"disabled":""}>↑</button><button data-p="${pos}" data-d="1" ${pos===a.ord.length-1?"disabled":""}>↓</button></span></div>`).join("");
    el.querySelectorAll("button").forEach(b=>b.onclick=()=>{ const p=Number(b.dataset.p),d=Number(b.dataset.d); const t=a.ord[p]; a.ord[p]=a.ord[p+d]; a.ord[p+d]=t; renderOrd(); });
  };
  renderOrd();
  let picked=null;
  document.querySelectorAll("#modalHost .opt").forEach(o=>o.onclick=()=>{ if(a.done) return; document.querySelectorAll("#modalHost .opt").forEach(x=>x.classList.remove("sel")); o.classList.add("sel"); picked = o.dataset.ix!=null?Number(o.dataset.ix):(o.dataset.tf==="1"); });
  const refreshActions=()=>{
    if(a.done){ actions.innerHTML=`<button class="btn pri" id="qNext">${zone==="video"?"Tiếp tục video":"Câu tiếp theo"}</button>`; $("#qNext").onclick=()=> zone==="video"?resumePlay():(closeModal(),P._mastNext&&P._mastNext()); return; }
    actions.innerHTML=`
      <button class="btn pri" id="qSubmit">Trả lời ${a.attempts>0?"(lần 2, hệ số 0,8)":""}</button>
      ${(q.goi_y&&q.goi_y.length)?`<button class="btn ghost sm" id="qHint">Gợi ý ${a.hint===0?"nhẹ (-10%)":a.hint===1?"rõ (-25%)":""}</button>`:""}
      ${q.quay_lai_t!=null&&zone==="video"?`<button class="btn ghost sm" id="qBack">⟲ Xem lại đoạn ${fmtTime(q.quay_lai_t)}</button>`:""}
      <button class="btn ghost sm" id="qSkip">${zone==="video"?"Để sau":"Thoát bài kiểm tra"}</button>`;
    $("#qSubmit").onclick=submit;
    $("#qSkip").onclick=()=>{ if(zone==="video"){ resumePlay(); } else { P._mastNext=null; closeModal(); computeTotals(); renderScore(); saveProgress(P.code); } };
    const hb=$("#qHint"); if(hb) hb.onclick=()=>{ if(a.hint>=2) return; a.hint++; const fb=$("#qFb");
      fb.innerHTML=`<div class="feedback hint">💡 ${esc(q.goi_y[Math.min(a.hint-1,q.goi_y.length-1)])}</div>`+fb.innerHTML; refreshActions(); };
    const bb=$("#qBack"); if(bb) bb.onclick=()=>{ closeModal(); seekTo(q.quay_lai_t); renderQList(); };
  };
  function submit(){
    let val;
    if(q.loai==="mcq"||q.loai==="tf"){ if(picked==null){ toast("Hãy chọn một đáp án"); return; } val=picked; }
    else if(q.loai==="num"){ val=$("#numIn").value; if(!String(val).trim()){ toast("Hãy nhập đáp số"); return; } }
    else if(q.loai==="order") val=a.ord;
    const right=checkAnswer(q,val);
    a.attempts++; if(q.loai!=="order"){ (a.picks=a.picks||[]).push(val); }
    if(right){
      a.done=true; a.correct=true;
      a.earned=(a.attempts===1?1:0.8)*hintPenalty(a.hint);
      $("#qFb").innerHTML=gradedResultHTML(q,a);
      markOptions(q,val,true);
    } else if(a.attempts===1){
      a.hint=Math.max(a.hint,1);
      $("#qFb").innerHTML=`<div class="feedback bad">Chưa đúng. ${q.goi_y&&q.goi_y[0]?"Gợi ý: "+esc(q.goi_y[0]):""} Em còn 1 lần làm (hệ số 0,8).</div>`;
      document.querySelectorAll("#modalHost .opt.sel").forEach(x=>{x.classList.remove("sel");x.classList.add("wrong");});
      picked=null;
    } else {
      a.done=true; a.correct=false; a.earned=0;
      $("#qFb").innerHTML=gradedResultHTML(q,a);
      markOptions(q,val,false);
    }
    refreshActions(); renderQList();
  }
  function markOptions(q,val,ok){
    document.querySelectorAll("#modalHost .opt").forEach(o=>{
      const v=o.dataset.ix!=null?Number(o.dataset.ix):(o.dataset.tf==="1");
      const isAns = q.loai==="mcq"? v===q.dap_an : q.loai==="tf" ? v===(q.dap_an===true||q.dap_an===1) : false;
      if(isAns) o.classList.add("right"); else if(v===val&&!ok) o.classList.add("wrong");
      o.disabled=true;
    });
  }
  refreshActions();
}
function gradedResultHTML(q,a){
  const pct=Math.round((a.earned||0)*100);
  const ansText = q.loai==="mcq"?q.lua_chon[q.dap_an] : q.loai==="tf"?((q.dap_an===true||q.dap_an===1)?"Đúng":"Sai") : q.loai==="num"?String(q.dap_an).replace(".",",") : q.loai==="order"?q.dap_an.map(ix=>q.lua_chon[ix]).join(" → "):"";
  return `<div class="feedback ${a.correct?"good":"bad"}">
    <b>${a.correct?`Chính xác! Em đạt ${pct}% điểm câu này.`:"Chưa đúng."}</b><br>
    Đáp án: <b>${esc(ansText)}</b><br>${esc(q.giai_thich||"")}</div>`;
}

/* ----- Câu suy ngẫm (tự luận) ----- */
function openReflect(q){
  q = q || P.points.find(x=>x.loai==="reflect") || {hoi:"Em hãy viết 3-5 câu suy ngẫm về điều em học được trong bài."};
  const a = q.id?qstate(q):null; if(a) a.seen=true;
  const st=P.st;
  const rb = P.L.tuong_tac.rubric||[];
  modal(`<div class="eyebrow">Câu suy ngẫm · tự luận 20% · chấm theo rubric</div><h3>${esc(q.hoi)}</h3>
  <textarea class="reflect" id="refTxt" placeholder="Viết câu trả lời của em...">${esc(st.reflectText||"")}</textarea>
  <div id="refAIout"></div>
  <div id="rubricBox" style="margin-top:12px">${st.reflectText?rubricHTML(rb,st):""}</div>
  <div class="mrow">
    <button class="btn pri" id="refSave">Nộp bài</button>
    <button class="btn gold sm" id="refLocal">🧮 KK-Chấm: chấm sơ bộ</button>
    ${S.caps.sample?`<button class="btn ghost sm" id="refAI">🤖 Nhờ AI chấm gợi ý</button>`:""}
    <button class="btn ghost sm" id="refClose">Đóng</button>
  </div>
  <div class="note" style="margin-top:8px">Bấm <b>KK-Chấm</b> để xem điểm sơ bộ và góp ý trước khi nộp. Theo quy tắc KK-EDU 2.0: máy chỉ chấm tạm tính - giáo viên hoặc phụ huynh xác nhận mức rubric.</div>`,{lock:true});
  $("#refClose").onclick=resumePlay;
  $("#refSave").onclick=()=>{
    const txt=$("#refTxt").value.trim();
    if(txt.split(/\s+/).filter(Boolean).length<4){ toast("Hãy viết ít nhất một câu hoàn chỉnh trước khi nộp"); $("#refTxt").focus(); return; }
    st.reflectText=txt; st.reflectAt=new Date().toISOString();
    if(a){ a.done=true; a.seen=true; }
    // Chưa có người hướng dẫn chọn đủ mức rubric -> KK-Chấm tạm tính để có điểm ngay (người hướng dẫn đổi lại được)
    let sc=null; try{ sc=TG.scoreEssay(txt,q,TG.build(P.L)); }catch(e){}
    const lv=st.rubricLevels||[]; const full=rb.length&&rb.every((_,i)=>lv[i]>=1&&lv[i]<=4);
    if(sc&&rb.length&&(!full||st.rubricProv)){ st.rubricLevels=sc.levels.slice(0,rb.length); st.rubricProv=true; }
    computeTotals(); renderScore(); saveProgress(P.code);
    const pct=rb.length&&st.rubricLevels?Math.round(st.rubricLevels.reduce((s2,x,i)=>s2+(rb[i].trong_so||0)*((x-1)/3),0)*100):null;
    const m=document.querySelector("#modalHost .modal");
    if(m) m.innerHTML=`<div style="text-align:center;padding:18px 6px"><div style="font-size:3rem;line-height:1">✅</div><h3 style="margin:10px 0 6px">Đã nộp bài thành công!</h3>
      <div class="note">${pct!=null?`Điểm tự luận ${st.rubricProv?"tạm tính (KK-Chấm)":"đã xác nhận"}: <b>${pct}%</b>. `:""}${st.rubricProv?"Giáo viên hoặc phụ huynh sẽ xác nhận mức rubric.":""}</div>
      <div class="note" style="margin-top:6px">Bài học tiếp tục sau giây lát...</div></div>`;
    toast("✅ Đã nộp bài thành công");
    setTimeout(()=>{ if(document.querySelector("#modalHost .modal")) resumePlay(); }, 1800);
  };
  bindRubric(rb,st);
  const lc=$("#refLocal"); if(lc) lc.onclick=()=>{
    const txt=$("#refTxt").value.trim(); if(txt.split(/\s+/).filter(Boolean).length<4){ toast("Hãy viết ít nhất một câu hoàn chỉnh trước"); return; }
    const r=TG.scoreEssay(txt,q,TG.build(P.L));
    const names=rb.map((x,i)=>`<tr><td>${esc(x.tieu_chi)}</td><td><b>${r.levels[i]||1}/4</b></td><td>${esc((r.notes[i]||{}).a||"")}<br><span class="note">${esc((r.notes[i]||{}).b||"")}</span></td></tr>`).join("");
    const pct=Math.round(r.total*100);
    $("#refAIout").innerHTML=`<div class="feedback hint" style="margin-top:10px"><b>🧮 KK-Chấm sơ bộ: ${pct}% (${r.levels.slice(0,rb.length||3).join(" - ")})</b><div class="note" style="margin:2px 0 6px">Chấm tự động theo rubric: thuật ngữ trọng tâm, bám câu hỏi, ví dụ riêng, lập luận, độ dài và cách diễn đạt. Máy không hiểu sâu như giáo viên.</div><table class="kktab">${names}</table><button class="btn gold sm" id="refApply">Áp dụng mức gợi ý (tạm tính)</button> <span class="note">Sửa bài rồi bấm KK-Chấm lại để cải thiện điểm.</span></div>`;
    try{ $("#refAIout").scrollIntoView({behavior:"smooth",block:"nearest"}); }catch(e){}
    $("#refApply").onclick=()=>{ st.reflectText=txt; st.rubricLevels=r.levels.slice(0,rb.length); st.rubricProv=true; $("#rubricBox").innerHTML=rubricHTML(rb,st); bindRubric(rb,st); computeTotals(); renderScore(); saveProgress(P.code); toast("Đã áp dụng mức tạm tính"); };
  };
  const ai=$("#refAI"); if(ai) ai.onclick=async()=>{
    const txt=$("#refTxt").value.trim(); if(!txt){toast("Hãy viết câu trả lời trước");return;}
    ai.disabled=true; $("#refAIout").innerHTML=`<div class="feedback hint">AI đang đọc bài của em...</div>`;
    try{
      const res = await S.caps.sample.json(
`Bạn là giáo viên chấm câu tự luận cho bài "${P.L.bai}" (${P.L.ma}).
Câu hỏi: ${q.hoi}
Bài làm của học sinh: """${txt}"""
Rubric (mỗi tiêu chí 4 mức, 1 thấp nhất - 4 cao nhất): ${rb.map(r=>r.tieu_chi+" (trọng số "+r.trong_so+")").join("; ")}.
Trả về JSON: {"levels":[mức từng tiêu chí theo đúng thứ tự, số 1-4],"nhan_xet":"2-3 câu nhận xét tiếng Việt, khích lệ, chỉ ra 1 điểm cần cải thiện"}`);
      if(res&&Array.isArray(res.levels)){ st.rubricAI=res.levels.slice(0,rb.length).map(x=>Math.max(1,Math.min(4,Math.round(x))));
        $("#refAIout").innerHTML=`<div class="feedback hint"><b>AI gợi ý:</b> ${esc(res.nhan_xet||"")}<br>Mức đề xuất: ${st.rubricAI.join(" - ")} (bấm vào rubric để xác nhận)</div>`; }
      else $("#refAIout").innerHTML=`<div class="feedback bad">AI chưa trả lời được, thử lại sau.</div>`;
    }catch(e){ $("#refAIout").innerHTML=`<div class="feedback bad">Không gọi được AI (${esc(e&&e.code||"lỗi")}).</div>`; }
    ai.disabled=false;
  };
}
function rubricHTML(rb,st){
  if(!rb.length) return "";
  const lv=st.rubricLevels||[];
  return `<div class="note" style="margin-bottom:6px"><b>Rubric xác nhận</b> (người hướng dẫn chọn mức 1-4):</div>`+rb.map((r,ri)=>`
  <div class="rowline" style="margin-bottom:7px"><span style="flex:1;min-width:150px;font-size:.88rem">${esc(r.tieu_chi)} <span class="note">(${Math.round(r.trong_so*100)}%)</span></span>
  ${[1,2,3,4].map(m=>`<button class="btn sm ${lv[ri]===m?"gold":"ghost"} rbBtn" data-ri="${ri}" data-m="${m}">${m}</button>`).join("")}</div>`).join("");
}
function bindRubric(rb,st){
  document.querySelectorAll(".rbBtn").forEach(b=>b.onclick=()=>{
    st.rubricLevels=st.rubricLevels||[];
    st.rubricLevels[Number(b.dataset.ri)]=Number(b.dataset.m); st.rubricProv=false;
    $("#rubricBox").innerHTML=rubricHTML(rb,st); bindRubric(rb,st);
    computeTotals(); renderScore(); saveProgress(P.code);
  });
}

/* ----- Kiểm tra thành thạo ----- */
function openMastery(){
  const qs=(P.L.tuong_tac.ngan_hang||[]).filter(q=>["mcq","tf","num","order"].includes(q.loai));
  if(!qs.length){ toast("Bài này không có câu thành thạo"); return; }
  let ix=0;
  const next=()=>{ ix++; if(ix<qs.length){ openGraded(qs[ix], qstate(qs[ix]), false, "mastery"); }
    else{ P.st.masteryDone=true; computeTotals(); renderScore(); updateMastNote(); saveProgress(P.code); openSurveyMaybe(); } };
  P._mastNext=next;
  openGraded(qs[0], qstate(qs[0]), false, "mastery");
}
function updateMastNote(){
  const el=$("#mastNote"); if(!el||!P) return;
  if(P.mn){ el.textContent="Người lớn quan sát bé theo bảng chỉ số, chọn 1 trong 3 mức cho từng chỉ số."; return; }
  const qs=(P.L.tuong_tac.ngan_hang||[]); const done=qs.filter(q=>P.st.answers[q.id]&&P.st.answers[q.id].done).length;
  el.textContent = done?`Đã làm ${done}/${qs.length} câu.`:`${qs.length} câu có đáp án, giải thích và mức tư duy Bloom. Nên làm sau khi xem hết video.`;
}

/* ----- Khảo sát sau bài ----- */
function openSurveyMaybe(){
  const ks=P.L.tuong_tac.khao_sat||[]; if(!ks.length||P.st.survey){ finishLesson(); return; }
  const st=P.st; st.survey={};
  const item=(k)=> k.loai==="likert5"
    ? `<div><div style="font-size:.92rem;margin-bottom:4px">${esc(k.hoi)}</div><div class="likert" data-id="${esc(k.id)}">${[1,2,3,4,5].map(n=>`<button data-v="${n}">${n}</button>`).join("")}</div></div>`
    : `<div><div style="font-size:.92rem;margin-bottom:4px">${esc(k.hoi)}</div><div class="opts" data-id="${esc(k.id)}">${k.lua_chon.map((c,i)=>`<button class="opt" data-v="${i}">${esc(c)}</button>`).join("")}</div></div>`;
  modal(`<div class="eyebrow">Khảo sát 30 giây · giúp cải thiện bài học</div><h3>Cảm nhận của em</h3>${ks.map(item).join("")}
  <div class="mrow"><button class="btn pri" id="svOk">Gửi & xem kết quả</button><button class="btn ghost sm" id="svSkip">Bỏ qua</button></div>`,{lock:true});
  document.querySelectorAll(".likert").forEach(l=> l.querySelectorAll("button").forEach(b=>b.onclick=()=>{ l.querySelectorAll("button").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); st.survey[l.dataset.id]=Number(b.dataset.v); }));
  document.querySelectorAll(".opts[data-id]").forEach(l=> l.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ l.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); st.survey[l.dataset.id]=Number(b.dataset.v); }));
  $("#svOk").onclick=()=>{ saveProgress(P.code); finishLesson(); };
  $("#svSkip").onclick=()=>{ st.survey=null; finishLesson(); };
}

/* ----- Quan sát Mầm non ----- */
function openObserve(){
  const bang=(P.L.tuong_tac.quan_sat&&P.L.tuong_tac.quan_sat.bang)||[];
  if(!bang.length){ toast("Bài này không có bảng quan sát"); return; }
  const st=P.st; st.obs=st.obs||{};
  const MUC=["Đạt","Đang hình thành","Cần hỗ trợ"];
  modal(`<div class="eyebrow">Dành cho người lớn · quan sát 3 mức · không chấm điểm</div><h3>Bảng quan sát</h3>
  ${bang.map((r,ri)=>`<div style="margin-bottom:12px"><div style="font-size:.9rem;margin-bottom:5px">${ri+1}. ${esc(r.chi_so)}</div>
    <div class="rowline">${MUC.map((m,mi)=>`<button class="btn sm obsBtn ${st.obs[ri]===mi?(mi===0?"pri":"gold"):"ghost"}" data-ri="${ri}" data-mi="${mi}">${m}</button>`).join("")}</div></div>`).join("")}
  <div class="mrow"><button class="btn pri" id="obsOk">Lưu quan sát</button></div>`,{lock:true});
  document.querySelectorAll(".obsBtn").forEach(b=>b.onclick=()=>{ st.obs[Number(b.dataset.ri)]=Number(b.dataset.mi); openObserve(); });
  $("#obsOk").onclick=()=>{ st.done=true; recomputeBook(P.code); saveProgress(P.code); closeModal(); renderScore(); toast("Đã lưu quan sát của bé"); };
}

/* ----- Tổng hợp điểm ----- */
function computeTotals(){
  const st=P.st, ct=P.L.tuong_tac.cong_thuc||{ty_le:{trong_video:.4,thanh_thao:.4,tu_luan:.2},nguong_dat:.7,nguong_nang_cao:.9};
  const gv=P.points.filter(q=>["mcq","tf","num","order"].includes(q.loai));
  const gm=(P.L.tuong_tac.ngan_hang||[]).filter(q=>["mcq","tf","num","order"].includes(q.loai));
  const sum=(qs)=>{ let w=0,e=0,n=0; qs.forEach(q=>{ const wq=q.diem!=null?q.diem:1; const a=st.answers[q.id]; w+=wq; if(a&&a.done){e+=(a.earned||0)*wq; n++;} }); return {w,e,n,score:w?e/w:null,answered:n,total:qs.length}; };
  const V=sum(gv), M=sum(gm);
  st.vid = V.total? (V.answered?V.e/V.w:null) : null;
  st.mast = M.total? (M.answered===M.total?M.e/M.w:null) : null;
  const rb=P.L.tuong_tac.rubric||[];
  st.essay = (st.rubricLevels&&st.rubricLevels.filter(x=>x).length===rb.length&&rb.length)
    ? rb.reduce((a,r,ri)=>a+r.trong_so*((st.rubricLevels[ri]-1)/3),0) : null;
  const w=ct.ty_le||{trong_video:.4,thanh_thao:.4,tu_luan:.2};
  const comp=[["trong_video",st.vid,V.total],["thanh_thao",st.mast,M.total],["tu_luan",st.essay,rb.length]].filter(c=>c[2]>0);
  const avail=comp.filter(c=>c[1]!=null);
  st.provisional = avail.length<comp.length;
  st.total = avail.length? avail.reduce((a,c)=>a+w[c[0]]*c[1],0)/avail.reduce((a,c)=>a+w[c[0]],0) : null;
  st.verdict = st.total==null?null : st.total>=(ct.nguong_nang_cao||.9)?"nc" : st.total>=(ct.nguong_dat||.7)?"dat":"chua";
  const allSeen=P.points.every(q=>st.answers[q.id]&&st.answers[q.id].seen);
  if(!P.mn) st.done = !!(st.masteryDone && (st.videoEnded||allSeen));
  st.ts=Date.now();
  recomputeBook(P.code);
}
function finishLesson(){ closeModal(); computeTotals(); renderScore(); renderQList(); saveProgress(P.code);
  if(P.st.done) toast("Hoàn thành bài học! 🎉"); }
function renderScore(){
  const el=$("#scorePanel"); if(!el||!P) return;
  const st=P.st;
  if(P.mn){
    const bang=(P.L.tuong_tac.quan_sat&&P.L.tuong_tac.quan_sat.bang)||[];
    const nObs=st.obs?Object.keys(st.obs).length:0;
    el.innerHTML=`<div class="note">Bé tham gia ${Object.values(st.answers||{}).filter(a=>a.seen).length}/${P.points.length} hoạt động chạm tranh. Người lớn đã quan sát ${nObs}/${bang.length} chỉ số.</div>
    ${st.done?`<div class="verdict dat">Bé đã hoàn thành bài học cùng người lớn 🧸</div>`:""}`;
    return;
  }
  const pc=x=>x==null?"-":Math.round(x*100)+"%";
  el.innerHTML=`<div class="scorebox">
    <div class="sc"><b>${pc(st.vid)}</b><span>Trong video (40%)</span></div>
    <div class="sc"><b>${pc(st.mast)}</b><span>Thành thạo (40%)</span></div>
    <div class="sc"><b>${pc(st.essay)}</b><span>Tự luận (20%)</span></div>
  </div>
  ${st.total!=null?`<div class="verdict ${st.verdict}">${st.verdict==="nc"?"🏅 Nâng cao":st.verdict==="dat"?"✅ Đạt":"Chưa đạt - xem lại các mốc video gợi ý"} · Tổng: ${Math.round(st.total*100)}%${st.provisional?" (tạm tính - còn phần chưa làm)":""}</div>`:`<div class="note" style="margin-top:8px">Xem video, trả lời các điểm dừng rồi làm bài thành thạo để nhận điểm.</div>`}`;
}

/* ================= KK-TRỢ GIẢNG (chạy trong trình duyệt) ================= */
function initTutor(){
  const box=$("#tutorBox"); if(!box||!P) return;
  const L=P.L, st=P.st, ix=TG.build(L), ms=$("#tMsgs"), chipsEl=$("#tChips"), used=new Set();
  let cur=null;
  const add=(cls,html)=>{ const d=document.createElement("div"); d.className="tmsg "+cls; d.innerHTML=html; ms.appendChild(d); ms.scrollTop=ms.scrollHeight; return d; };
  const setChips=h=>{ chipsEl.innerHTML=h||""; };
  const base=TG.chip("ask","Tóm tắt bài",{q:"Tóm tắt bài học"})+TG.chip("ask","Giải thích đoạn đang xem",{q:"Giải thích đoạn đang xem"})+TG.chip("practice","Cho em câu luyện tập",{})+TG.chip("ask","Em đang yếu chỗ nào?",{q:"Em đang yếu chỗ nào"});
  add("a",`Chào em! Mình là KK-Trợ giảng của bài <b>${esc(L.bai)}</b>. Mình trả lời <b>chỉ dựa trên nội dung bài này</b>, kèm mốc thời gian để em nghe lại đúng đoạn. Em hỏi khái niệm, ví dụ, "vì sao", hoặc bấm nút bên dưới nhé.`);
  setChips(base);
  const doneQs=()=>TG.analyse(L,st).done.map(r=>r.q).filter(q=>(q.loai==="mcq"||q.loai==="tf"));
  function nextPractice(){
    ix.okq=new Set(Object.keys(st.answers||{}).filter(k=>st.answers[k]&&st.answers[k].done));
    /* chỉ dùng câu em ĐÃ làm xong (đã biết đáp án) hoặc câu điền khuyết tự sinh từ lời giảng: không lộ đáp án câu chưa làm */
    const pool=doneQs().filter(q=>!used.has(q.id));
    let q=null;
    if(pool.length&&(used.size%2===0||!pool.length)) q=pool[Math.floor(Math.random()*pool.length)];
    if(!q){ q=TG.cloze(ix,Date.now()%9973+used.size); }
    if(!q){ add("a","Bài này chưa đủ dữ liệu để mình tự ra câu. Em làm các điểm dừng trong video trước nhé."); return; }
    used.add(q.id); cur=q;
    const opts=q.loai==="tf"?["Đúng","Sai"]:q.lua_chon;
    add("a",`<b>Luyện tập${q.gen?" (điền từ)":" (ôn lại)"}:</b> ${esc(q.hoi)}<div class="topts">${opts.map((o,i)=>`<button class="tchip topt" data-act="pick" data-i="${i}">${esc(o)}</button>`).join("")}</div><span class="note">Câu luyện tập không tính vào điểm chính thức.</span>`);
    setChips("");
  }
  function pick(i,btn){
    if(!cur||btn.parentNode.dataset.done) return; btn.parentNode.dataset.done="1";
    const q=cur; const ok=q.loai==="tf"?((i===0)===(q.dap_an===true||q.dap_an===1)):(i===q.dap_an);
    st.pracN=(st.pracN||0)+1; if(ok) st.pracOk=(st.pracOk||0)+1;
    btn.classList.add(ok?"tok":"tbad");
    const hit=TG.search(ix,(q.giai_thich||q.hoi||""),1)[0]; const t=q.quay_lai_t!=null?q.quay_lai_t:(q.t!=null?q.t:(hit&&hit.p.t0!=null?hit.p.t0:null));
    add("a",`${ok?"✅ <b>Đúng rồi!</b>":"❌ <b>Chưa đúng.</b>"} ${esc(q.giai_thich||"")}`);
    setChips(TG.chip("practice","Câu khác",{})+(t!=null?TG.chip("seek","▶ Nghe lại đoạn "+TG.fmt(t),{t}):"")+TG.chip("ask","Em đang yếu chỗ nào?",{q:"Em đang yếu chỗ nào"}));
    saveProgress(P.code);
  }
  function status(){
    const a=TG.analyse(L,st);
    if(!a.done.length){ add("a","Em chưa làm câu hỏi nào có chấm điểm nên mình chưa thấy được chỗ yếu. Xem video và trả lời các điểm dừng trước nhé, rồi quay lại hỏi mình."); setChips(base); return; }
    const weak=Object.keys(a.by).filter(b=>a.by[b].ok/a.by[b].n<.6).map(b=>TG.BL[b]||b);
    add("a",`Em đã làm <b>${a.done.length}</b> câu, đúng <b>${Math.round(a.acc*100)}%</b>, chỉ số học tập <b>${a.idx}/100</b>.${weak.length?` Mức tư duy cần luyện thêm: <b>${weak.join(", ")}</b>.`:" Chưa thấy mức tư duy nào yếu."}${a.wrong.length?` Còn <b>${a.wrong.length}</b> câu chưa đúng - bấm "Báo cáo" để xem và nghe lại đúng đoạn.`:""}`);
    setChips(TG.chip("report","📊 Xem báo cáo đầy đủ",{})+TG.chip("practice","Luyện tập ngay",{}));
  }
  function ask(q){
    q=String(q||"").trim(); if(!q) return;
    ix.okq=new Set(Object.keys(st.answers||{}).filter(k=>st.answers[k]&&st.answers[k].done));

  }
  const act=e=>{
    const b=e.target.closest(".tchip"); if(!b) return; const k=b.dataset.act;

    else if(k==="ask") ask(b.dataset.q);

  };
  ms.onclick=act; chipsEl.onclick=act;
  const go=()=>{ const inp=$("#tIn"); const q=inp.value; inp.value=""; ask(q); };
  $("#tSend").onclick=go; $("#tIn").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });

const VI_D=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
function viGroup(n,full){
  const h=Math.floor(n/100), t=Math.floor(n%100/10), u=n%10, s=[];
  if(h>0||full) s.push(VI_D[h]+" trăm");
  if(t>1){ s.push(VI_D[t]+" mươi"); if(u===1) s.push("mốt"); else if(u===5) s.push("lăm"); else if(u===4) s.push("tư"); else if(u>0) s.push(VI_D[u]); }
  else if(t===1){ s.push("mười"); if(u===5) s.push("lăm"); else if(u>0) s.push(VI_D[u]); }
  else if(u>0){ if(h>0||full) s.push("lẻ"); s.push(VI_D[u]); }
  return s.join(" ");
}
function viNum(str){
  let s=String(str).replace(/^0+(?=\d)/,"");
  if(s==="0") return "không";
  if(s.length>12) return s.split("").map(d=>VI_D[+d]).join(" ");
  const g=[]; while(s.length){ g.unshift(s.slice(-3)); s=s.slice(0,-3); }

  g.forEach((x,i)=>{ const v=+x; if(!v) return; out.push(viGroup(v,i>0)+(nm[g.length-1-i]?" "+nm[g.length-1-i]:"")); });
  return out.join(" ");
}
function viDigits(s){ return String(s).split("").map(d=>/\d/.test(d)?VI_D[+d]:d).join(" "); }

function viRoman(r){
  const v={I:1,V:5,X:10,L:50,C:100}; let n=0;
  for(let i=0;i<r.length;i++){ const a=v[r[i]],b=v[r[i+1]]||0; n+= a<b?-a:a; }
  const back=n=>{ const t=[[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]]; let s=""; t.forEach(([k,c])=>{ while(n>=k){ s+=c; n-=k; } }); return s; };
  return (n>0&&n<200&&back(n)===r)?n:null;
}
/* Phiên âm tự động từ nước ngoài → các âm tiết tiếng Việt hợp lệ (dùng khi từ chưa có trong từ điển) */
function viTranslit(word){
  let w=String(word).toLowerCase().replace(/[^a-z]/g,"");
  if(!w) return "";
  if(VI_DICT[w]) return VI_DICT[w];
  if(w.length<=2) return viSpell(w);
  w=w.replace(/tion$/,"§#sần").replace(/sion$/,"§#giân").replace(/ture$/,"§#chơ").replace(/ology$/,"§#ô§#lô§#gi").replace(/ics?$/,"§#ích").replace(/ism$/,"§#i§#dơm")
     .replace(/ch(?=[lr])/g,"c").replace(/^chr|^chl/,m=>"c"+m[2]).replace(/ph/g,"f").replace(/ck/g,"k").replace(/sh/g,"s").replace(/th/g,"t").replace(/wh/g,"w").replace(/gh/g,"g").replace(/qu/g,"kw").replace(/x/g,"ks").replace(/ee|ea|ie/g,"i").replace(/oo|ou/g,"u").replace(/ai|ay|ei|ey/g,"A").replace(/y(?=[^aeiou]|$)/g,"i").replace(/e$/,"");
  const out=[]; const V="aeiouyA"; let i=0;
  const onsetMap=(c,nx)=>{
    if(!c) return "";
    if(c==="c") return /[eiy]/.test(nx||"")?"x":"c";
    if(c==="k") return /[eiyê]/.test(nx||"")?"k":"c";
    if(c==="g") return /[eiy]/.test(nx||"")?"gi":"g";
    return ({f:"ph",j:"gi",z:"d",w:"u",q:"c",s:"x",d:"đ"})[c]||c;
  };
  const codaMap={c:"c",k:"c",g:"c",q:"c",t:"t",d:"t",z:"t",s:"t",x:"t",p:"p",b:"p",f:"p",v:"p",m:"m",n:"n",l:"n",r:"",h:"",w:"",j:"t",y:"i"};
  const parts=w.split("§"); const res=[];
  parts.forEach(seg=>{
    if(!seg) return; if(seg[0]==="#"){ res.push(seg.slice(1)); return; }
    let s=seg; i=0;
    while(i<s.length){
      let on=""; while(i<s.length&&!V.includes(s[i])) on+=s[i++];
      let vw=""; while(i<s.length&&V.includes(s[i])) vw+=s[i++];
      let cd=""; let j=i; while(j<s.length&&!V.includes(s[j])) cd+=s[j++];
      if(j<s.length&&cd.length){ /* giữ 1 phụ âm cho âm tiết sau */ if(cd.length===1){ cd=""; } else { cd=cd[0]; } i+=cd.length; } else { i=j; if(cd.length>1) cd=(codaMap[cd[0]]?cd[0]:cd.slice(-1)); }
      if(!vw){ /* cụm phụ âm cuối không có nguyên âm */ on.split("").forEach(c=>res.push(onsetMap(c,"ơ")+"ơ")); continue; }
      /* cụm phụ âm đầu: tách thành âm tiết "ơ" (pr → pơ r...) trừ tr/ch */
      let pre=""; if(on.length>1&&!/^(tr|ch|kw)$/.test(on)){ on.slice(0,-1).split("").forEach(c=>res.push(onsetMap(c,"ơ")+(c==="s"?"ờ":"ơ"))); on=on.slice(-1); }
      if(on==="kw") on="qu";
      let v=vw.length>2?vw.slice(0,2):vw;
      v=v.replace("A","ây"); if(v.length>3) v="ây"; v=({ea:"i",oa:"oa",ia:"ia",io:"i ô",eo:"ê ô",ue:"u",ui:"ui",ua:"ua",au:"o",eu:"ơ",oe:"ô",ae:"e",ao:"ao",iu:"iu",oi:"oi",ây:"ây",y:"i",u:"u",o:"ô",e:"e",a:"a",i:"i"})[v]||v;
      const on2=on==="qu"?"qu":onsetMap(on,v[0]);
      const sub=v.split(" ");
      sub.forEach((vv,k)=>{
        let syl=(k===0?on2:"")+vv+(k===sub.length-1?(codaMap[cd]!=null?codaMap[cd]:""):"");
        if(!viIsSyl(syl)) syl=(k===0?on2:"")+vv;
        if(!viIsSyl(syl)) syl=vv;
        res.push(syl);
      });
    }
  });
  return res.join(" ").replace(/\s+/g," ").trim();
}
/* Đọc một đoạn biểu thức toán */
function viMathSeg(seg){
  let s=seg;
  s=s.replace(/([A-Za-z])\s*\(\s*([A-Za-z0-9])\s*\)/g,(m,f,x)=>(VI_LET[f.toLowerCase()]?f:"")+" của "+x+" ");
  const toks=s.match(/\d+(?:[.,]\d+)?|[A-Za-z]+|[α-ωΑ-Ω]|²|³|√|π|∞|[=+\-−<>≤≥≠×·*/^:;|()'’]|của|\S/g)||[];
  const out=[];
  for(let k=0;k<toks.length;k++){
    const t=toks[k], nx=toks[k+1];
    if(/^\d/.test(t)){ out.push(viNumTok(t)); continue; }
    if(t==="của"){ out.push("của"); continue; }
    if(/^[A-Za-z]+$/.test(t)){
      const lw=t.toLowerCase();
      if(VI_FN[lw]){ out.push(VI_FN[lw]); continue; }
      const fn=Object.keys(VI_FN).sort((a,b)=>b.length-a.length).find(f=>lw.startsWith(f)&&lw.length>f.length&&lw.length<=f.length+2);
      if(fn){ out.push(VI_FN[fn]+" "+viSpell(t.slice(fn.length))); continue; }
      out.push(viSpell(t)); continue;
    }
    if(VI_GREEK[t]){ out.push(VI_GREEK[t]); continue; }
    const op={"=":"bằng","+":"cộng","-":"trừ","−":"trừ","<":"nhỏ hơn",">":"lớn hơn","≤":"nhỏ hơn hoặc bằng","≥":"lớn hơn hoặc bằng","≠":"khác","×":"nhân","·":"nhân","*":"nhân","/":"phần",":":"chia","²":"bình phương","³":"lập phương","√":"căn","∞":"vô cực","'":"phẩy","’":"phẩy",";":",","|":" ","(":" ",")":" "}[t];
    if(t==="^"){ const e=nx; if(e&&/^\d+$/.test(e)){ out.push(e==="2"?"bình phương":e==="3"?"lập phương":"mũ "+viNumTok(e)); k++; } else out.push("mũ"); continue; }
    if(t==="/"&&out.length&&/^\d/.test(toks[k-1]||"")&&/^\d/.test(nx||"")){ out.push("phần"); continue; }
    if(t==="/"){ out.push("chia"); continue; }
    if(op!=null){ out.push(op); continue; }
    out.push(t);
  }
  return " "+out.join(" ").replace(/\s+/g," ").trim()+" ";

/* Tách thành đoạn ngắn (<=130 ký tự) tại dấu câu để giọng AI ngắt nghỉ tự nhiên */
function viChunks(spoken){

    se=se.trim(); if(!se) return;

    const parts=se.match(/[^,:]+[,:]*/g)||[se]; let cur="";
    parts.forEach(p=>{ p=p.trim(); if((cur+" "+p).trim().length>130 && cur){ out.push(cur.trim()); cur=p; } else cur=(cur+" "+p).trim(); });
    if(cur) out.push(cur.trim());
  });
  // gộp đoạn quá ngắn (<18 ký tự) vào đoạn trước để tránh "cụt"
  const m=[]; out.forEach(c=>{ if(m.length&&c.length<18&&(m[m.length-1].length+c.length)<130) m[m.length-1]+=" "+c; else m.push(c); });

  let open=false; return m.map(c=>{ let x=(open?"⟪":"")+c; const o=(x.match(/⟪/g)||[]).length, cl=(x.match(/⟫/g)||[]).length; open=o>cl; return open?x+"⟫":x; });

  ws(0,"RIFF"); v.setUint32(4,36+tot*2,true); ws(8,"WAVE"); ws(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); ws(36,"data"); v.setUint32(40,tot*2,true);
  for(let i=0;i<n;i++){ let x=f32[i]*g; x=x<-1?-1:x>1?1:x; v.setInt16(44+i*2,x*32767,true); }
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
/* Ghi nhận tốc độ thật của máy: chậm thì không dùng giọng AI trong trình duyệt nữa (tự chuyển nhánh khác) */
function ttsRtfLimit(){ return (window.KKV_CFG&&window.KKV_CFG.rtfLimit)||1.8; }
function ttsSlow(){ const t=Number(LS.get("ttsSlow2",0))||0; return t>0&&Date.now()-t<7*864e5; }
function kkvPrewarm(){
  try{
    if(KKV.initP||!kkvAllowed()||ttsSlow()||azCfg()||LS.get("ttsVoice","auto")==="native-only") return;
    if(ttsVoices().length&&!/^kk-ai$/.test(LS.get("ttsVoice",""))) return;
    const c=navigator.connection; if(c&&c.effectiveType&&c.effectiveType!=="4g") return;
    setTimeout(async()=>{
      if(KKV.initP) return;
      try{
        await kkvInit();
        const t="Xin chào các em, chúng ta cùng học bài hôm nay nhé."; await kkvSynth(t);
        const r=await kkvSynth(t), rtf=r.ms/1000/Math.max(.5,r.audio.length/r.sr);
        LS.set("ttsSlow2",(rtf/Math.max(1,kkvPoolSize()))>ttsRtfLimit()?Date.now():0);
      }catch(e){}
    },3500);
  }catch(e){}
}

/* ---------------- Giọng nam Đám mây (Azure Neural, tùy chọn - quản trị nhập khóa một lần) ---------------- */
function azCfg(){
  try{ const s=(typeof S!=="undefined"&&S.settings)||{}; const ep=(window.KKV_CFG&&window.KKV_CFG.azEndpoint)||null; if((!s.azKey&&!ep)||KKV.cloudBad) return null; return {key:ep?"":(s.azKey||""),region:s.azRegion||"southeastasia",endpoint:ep}; }catch(e){ return null; }
}
function azHash(s){ let h1=5381,h2=52711; for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=((h1<<5)+h1)^c; h2=((h2<<5)+h2+c)|0; } return (h1>>>0).toString(36)+(h2>>>0).toString(36)+s.length; }
function azXml(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
async function azSynth(text,voice,cfg){
  const key="https://kk-tts.cache/"+voice+"/"+azHash(text); let cache=null;
  try{ if(window.caches){ cache=await caches.open("kk-tts-v1"); const hit=await cache.match(key); if(hit){ return {url:URL.createObjectURL(await hit.blob())}; } } }catch(e){ cache=null; }
  const url=cfg.endpoint||("https://"+cfg.region+".tts.speech.microsoft.com/cognitiveservices/v1");
  const enV=/HoaiMy/i.test(voice)?"en-US-AvaNeural":"en-US-AndrewNeural";
  const body=ttsSegs(text).map(g=>g.en? "<voice xml:lang='en-US' name='"+enV+"'>"+azXml(g.t)+"</voice>" : "<voice xml:lang='vi-VN' name='"+voice+"'>"+azXml(g.t)+"</voice>").join("")||("<voice xml:lang='vi-VN' name='"+voice+"'>"+azXml(text)+"</voice>");
  const ssml="<speak version='1.0' xml:lang='vi-VN'>"+body+"</speak>";
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),15000); let r;
  try{ r=await fetch(url,{method:"POST",headers:{...(cfg.key?{"Ocp-Apim-Subscription-Key":cfg.key}:{}),"Content-Type":"application/ssml+xml","X-Microsoft-OutputFormat":"audio-24khz-48kbitrate-mono-mp3"},body:ssml,signal:ctl.signal}); }
  finally{ clearTimeout(to); }
  if(!r.ok){ const e=new Error("Máy chủ giọng đọc trả về "+r.status); e.status=r.status; throw e; }
  const b=await r.blob(); if(b.size<400) throw new Error("Âm thanh rỗng");
  try{ if(cache) await cache.put(key,new Response(b.slice(),{headers:{"Content-Type":"audio/mpeg"}})); }catch(e){}
  return {url:URL.createObjectURL(b)};
}
/* Mở khóa âm thanh ngay trong cú bấm của người dùng (bắt buộc với Safari/iOS/Chrome) */
const KK_SIL="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=";
function ttsUnlock(){
  try{ const a=new Audio(); a.src=KK_SIL; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); TTS.audio=a; }catch(e){}
  try{ if("speechSynthesis" in window&&ttsVoices().length){ const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); } }catch(e){}
}

/* ---------------- Chọn giọng tự động ---------------- */
function ttsIsMale(v){ return /nam\s?minh|microsoft an\b|\bmale\b|\bnam\b/i.test(v.name)&&!/female|hoai\s?my|linh/i.test(v.name); }
function ttsRate(){ const r=Number(LS.get("ttsRate",1)); return (r>=0.6&&r<=1.5)?r:1; }
function ttsPick(vs){
  vs=vs||ttsVoices(); const saved=LS.get("ttsVoice",null);
  if(saved&&saved!=="auto"&&saved!=="auto-nu"&&saved!=="kk-ai"){ const f=vs.find(v=>v.voiceURI===saved||v.name===saved); if(f) return f; }
  const nu=saved==="auto-nu";
  const male=vs.find(ttsIsMale);
  const fem=vs.find(v=>/hoaimy/i.test(v.name))||vs.find(v=>/google/i.test(v.name))||vs.find(v=>/linh/i.test(v.name));
  return (nu?(fem||male):(male||fem))||vs[0]||null;
}
/* Trả về {engine:"native",voice} | {engine:"cloud",cv} | {engine:"ai"} | {engine:"text"} | null */
async function ttsChoose(opt){
  opt=opt||{}; const saved=LS.get("ttsVoice","auto");
  const cloud=opt.noCloud?null:azCfg();
  const vs=await ensureVoices(cloud?600:(kkvAllowed()?1500:4000));
  const cv=saved==="auto-nu"?"vi-VN-HoaiMyNeural":"vi-VN-NamMinhNeural";
  if(saved==="kk-cloud"&&cloud) return {engine:"cloud",cv:"vi-VN-NamMinhNeural"};
  if(saved==="kk-ai"&&kkvAllowed()) return {engine:"ai"};
  if(saved&&!/^(auto|auto-nu|kk-ai|kk-cloud)$/.test(saved)){ const f=vs.find(v=>v.voiceURI===saved||v.name===saved); if(f) return {engine:"native",voice:f}; }
  const nat=vs.length?ttsPick(vs):null;
  const wantF=saved==="auto-nu";
  if(cloud&&!(nat&&(wantF?!ttsIsMale(nat):ttsIsMale(nat)))) return {engine:"cloud",cv};
  if(nat) return {engine:"native",voice:nat};
  if(kkvAllowed()) return ttsSlow()?{engine:"text"}:{engine:"ai"};
  return null;
}

function ttsSetBtn(on){ const b=document.getElementById("ttsBtn"); if(b){ b.classList.toggle("on",!!on); b.innerHTML=on?"⏹ Dừng đọc":"🔊 Nghe giảng"; } }

function ttsStop(){
  TTS.sess=(TTS.sess||0)+1;
  TTS.on=false; TTS.items=[]; TTS.mode=null; TTS.paused=false; TTS.jump=null; TTS.togglePause=null;
  clearTimeout(TTS.textTimer); TTS.textTimer=null;
  try{ speechSynthesis.cancel(); }catch(e){}
  if(TTS.audio){ try{ TTS.audio.pause(); TTS.audio.removeAttribute("src"); TTS.audio.load(); }catch(e){} TTS.audio=null; }
  (TTS.urls||[]).forEach(u=>{ try{URL.revokeObjectURL(u);}catch(e){} }); TTS.urls=[];
  KKV.onProg=null;
  const bar=document.getElementById("ttsBar"); if(bar) bar.remove();
  ttsSetBtn(false);
}

/* ---------------- Đọc bằng giọng thiết bị ---------------- */
async function ttsSpeakNative(texts,voice,sess){
  TTS.on=true; TTS.mode="voice"; TTS.items=texts; TTS.idx=0;
  ttsSetBtn(true);
  const spoken=texts.map(t=>viNorm(t,{digits:false}));
  const say=()=>{
    if(TTS.sess!==sess||!TTS.on) return;
    if(TTS.idx>=texts.length){ ttsStop(); return; }
    const i=TTS.idx;
    ttsBarRender({label:`Lời giảng ${i+1}/${texts.length} · giọng ${voice?voice.name:"thiết bị"}`,text:texts[i]});
    const u=new SpeechSynthesisUtterance(spoken[i]); u.lang="vi-VN"; if(voice) u.voice=voice; u.rate=ttsRate(); u.pitch=1;
    u.onend=()=>{ if(TTS.sess===sess&&!TTS.paused&&TTS.idx===i){ TTS.idx++; setTimeout(say,140); } };
    u.onerror=()=>{ if(TTS.sess===sess&&TTS.idx===i){ TTS.idx++; setTimeout(say,140); } };
    try{ speechSynthesis.speak(u); }catch(e){ ttsStop(); }
  };
  TTS.jump=d=>{ TTS.idx=Math.max(0,Math.min(texts.length,TTS.idx+d)); try{ speechSynthesis.cancel(); }catch(e){} TTS.paused=false; setTimeout(say,60); };
  TTS.togglePause=()=>{ TTS.paused=!TTS.paused; try{ TTS.paused?speechSynthesis.pause():speechSynthesis.resume(); }catch(e){} ttsBarRender({label:`Lời giảng ${TTS.idx+1}/${texts.length} · giọng ${voice?voice.name:"thiết bị"}`,text:texts[TTS.idx]||""}); };
  say();
}

/* ---------------- Bộ phát theo đoạn: giọng nam AI KK (trình duyệt) hoặc giọng Đám mây ---------------- */
async function ttsSpeakAI(texts,sess,o){
  o=o||{}; const cloud=o.eng==="cloud", cfg=cloud?azCfg():null;
  if(cloud&&!cfg) return ttsSpeak(texts,{noCloud:true});
  TTS.on=true; TTS.mode=cloud?"cloud":"ai"; TTS.items=texts; TTS.idx=0; ttsSetBtn(true);
  const who=cloud?"giọng nam Đám mây":"giọng nam AI KK";
  if(!cloud){
    const renderLoad=p=>{ if(TTS.sess!==sess) return; ttsBarRender({label:"Giọng nam AI KK · chuẩn bị",text:texts[0]||"",status:p>0?"Đang nạp giọng AI lần đầu: "+p+"% ("+kkvMB()+" MB, chỉ một lần - các lần sau mở ngay)":"Đang khởi động giọng AI trong trình duyệt...",pct:p>0?p:null}); };
    renderLoad(KKV.state==="ready"?100:0);
    if(KKV.state!=="ready"){
      KKV.onProg=renderLoad;
      try{ await kkvInit(); }catch(e){
        if(TTS.sess!==sess) return;
        ttsStop(); toast("Không nạp được giọng AI ("+(e.message||"lỗi mạng")+") - chuyển sang giọng khác");
        return ttsSpeak(texts,{noAI:true,slow:true});
      }
      KKV.onProg=null; if(TTS.sess!==sess) return;
    }
  }
  const units=[]; texts.forEach((t,i)=>{ viChunks(viNorm(t)).forEach((c,k)=>units.push({i,k,c})); });
  if(!units.length){ ttsStop(); return; }
  const buf=[]; let cur=0; const startOf={};
  units.forEach((u,j)=>{ if(startOf[u.i]==null) startOf[u.i]=j; });
  if(!TTS.audio) TTS.audio=new Audio();
  TTS.audio.preservesPitch=true; TTS.audio.mozPreservesPitch=true; TTS.audio.webkitPreservesPitch=true; TTS.urls=[];
  const alive=()=>TTS.sess===sess&&TTS.on;
  const curI=()=>units[Math.min(cur,units.length-1)].i;
  const lab=()=>"Lời giảng "+(curI()+1)+"/"+texts.length+" · "+who;
  const show=st=>ttsBarRender({label:lab(),text:texts[curI()],status:st||""});
  const bail=(msg,opt)=>{ const rest=texts.slice(curI()); ttsStop(); toast(msg); ttsSpeak(rest,opt); };
  let failCount=0;
  (async()=>{
    while(alive()){
      let j=-1; for(let x=cur;x<Math.min(units.length,cur+4);x++){ if(!buf[x]){ j=x; break; } }
      if(j<0){ if(cur>=units.length) break; await new Promise(r=>setTimeout(r,120)); continue; }
      buf[j]={url:null,dur:0,busy:true};
      try{
        if(cloud){
          const r=await azSynth(units[j].c,o.cv||"vi-VN-NamMinhNeural",cfg); if(!alive()){ try{URL.revokeObjectURL(r.url);}catch(e){} return; }
          TTS.urls.push(r.url); buf[j]={url:r.url,dur:0};
        } else {
          const r=await kkvSynth(units[j].c); if(!alive()) return;
          const dur=r.audio.length/r.sr; KKV.rtf.push(r.ms/1000/Math.max(.5,dur));
          const url=kkvWav(r.audio,r.sr); TTS.urls.push(url); buf[j]={url,dur};
          if(KKV.rtf.length>=2){
            const n=Math.min(4,KKV.rtf.length), avg=KKV.rtf.slice(-n).reduce((a,b)=>a+b,0)/n;
            if((n>=3&&avg>ttsRtfLimit())||(n>=2&&avg>ttsRtfLimit()*1.6)){ LS.set("ttsSlow2",Date.now()); return bail(ttsVoices().length?"Máy xử lý giọng AI hơi chậm - chuyển sang giọng của thiết bị cho mượt":"Máy này chưa đủ nhanh cho giọng AI trong trình duyệt - chuyển sang chế độ chữ chạy",{noAI:true,slow:true}); }
          }
        }
      }catch(e){
        if(!alive()) return;
        failCount++; buf[j]={url:null,dur:0};
        if(cloud&&(failCount>=2||[401,403,429].includes(e.status))){ KKV.cloudBad=true; return bail("Giọng nam Đám mây tạm thời không dùng được - chuyển sang giọng khác",{noCloud:true}); }
        if(!cloud&&failCount>=4) return bail("Giọng AI gặp lỗi - chuyển sang giọng khác",{noAI:true,slow:true});
      }
    }
  })();
  const playNext=async()=>{
    if(!alive()) return;
    if(cur>=units.length){ ttsStop(); return; }
    if(!buf[cur]||buf[cur].busy){ show("Đang chuẩn bị đoạn tiếp theo..."); await new Promise(r=>setTimeout(r,160)); return playNext(); }
    const b=buf[cur];
    if(!b.url){ cur++; return playNext(); }
    TTS.idx=units[cur].i; show("");
    const a=TTS.audio; a.src=b.url; a.playbackRate=ttsRate();
    a.onended=()=>{ if(!alive()) return; cur++; setTimeout(playNext,units[cur-1]&&units[cur]&&units[cur-1].i!==units[cur].i?260:110); };
    a.onerror=()=>{ if(!alive()) return; cur++; setTimeout(playNext,60); };
    try{ await a.play(); }catch(e){ if(alive()){ TTS.paused=true; show("Bấm ▶ Tiếp để nghe (trình duyệt chặn tự phát)"); } }
  };
  TTS.jump=d=>{ const ni=Math.max(0,Math.min(texts.length-1,curI()+d)); cur=startOf[ni]!=null?startOf[ni]:cur; TTS.paused=false; try{ TTS.audio.pause(); }catch(e){} playNext(); };
  TTS.togglePause=()=>{ TTS.paused=!TTS.paused; if(TTS.paused){ try{ TTS.audio.pause(); }catch(e){} } else { TTS.audio.play().catch(()=>playNext()); } show(""); };
  playNext();
}

async function ttsSpeak(texts,opt){
  opt=opt||{};
  ttsStop(); const sess=TTS.sess;
  texts=(texts||[]).filter(t=>t&&String(t).trim()).map(String);
  if(!texts.length) return;
  if(!opt.noUnlock) ttsUnlock();
  TTS.on=true; ttsSetBtn(true);
  ttsBarRender({label:"Giọng đọc AI",text:texts[0],status:"Đang chọn giọng đọc phù hợp nhất cho thiết bị của bạn..."});
  let ch=await ttsChoose(opt);
  if(TTS.sess!==sess) return;
  if(opt.noAI&&ch&&ch.engine==="ai"){ const vs=ttsVoices(); ch=vs.length?{engine:"native",voice:ttsPick(vs)}:(opt.slow?{engine:"text"}:null); }
  if(!ch){ ttsStop(); openVoiceHelp(texts); return; }
  if(ch.engine==="text"){ toast("Máy này chưa đủ nhanh cho giọng AI trong trình duyệt - dùng chế độ chữ chạy"); return ttsText(texts); }
  if(ch.engine==="native") return ttsSpeakNative(texts,ch.voice,sess);
  if(ch.engine==="cloud") return ttsSpeakAI(texts,sess,{eng:"cloud",cv:ch.cv});
  return ttsSpeakAI(texts,sess,{eng:"ai"});
}

  $("#vpTest").onclick=()=>{ apply(); closeModal(); nrUnlock(); nrSay("Xin chào các em, chúng ta cùng học bài hôm nay nhé! Mô hình ô ét ai chia việc truyền dữ liệu thành bảy tầng.",null,ttsRate()); };

/* ---------------- Người dẫn bài (NR): đọc từng câu lời giảng ĐỒNG BỘ với video, một màn hình duy nhất ---------------- */
const NR={pc:new Map(),eng:null,sess:0,audio:null,primed:false,paused:false,timer:null,kick:null,rtf:[]};
function nrUnlock(){
  try{ if(!NR.audio){ const a=new Audio(); a.src=KK_SIL; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); try{ a.preservesPitch=true; a.mozPreservesPitch=true; a.webkitPreservesPitch=true; }catch(e){} NR.audio=a; } }catch(e){}
  try{ if(!NR.primed&&("speechSynthesis" in window)&&ttsVoices().length){ NR.primed=true; const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); } }catch(e){}
}
async function nrEngine(){ if(NR.eng) return NR.eng; const e=await ttsChoose({}); NR.eng=e||{engine:"text"}; return NR.eng; }
function nrCancel(){
  try{ KKV.q.forEach(i=>{ i.prio=1; }); }catch(e){}
  NR.sess++; clearTimeout(NR.timer); NR.paused=false; NR.kick=null;
  try{ speechSynthesis.cancel(); }catch(e){}
  if(NR.audio){ try{ NR.audio.onended=null; NR.audio.onerror=null; NR.audio.pause(); }catch(e){} }
}
function nrPause(){ NR.paused=true; try{ speechSynthesis.pause(); }catch(e){} try{ if(NR.audio) NR.audio.pause(); }catch(e){} }
function nrResume(){ if(!NR.paused) return; NR.paused=false; try{ speechSynthesis.resume(); }catch(e){} if(NR.kick) NR.kick(); }
function nrRevoke(u){ try{ URL.revokeObjectURL(u); }catch(e){} }
const NR_LOOK=4;
function nrGet(eng,c,prio,items){
  if(eng.engine==="cloud"){ const cfg=azCfg(); if(!cfg) return Promise.reject(new Error("cloud off")); return azSynth(c,eng.cv||"vi-VN-NamMinhNeural",cfg).then(r=>r.url); }
  const pr=kkvSynth(c,prio); if(pr.item) items.push(pr.item);
  return pr.then(r=>{ NR.rtf.push(r.ms/1000/Math.max(.5,r.audio.length/r.sr)); return kkvWav(r.audio,r.sr); });
}
function nrEntry(eng,text,prio){
  const key=eng.engine+"|"+(eng.cv||"")+"|"+text; let e=NR.pc.get(key);
  if(e){ if(!prio) e.items.forEach(i=>{ i.prio=0; }); return e; }
  const items=[]; e={key,items,chunks:viChunks(viNorm(text,{en:eng.engine==="cloud"})).map(c=>{ const p=nrGet(eng,c,prio||0,items); p.catch(()=>{}); return p; })};
  NR.pc.set(key,e); return e;
}
function nrDrop(e){ NR.pc.delete(e.key); (e.items||[]).forEach(i=>{ i.dead=true; }); e.chunks.forEach(p=>p.then(nrRevoke,()=>{})); }
/* Tổng hợp trước các câu sắp đọc (giọng AI/Đám mây) để chuyển khung không bị hụt tiếng */
function nrPrefetch(texts){
  const eng=NR.eng; if(!eng||(eng.engine!=="ai"&&eng.engine!=="cloud")) return;
  if(eng.engine==="ai"&&KKV.state!=="ready") return;
  texts.forEach(t=>{ if(t) nrEntry(eng,String(t),1); });
}
function nrFlush(){ NR.pc.forEach(e=>{ (e.items||[]).forEach(i=>{ i.dead=true; }); e.chunks.forEach(p=>p.then(nrRevoke,()=>{})); }); NR.pc.clear(); kkvPump(); }
async function nrSay(text,done,rate,depth){
  depth=depth||0; nrCancel(); const my=NR.sess; let fin=false; text=String(text||"");
  const end=()=>{ if(fin||NR.sess!==my) return; fin=true; clearTimeout(NR.timer); NR.kick=null; if(done) done(); };
  const arm=ms=>{ clearTimeout(NR.timer); NR.timer=setTimeout(()=>{ if(NR.sess!==my) return; if(NR.paused) arm(4000); else end(); },ms); };
  arm(9000+text.length*150);
  let eng; try{ eng=await nrEngine(); }catch(e){ eng={engine:"text"}; }
  if(NR.sess!==my) return;
  if(!eng||eng.engine==="text"){ end(); return; }
  if(eng.engine==="ai"&&KKV.state==="loading"&&KKV.initP){ arm(16000); try{ await Promise.race([KKV.initP,new Promise(r=>setTimeout(r,12000))]); }catch(e){} if(NR.sess!==my) return; }
  if(eng.engine==="ai"&&KKV.state!=="ready"){
    if(KKV.state==="idle"||KKV.state==="fail"){ toast("Đang nạp giọng AI lần đầu ("+kkvMB()+" MB) - bài học vẫn chạy bằng chữ, lần sau có tiếng ngay"); kkvInit().catch(()=>{ NR.eng={engine:"text"}; }); }
    end(); return;
  }
  if(eng.engine==="native"){
    /* Chrome (giọng Google từ xa) tự ngắt sau ~15 giây nếu đọc một câu dài → chia câu ngắn, đọc nối tiếp */
    const enV=ttsEnVoice(), parts=[];
    viChunks(viNorm(text,{digits:false,en:true})).forEach(c=>ttsSegs(c).forEach(g=>{ if(g.en&&enV) parts.push(g); else parts.push({en:false,t:g.en?ttsPlain("⟪"+g.t+"⟫"):g.t}); }));
    if(!parts.length){ end(); return; }
    let k=0;
    const next=()=>{
      if(NR.sess!==my||fin) return;
      if(k>=parts.length){ end(); return; }
      const g=parts[k++], u=new SpeechSynthesisUtterance(g.t);
      if(g.en){ u.lang=enV.lang||"en-US"; u.voice=enV; u.rate=(rate||1)*0.92; } else { u.lang="vi-VN"; if(eng.voice) u.voice=eng.voice; u.rate=rate||1; } u.pitch=1;
      u.onend=next; u.onerror=next;
      try{ speechSynthesis.speak(u); if(NR.paused) speechSynthesis.pause(); }catch(e){ end(); }
    };
    next(); return;
  }
  const ent=nrEntry(eng,text); if(!ent.chunks.length){ nrDrop(ent); end(); return; }
  const urls=[];
  try{
    for(let i=0;i<ent.chunks.length;i++){
      const url=await ent.chunks[i]; if(NR.sess!==my) return; urls.push(url);
      await new Promise(res=>{ const a=NR.audio; a.onended=res; a.onerror=res; a.src=url; a.playbackRate=rate||1; NR.kick=()=>{ a.play().catch(res); }; if(!NR.paused) NR.kick(); });
      if(NR.sess!==my) return;
    }
    nrDrop(ent);
    if(eng.engine==="ai"&&NR.rtf.length>=2){ const n=Math.min(4,NR.rtf.length), avg=NR.rtf.slice(-n).reduce((a,b)=>a+b,0)/n/Math.max(1,kkvReady()); if(avg>ttsRtfLimit()){ LS.set("ttsSlow2",Date.now()); NR.eng=null; NR.rtf=[]; nrFlush(); toast("Máy xử lý giọng AI hơi chậm - bài học chuyển sang chữ chạy cho mượt"); } }
  }catch(e){
    nrDrop(ent);
    if(NR.sess!==my) return;
    if(eng.engine==="cloud"){ KKV.cloudBad=true; NR.eng=null; toast("Giọng Đám mây tạm thời không dùng được - chuyển giọng khác"); }
    else { LS.set("ttsSlow2",Date.now()); NR.eng=null; }
    if(depth<1&&!fin){ fin=true; clearTimeout(NR.timer); return nrSay(text,done,rate,depth+1); } /* đọc lại ngay câu đó bằng giọng kế tiếp */
  }
  end();
}
</script>

<script>
"use strict";
/* ================================================================
   PHÂN HỆ 4 - KK-EXAM: KIỂM TRA - ĐÁNH GIÁ - KHẢO SÁT - HỌC BẠ
   Thiết kế theo khoa học đo lường giáo dục:
   - Ma trận đề (test blueprint): phân bố câu theo CHƯƠNG (tỷ lệ ngân hàng)
     và theo MỨC TƯ DUY BLOOM (nhớ/hiểu ~65%, vận dụng ~35%)
   - Trộn đề theo từng học sinh (seed = uid + mã kỳ thi): cùng ma trận,
     khác thứ tự câu và thứ tự phương án - công bằng, hạn chế trao đổi
   - 3 kỳ: Cuối chương → Giữa năm (nửa đầu) → Cuối năm (toàn sách)
   - Điều kiện dự thi chính thức: hoàn thành ≥70% số bài trong phạm vi
     (mastery learning); đang bật xác thực thì phải xác thực độ tuổi
   - Lần 1 = điểm CHÍNH THỨC, các lần sau = luyện tập (ghi rõ)
   - Không gợi ý khi thi; nộp xong mới hiện đáp án + giải thích + link ôn lại
   - Điểm năm = 30% quá trình + 20% TB cuối chương + 20% giữa năm + 30% cuối năm
   - Tiểu học: Hoàn thành/HT Tốt, không xếp hạng · Mầm non: quan sát, không thi
   ================================================================ */
const EXAM_CFG = {
  nByLevel: { "Tiểu học":{chuong:10, giua:15, cuoi:25}, default:{chuong:15, giua:25, cuoi:40} },
  secPerQ: 90,                 // 90 giây/câu (chuẩn 40 câu = 60 phút)
  passPct: 70, goodPct: 80, excPct: 90,
  bloomTarget: 0.35,           // tỷ lệ câu vận dụng mong muốn
  needDonePct: 0.7,            // điều kiện dự thi chính thức
};
function examN(b){ return EXAM_CFG.nByLevel[b.level] || EXAM_CFG.nByLevel.default; }
function chapterOf(ma){ const m=(ma||"").match(/\.C(\d+)\./); return m?("C"+m[1]):"C01"; }
/* --- bộ sinh ngẫu nhiên có hạt giống: cùng người + cùng kỳ = cùng đề --- */
function seedHash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ let a=seed; return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function shuf(arr, r){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
/* --- gom ngân hàng câu hỏi từ gói bài học --- */
function examBank(pack, lessonIdxs){
  const bank=[];
  lessonIdxs.forEach(li=>{
    const L=pack.lessons[li]; if(!L||!L.tuong_tac) return;
    const push=(q,src)=>{ if(!q||!["mcq","tf","num","order"].includes(q.loai)) return; if(q.dap_an===undefined||q.dap_an===null) return;
      bank.push({q, li, ma:L.ma, bai:L.bai, ch:chapterOf(L.ma), bloom:(q.bloom==="vandung"?"vandung":(q.bloom==="hieu"?"hieu":"nho")), src}); };
    (L.tuong_tac.diem||[]).forEach(q=>push(q,"video"));
    (L.tuong_tac.ngan_hang||[]).forEach(q=>push(q,"nh"));
  });
  return bank;
}
/* --- rút đề theo ma trận: chia theo chương (tỷ lệ), cân bằng Bloom --- */
function draftExam(bank, N, seed){
  const r=rng(seed);
  const byCh={}; bank.forEach(it=>{ (byCh[it.ch]=byCh[it.ch]||[]).push(it); });
  const chs=Object.keys(byCh).sort();
  const total=bank.length; N=Math.min(N,total);
  // phân bổ số câu mỗi chương theo tỷ lệ ngân hàng (phần dư lớn nhất)
  const quota={}; let used=0;
  const fracs=chs.map(c=>{ const exact=N*byCh[c].length/total; const base=Math.floor(exact); quota[c]=base; used+=base; return {c, f:exact-base}; });
  fracs.sort((a,b)=>b.f-a.f); for(let i=0;i<N-used;i++) quota[fracs[i%fracs.length].c]++;
  const picked=[];
  chs.forEach(c=>{
    const pool=shuf(byCh[c], r);
    const vd=pool.filter(x=>x.bloom==="vandung"), nb=pool.filter(x=>x.bloom!=="vandung");
    const k=quota[c]; const kvd=Math.min(vd.length, Math.round(k*EXAM_CFG.bloomTarget));
    picked.push(...vd.slice(0,kvd), ...nb.slice(0,k-kvd));
    const miss=k-Math.min(k, kvd+nb.length); if(miss>0) picked.push(...vd.slice(kvd,kvd+miss));
  });
  // trộn thứ tự câu + trộn phương án (giữ ánh xạ đáp án)
  return shuf(picked, r).map((it,ix)=>{
    const q=it.q; let opts=null, map=null;
    if(q.loai==="mcq"){ map=shuf(q.lua_chon.map((_,i)=>i), r); opts=map.map(i=>q.lua_chon[i]); }
    if(q.loai==="order"){ map=shuf(q.lua_chon.map((_,i)=>i), r); opts=map.map(i=>q.lua_chon[i]); }
    return {n:ix+1, it, opts, map, ans:null, flag:false};
  });
}
/* --- danh sách kỳ thi của một cuốn sách --- */
function examDefs(b, pack){
  if(b.level==="Mầm non") return [];
  const n=examN(b);
  const chs=[...new Set(pack.lessons.map(L=>chapterOf(L.ma)))].sort();
  const idxOfCh=c=>pack.lessons.map((L,i)=>chapterOf(L.ma)===c?i:-1).filter(i=>i>=0);
  const defs=chs.map(c=>({id:"CH-"+c, kind:"chuong", ten:"Cuối chương "+Number(c.slice(1)), scope:idxOfCh(c), nQ:n.chuong}));
  const half=chs.slice(0, Math.ceil(chs.length/2));
  defs.push({id:"GN", kind:"giua", ten:"Kiểm tra Giữa năm", scope:half.flatMap(idxOfCh), nQ:n.giua, moTa:"Phạm vi: chương 1-"+half.length});
  defs.push({id:"CN", kind:"cuoi", ten:"Thi Cuối năm", scope:pack.lessons.map((_,i)=>i), nQ:n.cuoi, moTa:"Tổng hợp toàn bộ "+pack.lessons.length+" bài"});
  return defs;
}
function examStoreKey(code,defId){ return "exam-"+code+"-"+defId; }
function myExams(code){
  const out={};
  for(const k in (S.examCache||{})){ if(k.startsWith(code+"|")) out[k.split("|")[1]]=S.examCache[k]; }
  return out;
}
async function loadMyExams(code){
  S.examCache=S.examCache||{};
  const local=LS.get("exams",{}); for(const k in local){ if(k.startsWith(code+"|")) S.examCache[k]=local[k]; }
  if(S.caps.db&&S.uid){
    try{ const pg=await S.caps.db.collection("data/users/"+S.uid).limit(500).get();
      pg.docs.forEach(d=>{ if(d.exists&&d.id.startsWith("exam-"+code+"-")){ const r=d.data(); S.examCache[code+"|"+d.id.slice(("exam-"+code+"-").length)]=r; } });
    }catch(e){}
  }
  return myExams(code);
}
async function saveExamResult(code, defId, res){
  S.examCache=S.examCache||{}; S.examCache[code+"|"+defId]=res;
  const local=LS.get("exams",{}); local[code+"|"+defId]=res; LS.set("exams",local);
  if(S.caps.db&&S.uid){ try{ await S.caps.db.doc("data/users/"+S.uid+"/"+examStoreKey(code,defId)).set(JSON.parse(JSON.stringify(res))); }catch(e){} }
}
/* --- điều kiện dự thi (mastery learning) --- */
function examGate(b, pack, def){
  if(S.isAdmin) return {ok:true, official:!(myExams(b.code)[def.id])};
  if(!S.profile||!myGrade()) return {ok:false, why:"Cần đăng ký hồ sơ học viên trước."};
  if(!bookAllowed(b).ok) return {ok:false, why:"Sách ngoài lớp của bạn - cần ADMIN phê duyệt."};
  const pr=(S.progress[b.code]||{}).lessons||{};
  const done=def.scope.filter(i=>{ const ma=pack.lessons[i].ma; return pr[ma]&&pr[ma].done; }).length;
  const need=Math.ceil(def.scope.length*EXAM_CFG.needDonePct);
  const prior=myExams(b.code)[def.id];
  if(done<need) return {ok:false, why:`Cần hoàn thành ${need}/${def.scope.length} bài trong phạm vi (bạn mới xong ${done}). Học tiếp rồi quay lại nhé!`, done, need};
  if(S.settings.requireVerify && !isVerified() && !prior) return {ok:false, why:"Thi chính thức cần xác thực độ tuổi.", verify:true};
  return {ok:true, official:!prior, done, need};
}
/* ================= GIAO DIỆN HUB KIỂM TRA ================= */
let EX=null; // bài thi đang làm
function viewExams(v){
  const code=S.examBook||null;
  const books=CATALOG.filter(b=>b.level!=="Mầm non").filter(b=>S.isAdmin||!myGrade()||bookAllowed(b).ok);
  v.innerHTML=`
  <div class="sec" style="margin-top:26px"><div><div class="eyebrow">Phân hệ 4 · Kiểm tra - Đánh giá</div><h2 style="margin:0">Trung tâm Kiểm tra</h2></div></div>
  <div class="card" style="margin-bottom:16px"><div class="note" style="line-height:1.8">
    <b>Cách đánh giá của KK-EDU (khoa học đo lường giáo dục):</b> đề được rút tự động từ ngân hàng câu hỏi của chính các bài đã học theo <b>ma trận chuẩn</b> - phủ đều các chương, ~65% câu nhớ-hiểu và ~35% câu vận dụng (thang Bloom). Mỗi học sinh nhận một đề trộn riêng nhưng cùng độ khó. <b>Lần làm đầu là điểm chính thức</b>, các lần sau là luyện tập. Điều kiện dự thi: hoàn thành ≥70% số bài trong phạm vi. Nộp bài mới xem được đáp án, giải thích và gợi ý ôn lại đúng bài - đúng phút.<br>
    <b>Điểm năm học</b> = 30% quá trình + 20% trung bình cuối chương + 20% giữa năm + 30% cuối năm · Đạt ≥70 · Giỏi ≥80 · Xuất sắc ≥90. Tiểu học chỉ ghi nhận Hoàn thành / Hoàn thành tốt, không xếp hạng. Mầm non quan sát, không thi.
  </div></div>
  <div class="controls"><select id="exBook"><option value="">- Chọn sách để xem các kỳ kiểm tra -</option>
    ${books.map(b=>`<option value="${esc(b.code)}" ${code===b.code?"selected":""}>${esc(b.subject)} · ${esc(b.grade||b.level)}</option>`).join("")}
  </select></div>
  <div id="exList"><div class="note">Chọn một cuốn sách của lớp bạn để bắt đầu.</div></div>`;
  $("#exBook").onchange=e=>{ S.examBook=e.target.value||null; if(S.examBook) renderExamList($("#exList"), S.examBook); };
  if(code) renderExamList($("#exList"), code);
}
async function renderExamList(el, code){
  const b=CATALOG.find(x=>x.code===code); if(!b) return;
  el.innerHTML=`<div class="note">Đang nạp ngân hàng câu hỏi...</div>`;
  const pack=await loadPack(code);
  if(!pack){ el.innerHTML=`<div class="note">Không nạp được gói bài học.</div>`; return; }
  await loadMyExams(code);
  const defs=examDefs(b,pack), mine=myExams(code);
  const bank=examBank(pack, pack.lessons.map((_,i)=>i));
  el.innerHTML=`
  <div class="note" style="margin-bottom:10px">Ngân hàng của sách: <b>${bank.length}</b> câu hỏi từ ${pack.lessons.length} bài · ${[...new Set(bank.map(x=>x.ch))].length} chương</div>
  <div class="grid bk">
  ${defs.map(d=>{
    const g=examGate(b,pack,d); const prior=mine[d.id];
    const mins=Math.round(d.nQ*EXAM_CFG.secPerQ/60);
    const badge = prior ? `<span class="badge ok">Chính thức: ${prior.score10} điểm (${prior.pct}%)</span>`
      : (g.ok?'<span class="badge gold">Sẵn sàng - lần 1 tính điểm chính thức</span>':'<span class="badge">🔒 Chưa đủ điều kiện</span>');
    return `<div class="card">

function startExam(b, pack, def){
  const g=examGate(b,pack,def);
  if(!g.ok&&!S.isAdmin){ toast(g.why); return; }
  const official=g.official!==false && !myExams(b.code)[def.id];
  const bank=examBank(pack, def.scope);
  const seed=seedHash((S.uid||"guest")+"|"+b.code+"|"+def.id+"|"+(official?1:Date.now()));
  const qs=draftExam(bank, def.nQ, seed);
  if(!qs.length){ toast("Chưa có ngân hàng câu hỏi cho phạm vi này"); return; }
  EX={b, pack, def, qs, cur:0, official, t0:Date.now(), left:qs.length*EXAM_CFG.secPerQ, timer:null, tabSwitch:0, submitted:false};
  modal(`<div class="eyebrow">${official?"THI CHÍNH THỨC - lần làm đầu tiên tính điểm":"Luyện tập - không thay điểm chính thức"}</div>

    <li>Đề trộn riêng cho bạn theo ma trận chuẩn (phủ đều chương, 65% nhớ-hiểu, 35% vận dụng).</li>

function exAnswerValue(Q){
  const q=Q.it.q;
  if(Q.ans===null||Q.ans===undefined) return null;
  if(q.loai==="mcq") return Q.map[Q.ans];                         // về chỉ số gốc
  if(q.loai==="order") return (Q.ans||[]).map(ix=>Q.map[ix]);     // về thứ tự gốc
  return Q.ans;
}
async function submitExam(auto){
  if(!EX||EX.submitted) return; EX.submitted=true;
  clearInterval(EX.timer); document.removeEventListener("visibilitychange",exVis); window.onbeforeunload=null;
  const det=EX.qs.map(Q=>{ const val=exAnswerValue(Q); const ok=val===null?false:checkAnswer(Q.it.q, val);
    return {id:Q.it.q.id||("q"+Q.n), ma:Q.it.ma, li:Q.it.li, ch:Q.it.ch, bloom:Q.it.bloom, ok, val, t:Q.it.q.quay_lai_t||Q.it.q.t||0}; });
  const correct=det.filter(d=>d.ok).length, total=det.length;
  const pct=Math.round(correct/total*100), score10=Math.round(correct/total*100)/10;
  const agg=(key)=>{ const m={}; det.forEach(d=>{ const k=d[key]; m[k]=m[k]||{ok:0,n:0}; m[k].n++; if(d.ok)m[k].ok++; }); return m; };
  const res={defId:EX.def.id, kind:EX.def.kind, ten:EX.def.ten, at:new Date().toISOString(),
    score10, pct, correct, total, byCh:agg("ch"), byBloom:agg("bloom"),
    durationSec:Math.round((Date.now()-EX.t0)/1000), tabSwitch:EX.tabSwitch, official:EX.official, auto:!!auto,
    wrong:det.filter(d=>!d.ok).map(d=>({ma:d.ma, li:d.li, id:d.id, t:d.t}))};
  if(EX.official) await saveExamResult(EX.b.code, EX.def.id, res);
  const b=EX.b, pack=EX.pack, def=EX.def, qsSnapshot=EX.qs, detSnap=det;
  EX=null;
  showExamResult(b, pack, def, res, false, qsSnapshot, detSnap);
  if(auto) toast("Hết giờ - hệ thống đã tự nộp bài");
}

/* ================= HỌC BẠ (tổng kết năm theo sách) ================= */
function transcriptOf(code, pack){
  const b=CATALOG.find(x=>x.code===code); if(!b) return null;
  const pr=(S.progress[code]||{}).lessons||{};
  const sc=Object.values(pr).filter(l=>l.total!=null).map(l=>l.total*100);
  const qt=sc.length?Math.round(sc.reduce((a,x)=>a+x,0)/sc.length):null;
  const mine=myExams(code);
  const chs=Object.keys(mine).filter(k=>k.startsWith("CH-"));
  const chAvg=chs.length?Math.round(chs.reduce((a,k)=>a+mine[k].pct,0)/chs.length):null;
  const gn=mine["GN"]?mine["GN"].pct:null, cn=mine["CN"]?mine["CN"].pct:null;
  let nam=null;
  if(qt!=null&&cn!=null) nam=Math.round(0.3*qt+0.2*(chAvg!=null?chAvg:qt)+0.2*(gn!=null?gn:qt)+0.3*cn);
  return {b, qt, chAvg, gn, cn, nam, label:nam!=null?gradeLabel(nam,b.level):null, nCh:chs.length};
}

    closeModal(); toast("Cảm ơn bạn - khảo sát đã được ghi nhận!");

}
/* ================= QUẢN TRỊ: BẢNG ĐIỂM + KHẢO SÁT ================= */
async function adminResults(el){
  const books=CATALOG.filter(b=>b.level!=="Mầm non");
  el.innerHTML=`<div class="controls"><select id="kqBook"><option value="">- Chọn sách để xem bảng điểm & khảo sát -</option>
    ${books.map(b=>`<option value="${esc(b.code)}">${esc(b.subject)} · ${esc(b.grade||b.level)}</option>`).join("")}</select></div>
  <div id="kqBody"><div class="note">Chọn sách. Dữ liệu lấy từ kho riêng của từng học viên có tài khoản (Khách lưu trên máy họ, không hiện ở đây).</div></div>`;
  $("#kqBook").onchange=async e=>{
    const code=e.target.value; if(!code) return;
    const body=$("#kqBody"); body.innerHTML=`<div class="note">Đang tổng hợp từng học viên...</div>`;
    let profiles=[];
    try{ const pf=await S.caps.db.collection("profiles").limit(200).get();
      profiles=pf.docs.filter(d=>d.exists).map(d=>Object.assign({uid:d.id}, d.data())); }catch(e2){}
    const rows=[], svs=[];
    for(const p of profiles){
      try{
        const col=await S.caps.db.collection("data/users/"+p.uid).limit(300).get();
        const exams={}; let sv=null; const prog={};
        col.docs.forEach(d=>{ if(!d.exists) return;
          if(d.id==="survey-"+code) sv=d.data();
          else if(d.id.startsWith("exam-"+code+"-")) exams[d.id.slice(("exam-"+code+"-").length)]=d.data();
          else if(d.id==="prog-"+code) Object.assign(prog, (d.data()||{}).lessons||{}); });
        const sc=Object.values(prog).filter(l=>l.total!=null).map(l=>l.total*100);
        const qt=sc.length?Math.round(sc.reduce((a,x)=>a+x,0)/sc.length):null;
        const chK=Object.keys(exams).filter(k=>k.startsWith("CH-"));
        const chAvg=chK.length?Math.round(chK.reduce((a,k)=>a+exams[k].pct,0)/chK.length):null;
        const gn=exams["GN"]?exams["GN"].pct:null, cn=exams["CN"]?exams["CN"].pct:null;
        const nam=(qt!=null&&cn!=null)?Math.round(0.3*qt+0.2*(chAvg??qt)+0.2*(gn??qt)+0.3*cn):null;
        if(qt!=null||cn!=null||gn!=null||chAvg!=null) rows.push({name:p.name||p.uid.slice(0,8), ns:p.namSinh||"", qt, chAvg, gn, cn, nam});
        if(sv) svs.push(sv);
      }catch(e3){}
    }
    const bb=CATALOG.find(x=>x.code===code);
    const avg=i=>{ const xs=svs.map(s=>s.a&&s.a[i]).filter(Boolean); return xs.length?(xs.reduce((a,b2)=>a+b2,0)/xs.length).toFixed(1):"-"; };
    body.innerHTML=`
    <div class="sec" style="margin-top:0"><h2 style="margin:0">Bảng điểm · ${esc(bb.subject)} (${rows.length} học viên có dữ liệu)</h2>
      ${rows.length?'<button class="more" id="kqCsv">Sao chép CSV</button>':""}</div>
    <div class="tbwrap"><table class="tb"><thead><tr><th>Học viên</th><th>Năm sinh</th><th>Quá trình</th><th>TB C.chương</th><th>Giữa năm</th><th>Cuối năm</th><th>Điểm năm</th><th>Xếp loại</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.ns)}</td><td>${r.qt??"-"}</td><td>${r.chAvg??"-"}</td><td>${r.gn??"-"}</td><td>${r.cn??"-"}</td>
      <td><b>${r.nam??"-"}</b></td><td>${r.nam!=null?gradeLabel(r.nam,bb.level):"-"}</td></tr>`).join("")||`<tr><td colspan="8" class="note">Chưa học viên nào có điểm ở sách này.</td></tr>`}
    </tbody></table></div>
    <div class="sec"><h2 style="margin:0">Khảo sát khóa học (${svs.length} phản hồi)</h2></div>
    ${svs.length?`<div class="card">${SURVEY_QS.map((q,i)=>`<div class="rowline" style="justify-content:space-between;margin:6px 0"><span class="note">${i+1}. ${esc(q)}</span><b>${avg(i)}/5</b></div>`).join("")}
      ${svs.filter(s=>s.gopY).length?`<h3 style="margin:14px 0 6px">Góp ý</h3>${svs.filter(s=>s.gopY).map(s=>`<div class="note" style="margin:5px 0">· "${esc(s.gopY)}" - ${esc(s.name||"học viên")}</div>`).join("")}`:""}
    </div>`:`<div class="note">Chưa có phản hồi khảo sát.</div>`}`;
    const cb=$("#kqCsv"); if(cb) cb.onclick=()=>{ copyText("Ten,NamSinh,QuaTrinh,TBCuoiChuong,GiuaNam,CuoiNam,DiemNam,XepLoai\n"+rows.map(r=>[r.name,r.ns,r.qt??"",r.chAvg??"",r.gn??"",r.cn??"",r.nam??"",r.nam!=null?gradeLabel(r.nam,bb.level):""].join(",")).join("\n")); };
  };
}

/* ---------- Tìm câu trả lời: chấm điểm trùng từ khóa ---------- */
function cbMatch(qRaw){
  const q=cbNorm(qRaw); if(!q) return {best:null, score:0, alts:[]};
  const qw=q.split(" ").filter(w=>w.length>1);
  const scored=cbKB().map(item=>{
    const kw=cbNorm(item.k+" "+(item.chip||""));
    let s=0;
    qw.forEach(w=>{ if(kw.includes(w)) s+=(w.length>=4?2:1); });
    // cụm 2 từ liền nhau trúng thì thưởng
    for(let i=0;i<qw.length-1;i++){ if(kw.includes(qw[i]+" "+qw[i+1])) s+=3; }
    return {item, s};
  }).sort((a,b)=>b.s-a.s);
  return {best:scored[0].s>=3?scored[0].item:null, score:scored[0].s, alts:scored.slice(0,3).filter(x=>x.s>=2).map(x=>x.item)};
}

let CB={open:false, booted:false, busy:false};
function cbMount(){
  if($("#cbFab")) return;

    <div class="cbBody" id="cbBody"></div>

  document.body.appendChild(panel);
  fab.onclick=()=>{ panel.hidden=!panel.hidden; CB.open=!panel.hidden; if(CB.open&&!CB.booted){ cbHello(); CB.booted=true; } if(CB.open) setTimeout(()=>{const i=$("#cbInput"); if(i&&window.innerWidth>700) i.focus();},50); };
