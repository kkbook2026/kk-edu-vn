}
function cbPush(who, html, acts){
  const b=$("#cbBody"); if(!b) return;
  const row=document.createElement("div");
  row.className="cbMsg "+(who==="u"?"u":"b");
  row.innerHTML=`<div class="bub">${html}${acts&&acts.length?`<div class="cbActs">${acts.map((a,i)=>`<button data-cba="${i}">${esc(a.l)}</button>`).join("")}</div>`:""}</div>`;
  b.appendChild(row);
  if(acts&&acts.length){ row.querySelectorAll("[data-cba]").forEach(x=>x.onclick=()=>cbAct(acts[Number(x.dataset.cba)])); }
  b.scrollTop=b.scrollHeight;
}
function cbAct(a){
  if(a.go){
    if(a.go.startsWith("hoc_")){ const p=a.go.split("_"); go({name:"hoc", code:p[1], i:Number(p[2]||0)}); }
    else go({name:a.go});
    const pn=$("#cbPanel"); if(pn&&window.innerWidth<700){ pn.hidden=true; CB.open=false; }
  } else if(a.fn==="reg"&&typeof openRegister==="function"){ if(S.mode==="firebase") openRegister(); else toast("Đăng ký thành viên dùng trên www.kk-edu.com"); }
  else if(a.fn==="login"&&typeof openLogin==="function"){ if(S.mode==="firebase") openLogin(); else toast("Đăng nhập dùng trên www.kk-edu.com"); }
  else if(a.fn==="profile") openProfileForm();
  else if(a.fn==="verify") openVerifyGate();
}
function cbChipsRender(){
  const host=$("#cbChips"); if(!host) return;
  const chips=cbKB().filter(x=>x.chip);
  host.innerHTML=chips.map(c=>`<button data-cbc="${esc(c.id)}">${esc(c.chip)}</button>`).join("");

function cbHello(){
  const name=S.profile&&S.profile.name?S.profile.name.split(" ").slice(-1)[0]:null;
  cbPush("b", `Chào ${name?("bạn <b>"+esc(name)+"</b>"):("bạn")} 👋 Mình là Trợ lý KK-EDU. Bạn đang là <b>${cbRole()}</b>${cbMyLop()?`, lớp <b>${esc(cbMyLop())}</b>`:""}. Bấm một chủ đề bên dưới, hoặc gõ câu hỏi bất kỳ về cách dùng web - mình nắm rõ từng chức năng!`);

}
async function cbAsk(){
  const inp=$("#cbInput"); const q=(inp.value||"").trim(); if(!q||CB.busy) return;
  inp.value=""; cbPush("u", esc(q));
  const m=cbMatch(q);
  if(m.best){
    cbPush("b", m.best.a, m.best.acts);
    const others=m.alts.filter(x=>x.id!==m.best.id);
    if(others.length) cbPush("b", `Có thể bạn cũng quan tâm:`, others.slice(0,2).map(o=>({l:o.chip||o.id, go:null, fn:null, _kb:o.id})).map(o=>({l:(cbKB().find(k=>k.id===o._kb).chip||"Xem thêm"), _kb:o._kb})).map(o=>({l:o.l, kb:o._kb})));
    return;
  }
  // Tầng 3: AI (chỉ bản chạy trong hạ tầng Claude có caps.sample)
  if(S.caps.sample){
    CB.busy=true; cbPush("b", `<i>Đang suy nghĩ...</i>`);
    try{
      const ctx=cbKB().map(k=>"- "+(k.chip||k.id)+": "+k.a.replace(/<[^>]+>/g,"")).join("\n").slice(0,6000);
      const r=await S.caps.sample.text({
        prompt:"Bạn là trợ lý hỗ trợ của website học tập KK-EDU (www.kk-edu.com). CHỈ trả lời dựa trên thông tin dưới đây, bằng tiếng Việt, tối đa 4 câu, thân thiện. Không biết thì nói không chắc và chỉ tới mục Giới thiệu hoặc liên hệ quản trị.\n\nTHÔNG TIN:\n"+ctx+"\n\nCÂU HỎI: "+q, maxTokens:300 });
      const b=$("#cbBody"); if(b&&b.lastChild) b.lastChild.remove();
      cbPush("b", esc((r&&(r.text||r.completion||String(r)))||"").trim()||"Mình chưa chắc về câu này.", [{l:"Trang Giới thiệu", go:"about"}]);
    }catch(e){ const b=$("#cbBody"); if(b&&b.lastChild) b.lastChild.remove(); cbFallback(m); }
    CB.busy=false;
    return;
  }
  cbFallback(m);
}
function cbFallback(m){
  const sug=(m&&m.alts||[]).filter(x=>x.chip).slice(0,3);
  cbPush("b", `Mình chưa chắc đã hiểu đúng câu này 🤔 Bạn thử diễn đạt ngắn gọn hơn (VD: "quên mật khẩu", "điều kiện dự thi"), xem trang <b>Giới thiệu</b> có đủ hướng dẫn chi tiết, hoặc chọn chủ đề gần nhất:`,
    sug.length?sug.map(s=>({l:s.chip, kb:s.id})):[{l:"Trang Giới thiệu", go:"about"},{l:"Liên hệ hỗ trợ", kb:"lienhe"}]);
}
// nút hành động loại "kb": mở lại câu trả lời trong kho
const _cbActOrig=cbAct;
cbAct=function(a){
  if(a&&a.kb){ const item=cbKB().find(k=>k.id===a.kb); if(item){ cbPush("u", esc(item.chip||a.l)); cbPush("b", item.a, item.acts); } return; }
  _cbActOrig(a);
};
// Gắn bot khi trang sẵn sàng
try{ cbMount(); }catch(e){}
</script>

<script>
"use strict";
/* ================= VIETQR (EMVCo / NAPAS 247) ================= */
function tlv(id,v){ return id+String(v.length).padStart(2,"0")+v; }
function crc16(s){ // CRC-16/CCITT-FALSE
  let crc=0xFFFF;
  for(let i=0;i<s.length;i++){ crc^=s.charCodeAt(i)<<8;
    for(let j=0;j<8;j++){ crc = (crc&0x8000)?((crc<<1)^0x1021):(crc<<1); crc&=0xFFFF; } }
  return crc.toString(16).toUpperCase().padStart(4,"0");
}
function vietqrPayload(bin, acct, amount, content){
  const merchant = tlv("38", tlv("00","A000000727") + tlv("01", tlv("00",bin)+tlv("01",acct)) + tlv("02","QRIBFTTA"));
  let p = tlv("00","01") + tlv("01","12") + merchant + tlv("53","704");
  if(amount>0) p += tlv("54", String(Math.round(amount)));
  p += tlv("58","VN");
  if(content) p += tlv("62", tlv("08", content.slice(0,25)));
  p += "6304";
  return p + crc16(p);
}
function renderQR(el, payload){
  el.innerHTML="";
  try{
    if(typeof qrcode==="function"){ const q=qrcode(0,"M"); q.addData(payload); q.make(); el.innerHTML=q.createSvgTag({cellSize:4,margin:2}); const sv=el.querySelector("svg"); if(sv){sv.style.width="220px";sv.style.height="220px";} return true; }
  }catch(e){}
  try{ if(typeof QRCode==="function"){ new QRCode(el,{text:payload,width:220,height:220,correctLevel:QRCode.CorrectLevel.M}); return true; } }catch(e){}
  return false;
}
function genOrderCode(){ const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s="KKE"; for(let i=0;i<7;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }

/* ================= MUA KHÓA HỌC ================= */
function openBuy(code){
  const b=CATALOG.find(x=>x.code===code); if(!b) return;
  const pr=priceOf(code), stg=S.settings;
  if(!pr){ toast("Sách này miễn phí"); return; }

    modal(`<h3>Mở khóa "${esc(b.subject)}"</h3><p class="note">Kênh thanh toán tự động chưa được cấu hình. Vui lòng liên hệ trực tiếp để mở khóa:</p>
    <div class="kv">${stg.contactEmail?`<span>Email</span><b>${esc(stg.contactEmail)}</b>`:""}${stg.contactZalo?`<span>Zalo</span><b>${esc(stg.contactZalo)}</b>`:""}</div>
    <div class="mrow"><button class="btn ghost" id="mClose">Đóng</button></div>`);
    $("#mClose").onclick=closeModal; return;
  }
  const oc=genOrderCode();
  const payload=vietqrPayload(stg.bankBin, stg.bankAccount, pr, oc+" "+code);
  modal(`<div class="eyebrow">Thanh toán VietQR · Napas 247</div><h3>${esc(b.subject)} · ${fmtMoney(pr)}</h3>
  <div style="display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start">
    <div class="qrbox"><div id="qrEl"></div><span style="font-size:.78rem;color:#555">Quét bằng app ngân hàng bất kỳ</span></div>
    <div>
      <div class="kv">
        <span>Chủ tài khoản</span><b>${esc(stg.bankHolder||"")}</b>
        <span>Số tài khoản</span><b>${esc(stg.bankAccount)} <button class="btn ghost sm" id="cpA">copy</button></b>
        <span>Số tiền</span><b>${fmtMoney(pr)}</b>
        <span>Nội dung CK</span><b>${oc} ${esc(code)} <button class="btn ghost sm" id="cpC">copy</button></b>
      </div>
      <div class="note" style="margin-top:10px">Giữ <b>đúng nội dung chuyển khoản</b> để hệ thống đối soát. Sau khi quản trị viên xác nhận (thường trong vài phút đến vài giờ), sách sẽ tự mở khóa${S.uid?"":" - hoặc bạn sẽ nhận mã mở khóa qua email/Zalo"}.</div>
    </div>
  </div>
  <div class="mrow">
    <button class="btn pri" id="paidBtn">Tôi đã chuyển khoản</button>
    <button class="btn ghost sm" id="mClose">Đóng</button>
  </div><div id="payFb"></div>`);
  const ok=renderQR($("#qrEl"), payload);
  if(!ok) $("#qrEl").innerHTML=`<div class="note">Không tải được bộ vẽ QR - hãy chuyển khoản thủ công theo thông tin bên cạnh.</div>`;
  $("#mClose").onclick=closeModal;
  $("#cpA").onclick=()=>copyText(stg.bankAccount);
  $("#cpC").onclick=()=>copyText(oc+" "+code);
  $("#paidBtn").onclick=async()=>{
    const rec={orderCode:oc, book:code, amount:pr, status:"cho_xac_nhan", at:new Date().toISOString(), name:S.name};
    let saved=false;
    if(S.caps.db&&S.uid){
      try{
        const ref=S.caps.db.doc("orders/"+S.uid);
        const cur=await ref.get(); const data=cur.exists?JSON.parse(JSON.stringify(cur.data())):{orders:{}};
        data.orders=data.orders||{}; data.orders[oc]=rec; data.name=S.name; data.updated=rec.at;
        await ref.set(data); saved=true;
      }catch(e){}
    }
    LS.set("myorders", Object.assign(LS.get("myorders",{}), {[oc]:rec}));
    $("#payFb").innerHTML=`<div class="feedback good"><b>Đã ghi nhận đơn ${oc}.</b> ${saved?"Quản trị viên sẽ thấy đơn của bạn và xác nhận - sách tự mở khóa khi được duyệt.":"Hãy nhắn mã đơn "+oc+" qua "+esc(S.settings.contactZalo||S.settings.contactEmail||"kênh liên hệ")+" để được cấp mã mở khóa."}</div>`;
  };
}
function openUnlockCode(code){
  modal(`<h3>Nhập mã mở khóa</h3><div class="fld"><label>Mã do quản trị viên cấp cho sách ${esc(code)}</label><input id="ulIn" autocomplete="off"></div>
  <div class="mrow"><button class="btn pri" id="ulOk">Mở khóa</button><button class="btn ghost" id="ulNo">Hủy</button></div><div id="ulFb"></div>`);
  $("#ulNo").onclick=closeModal;
  $("#ulOk").onclick=async()=>{
    const v=$("#ulIn").value.trim().toUpperCase(); if(!v) return;
    const c=S.content[code]||{};
    const h=await sha256(v);
    if(!(c.codeHash && h===c.codeHash)){ $("#ulFb").innerHTML=`<div class="feedback bad">Mã không đúng. Kiểm tra lại hoặc liên hệ quản trị viên.</div>`; return; }
    if(S.mode==="firebase"){
      // Máy chủ (Firestore rules) tự băm lại mã và chỉ cấp quyền đọc gói khi đúng - không thể giả mạo từ trình duyệt
      if(!S.uid){ closeModal(); toast("Hãy đăng nhập trước, rồi nhập lại mã."); openLogin(); return; }
      try{ await S.caps.db.doc("data/users/"+S.uid+"/unlock-"+code).set({book:code, code:v, at:new Date().toISOString()}); }
      catch(e){ $("#ulFb").innerHTML=`<div class="feedback bad">Máy chủ chưa xác nhận mã (${esc(e&&e.code||"lỗi mạng")}). Thử lại sau.</div>`; return; }
      S.enroll[S.uid+"-"+code]=true; delete S.goiCache[code];
    } else {
      S.enroll["local-"+code]=true;
      const un=LS.get("unlock",{}); un[code]=true; LS.set("unlock",un);
    }
    closeModal(); toast("Đã mở khóa! Chúc bạn học tốt."); go({name:"book",code});
  };
}

            :`<button class="btn sm pri" data-ver="${i}">✓ Xác thực</button>`}</td></tr>`;}).join("")||`<tr><td colspan="5" class="note">Chưa có thành viên nào. Hồ sơ của Khách (không đăng nhập) lưu trên máy họ - cấp Mã xác thực bên dưới cho họ.</td></tr>`}
  </tbody></table></div>
  <div class="note" style="margin-top:8px">Bấm "✓ Xác thực" sau khi đã kiểm tra giấy tờ (giấy khai sinh / thẻ HS - xem qua Zalo/Email, không lưu ảnh lên hệ thống). Xác thực gắn với đúng năm sinh đã khai - học viên đổi năm sinh sẽ tự mất xác thực.</div>

  <div class="sec"><h2 style="margin:0">Mã xác thực cho Khách (${vcodes.length})</h2></div>
  <div class="card" style="max-width:720px">
    <div class="note" style="margin-bottom:10px">Dành cho người học KHÔNG đăng nhập: bạn kiểm tra giấy tờ qua Zalo/Email rồi cấp 1 mã. Họ nhập mã ở cổng xác thực - mã chỉ khớp đúng năm sinh đã cấp. Hệ thống chỉ lưu bản băm SHA-256, mã gốc hiện 1 lần duy nhất cho bạn.</div>
    <div class="formgrid">
      <div class="fld"><label>Năm sinh người được cấp</label><input id="vcYear" inputmode="numeric" placeholder="VD: 2014"></div>
      <div class="fld"><label>Ghi chú (tên/Zalo để bạn nhớ)</label><input id="vcNote" placeholder="VD: Nguyễn Văn A - 09xx"></div>
    </div>
    <div class="mrow"><button class="btn pri" id="vcGen">Tạo mã xác thực</button></div>
    <div id="vcOut"></div>
    ${vcodes.length?`<div class="tbwrap" style="margin-top:12px"><table class="tb"><thead><tr><th>Ghi chú</th><th>Năm sinh</th><th>Cấp lúc</th><th></th></tr></thead><tbody>
    ${vcodes.map((c,i)=>`<tr><td>${esc(c.note||"-")}</td><td>${esc(c.namSinh||"")}</td><td class="note">${c.at?fmtDate(c.at):""}</td>
      <td><button class="btn sm ghost" data-vcdel="${i}">Thu hồi</button></td></tr>`).join("")}
    </tbody></table></div>`:""}
  </div>
  ${done.length?`<div class="note" style="margin-top:10px">Đã xử lý: ${done.map(r=>esc(r.name)+" - "+esc(r.key)+" ("+(r.status==="approved"?"duyệt":"từ chối")+")").join(" · ")}</div>`:""}`;
  const act=async(r, approve)=>{
    try{
      if(approve){
        const gref=S.caps.db.doc("grants/"+r.uid);
        const cur=await gref.get(); const data=cur.exists?JSON.parse(JSON.stringify(cur.data())):{grades:[]};
        data.grades=data.grades||[]; const val=r.grade||r.level;
        if(!data.grades.includes(val)) data.grades.push(val);
        data.by=S.name; data.at=new Date().toISOString();
        await gref.set(data); S.grants[r.uid]=data;
      }
      try{ // cập nhật trạng thái yêu cầu (chỉ chủ trang ghi được doc của người khác)
        const rref=S.caps.db.doc("reqs/"+r.uid);
        const cur=await rref.get();
        if(cur.exists){ const data=JSON.parse(JSON.stringify(cur.data()));
          if(data.items&&data.items[r.key]) data.items[r.key].status=approve?"approved":"denied";
          await rref.set(data); }
      }catch(e){}
      toast(approve?"Đã phê duyệt - học viên vào học được ngay":"Đã từ chối yêu cầu");
      adminStudents(el);
    }catch(e){ toast("Lỗi: "+(e&&e.code||"không ghi được")); }
  };
  el.querySelectorAll("button[data-ok]").forEach(b=>b.onclick=()=>act(pending[Number(b.dataset.ok)], true));
  el.querySelectorAll("button[data-no]").forEach(b=>b.onclick=()=>act(pending[Number(b.dataset.no)], false));
  // Xác thực độ tuổi hồ sơ đăng nhập
  const setVer=async(p, on)=>{
    try{
      const gref=S.caps.db.doc("grants/"+p.uid);
      const cur=await gref.get(); const data=cur.exists?JSON.parse(JSON.stringify(cur.data())):{};
      if(on){ data.verified=true; data.verifiedYear=Number(p.namSinh); data.verifiedAt=new Date().toISOString(); data.verifiedBy=S.name; }
      else{ data.verified=false; delete data.verifiedYear; }
      await gref.set(data); S.grants[p.uid]=data;
      toast(on?"Đã xác thực độ tuổi cho "+(p.name||"học viên"):"Đã hủy xác thực");
      adminStudents(el);
    }catch(e){ toast("Lỗi: "+(e&&e.code||"không ghi được")); }
  };
  el.querySelectorAll("button[data-ver]").forEach(b=>b.onclick=()=>setVer(profiles[Number(b.dataset.ver)], true));
  el.querySelectorAll("button[data-unver]").forEach(b=>b.onclick=()=>setVer(profiles[Number(b.dataset.unver)], false));
  const mbApply=()=>{ const q=($("#mbQ").value||"").toLowerCase().trim(), f=$("#mbF").value; let n=0;
    el.querySelectorAll("#mbTb tbody tr[data-q]").forEach(tr=>{ const ok=(!q||tr.dataset.q.includes(q))&&(!f||tr.dataset.f.split(" ").includes(f)); tr.style.display=ok?"":"none"; if(ok) n++; }); };
  if($("#mbQ")){ $("#mbQ").oninput=mbApply; $("#mbF").onchange=mbApply;
    $("#mbCsv").onclick=()=>{ const rows=[["uid","ten","email","nam_sinh","lop","phu_huynh","xac_thuc","duoc_duyet_them","sach_dang_hoc","dang_nhap_bang","tao_luc","gan_nhat"]];
      profiles.forEach(p=>{ const g=p.namSinh?gradeFromBirthYear(p.namSinh):null, gr=S.grants[p.uid]||{}; rows.push([p.uid,p.name||p.mname||"",p.email||"",p.namSinh||"",g?g.label:"",p.guardian?"co":"",(gr.verified&&Number(gr.verifiedYear)===Number(p.namSinh))?"co":"",(gr.grades||[]).join(" | "),(p.books||[]).join(" | "),p.provider||"",p.created||p.pat||"",p.last||p.plast||""]); });
      const csv="\ufeff"+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\r\n");
      const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download="kk-edu-thanh-vien-"+new Date().toISOString().slice(0,10)+".csv"; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }; }
  // Tạo / thu hồi Mã xác thực cho Khách
  const genBtn=$("#vcGen");
  if(genBtn) genBtn.onclick=async()=>{
    const y=Number($("#vcYear").value), note=$("#vcNote").value.trim();
    const nowY=new Date().getFullYear();
    if(!y||y<nowY-100||y>nowY-2){ toast("Năm sinh không hợp lệ"); return; }
    if(!S.caps.db){ toast("Không có kết nối dữ liệu"); return; }
    const AB="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let suf="";
    const rnd=new Uint32Array(6); crypto.getRandomValues(rnd);
    for(let i=0;i<6;i++) suf+=AB[rnd[i]%AB.length];
    const code="KX-"+y+"-"+suf;
    try{
      const h=await sha256(code), now=new Date().toISOString();
      await S.caps.db.doc("vcodes/"+h).set({namSinh:y, at:now}); // công khai chỉ có năm sinh + thời điểm
      try{ await S.caps.db.doc("vnotes/"+h).set({note:note, by:S.name, at:now}); }catch(e){} // ghi chú để riêng, chỉ admin đọc
      $("#vcOut").innerHTML=`<div class="feedback good" style="margin-top:10px">Mã xác thực (hiện 1 lần - gửi ngay cho người học):
      <div style="font-size:22px;font-weight:800;letter-spacing:2px;margin-top:6px">${esc(code)} <button class="btn sm" onclick="copyText('${esc(code)}')">Sao chép</button></div></div>`;
      toast("Đã tạo mã - nhớ sao chép trước khi rời trang");
    }catch(e){ toast("Lỗi tạo mã: "+(e&&e.code||"")); }
  };
  el.querySelectorAll("button[data-vcdel]").forEach(b=>b.onclick=async()=>{
    const c=vcodes[Number(b.dataset.vcdel)];
    try{
      const ref=S.caps.db.doc("vcodes/"+c.hash);
      if(typeof ref.delete==="function"){ await ref.delete(); try{ await S.caps.db.doc("vnotes/"+c.hash).delete(); }catch(e2){} }
      else{ await ref.set({revoked:true, at:c.at||"", namSinh:c.namSinh}); }
      toast("Đã thu hồi mã"); adminStudents(el);
    }catch(e){
      try{ await S.caps.db.doc("vcodes/"+c.hash).set({revoked:true, at:c.at||"", namSinh:c.namSinh}); toast("Đã thu hồi mã"); adminStudents(el); }
      catch(e2){ toast("Lỗi: "+(e2&&e2.code||"")); }
    }
  });
}

/* ================= KK-BÁO CÁO: bảng chất lượng dạy-học (dữ liệu ẩn danh, mỗi học sinh một bản ghi/bài) ================= */
async function adminQuality(el){
  el.innerHTML=`<div class="note">Đang tải dữ liệu chất lượng...</div>`;
  let recs=[];
  if(S.caps.db){ try{ const q=await S.caps.db.collection("qrec").limit(3000).get(); recs=q.docs.filter(d=>d.exists).map(d=>d.data()); }catch(e){ el.innerHTML=`<div class="card"><b>Chưa đọc được dữ liệu chất lượng.</b><div class="note">Cần thêm quy tắc Firestore cho bộ sưu tập <code>qrec</code> (xem tab Hướng dẫn). Lỗi: ${esc(e&&e.code||"")}</div></div>`; return; } }
  if(!recs.length){ el.innerHTML=`<div class="card"><b>Chưa có dữ liệu.</b><div class="note">Khi học sinh học và nộp bài, mỗi bài học sẽ có một bản ghi ẩn danh (không tên, không email) để tính các chỉ số bên dưới.</div></div>`; return; }
  const by={}; recs.forEach(r=>{ if(r&&r.ma) (by[r.ma]=by[r.ma]||[]).push(r); });
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null; const pc=x=>x==null?"-":Math.round(x*100)+"%"; const f1=x=>x==null?"-":(Math.round(x*10)/10);
  const rows=Object.keys(by).map(ma=>{
    const R=by[ma], n=R.length;
    const tot=avg(R.filter(r=>r.total!=null).map(r=>r.total)), comp=R.filter(r=>r.done).length/n;
    const sv=k=>avg(R.map(r=>r.sv&&r.sv[k]).filter(x=>x!=null));
    const k1=sv("K1"),k2=sv("K2"),k4=sv("K4"),k5=sv("K5");
    const fast=(()=>{ const a=R.map(r=>r.sv&&r.sv.K3).filter(x=>x!=null); return a.length?a.filter(x=>x===2).length/a.length:null; })();
    const rep=avg(R.map(r=>r.rep||0)), tOn=avg(R.map(r=>r.tOn||0));
    const norm=x=>x==null?null:(x-1)/4;
    const parts=[[.30,tot],[.20,comp],[.20,norm(k4)],[.15,norm(k1)],[.15,norm(k5)]].filter(x=>x[1]!=null);
    const idx=parts.length?Math.round(100*parts.reduce((a,x)=>a+x[0]*x[1],0)/parts.reduce((a,x)=>a+x[0],0)):null;
    const flags=[]; if(n<5) flags.push("Mẫu nhỏ (<5 HS): chỉ tham khảo");
    if(n>=5){ if(tot!=null&&tot<.6) flags.push("Điểm TB thấp"); if(comp<.5) flags.push("Ít người hoàn thành"); if(k4!=null&&k4<3) flags.push("HS chưa hiểu rõ bài"); if(k2!=null&&k2>=4) flags.push("HS thấy quá khó"); if(rep>3) flags.push("Nghe lại nhiều: kiểm tra đoạn giảng"); }
    const miss={}; R.forEach(r=>(r.miss||[]).forEach(m=>miss[m]=(miss[m]||0)+1));
    return {ma,n,tot,comp,k1,k2,k4,k5,fast,rep,tOn,idx,flags,miss,R};
  }).sort((a,b)=>(a.idx==null?999:a.idx)-(b.idx==null?999:b.idx));
  el.innerHTML=`<div class="card"><div class="eyebrow">Chất lượng dạy-học · ${recs.length} bản ghi · ${rows.length} bài</div>
  <div class="note">Chỉ số chất lượng bài /100 = 30% điểm TB + 20% tỉ lệ hoàn thành + 20% "hiểu rõ bài" + 15% hứng thú + 15% tự tin (khảo sát học sinh). Sắp xếp bài cần cải thiện lên đầu. Bấm một dòng để xem phân tích từng câu hỏi.</div>
  <div style="overflow:auto"><table class="qtab"><tr><th>Bài</th><th>HS</th><th>Chỉ số</th><th>Điểm TB</th><th>Hoàn thành</th><th>Hiểu bài</th><th>Khó</th><th>Nghe lại/HS</th><th>Phút/HS</th><th>Cảnh báo</th></tr>
  ${rows.map(r=>`<tr class="qrow" data-ma="${esc(r.ma)}" style="cursor:pointer"><td>${esc(r.ma)}</td><td>${r.n}</td><td><b>${r.idx==null?"-":r.idx}</b></td><td>${pc(r.tot)}</td><td>${pc(r.comp)}</td><td>${f1(r.k4)}</td><td>${f1(r.k2)}</td><td>${f1(r.rep)}</td><td>${r.tOn?Math.round(r.tOn/60):"-"}</td><td class="${r.flags.length?"qflag":"qok"}">${r.flags.length?esc(r.flags.join("; ")):"Tốt"}</td></tr>`).join("")}</table></div></div>
  <div id="qDetail"></div>`;
  el.querySelectorAll(".qrow").forEach(tr=>tr.onclick=()=>qDetail(rows.find(r=>r.ma===tr.dataset.ma)));
  async function qDetail(r){
    const box=$("#qDetail"); box.innerHTML=`<div class="note" style="margin-top:12px">Đang phân tích ${esc(r.ma)}...</div>`;
    let L=null; try{ const pk=await loadPack(r.ma.split(".")[0]); L=pk&&pk.lessons.find(x=>x.ma===r.ma); }catch(e){}
    const qs=L?[...(L.tuong_tac.diem||[]),...(L.tuong_tac.ngan_hang||[])].filter(q=>["mcq","tf","num","order"].includes(q.loai)):[];
    const stu=r.R.map(x=>{ const v=Object.values(x.items||{}); return {x, sum:v.reduce((a,b)=>a+b[0],0), n:v.length}; });
    const item=qs.map(q=>{ const S2=r.R.filter(x=>x.items&&x.items[q.id]); const n=S2.length; if(!n) return null;
      const p=S2.reduce((a,x)=>a+x.items[q.id][0],0)/n, hint=S2.filter(x=>x.items[q.id][2]>0).length/n;
      let d=null; if(n>=8){ const xs=S2.map(x=>x.items[q.id][0]), ys=S2.map(x=>{ const v=Object.entries(x.items).filter(e=>e[0]!==q.id); return v.length?v.reduce((a,e)=>a+e[1][0],0)/v.length:0; });
        const mx=avg(xs),my=avg(ys); const sx=Math.sqrt(avg(xs.map(a=>(a-mx)**2))),sy=Math.sqrt(avg(ys.map(a=>(a-my)**2))); d=(sx&&sy)?avg(xs.map((a,i)=>(a-mx)*(ys[i]-my)))/(sx*sy):null; }
      const picks={}; S2.forEach(x=>{ const pk=x.items[q.id][3]; if(pk!=="") picks[pk]=(picks[pk]||0)+1; });
      const top=Object.entries(picks).sort((a,b)=>b[1]-a[1])[0];
      const fl=[]; if(n>=5){ if(p<.3) fl.push("Quá khó hoặc đáp án/đề có vấn đề"); if(p>.95) fl.push("Quá dễ, ít phân hóa"); if(d!=null&&d<.1) fl.push("Phân hóa kém/âm: xem lại đề"); if(q.p_ky_vong!=null&&Math.abs(p-q.p_ky_vong)>.25) fl.push("Lệch kỳ vọng "+pc(q.p_ky_vong)); if(hint>.6) fl.push("Dùng gợi ý nhiều"); }
      return {q,n,p,hint,d,top,fl}; }).filter(Boolean);
    box.innerHTML=`<div class="card" style="margin-top:12px"><div class="eyebrow">${esc(r.ma)} · ${esc(L?L.bai:"")}</div>
    <div class="note">Hứng thú ${f1(r.k1)}/5 · Khó ${f1(r.k2)}/5 · Hiểu bài ${f1(r.k4)}/5 · Tự tin ${f1(r.k5)}/5 · Chọn "quá nhanh": ${pc(r.fast)}</div>
    ${Object.keys(r.miss).length?`<div style="margin:8px 0"><b>Từ khóa HS hỏi nhưng bài chưa có:</b> ${Object.entries(r.miss).sort((a,b)=>b[1]-a[1]).slice(0,10).map(e=>esc(e[0])+" ("+e[1]+")").join(", ")}<div class="note">Gợi ý bổ sung vào bài giảng.</div></div>`:""}
    <div style="overflow:auto"><table class="qtab"><tr><th>Câu</th><th>Bloom</th><th>n</th><th>Tỉ lệ đúng</th><th>Kỳ vọng</th><th>Phân hóa</th><th>Dùng gợi ý</th><th>Cảnh báo</th></tr>
    ${item.map(i=>`<tr><td>${esc((i.q.hoi||"").slice(0,70))}</td><td>${esc(TG.BL[i.q.bloom]||i.q.bloom||"")}</td><td>${i.n}</td><td>${pc(i.p)}</td><td>${pc(i.q.p_ky_vong)}</td><td>${i.d==null?"-":f1(i.d*100)/100}</td><td>${pc(i.hint)}</td><td class="${i.fl.length?"qflag":"qok"}">${i.fl.length?esc(i.fl.join("; ")):"Tốt"}</td></tr>`).join("")||`<tr><td colspan="8">Chưa có dữ liệu câu hỏi.</td></tr>`}</table></div>
    <div class="note" style="margin-top:6px">Phân hóa = hệ số tương quan giữa đúng câu này và kết quả các câu còn lại (cần ≥8 HS; &lt;0,1 là kém). Dữ liệu ẩn danh; số liệu là chỉ báo để rà soát, không thay thế đánh giá của giáo viên.</div></div>`;
  }
}

/* Cân đối logo chữ: "KK-EDU" và "MÔ HÌNH GIÁO DỤC SỐ THỬ NGHIỆM" cùng bề rộng (giãn chữ theo kích thước thật sau khi tải font) */
function fitBrand(){
  const t=document.querySelector(".brandtx b"), m=document.querySelector(".brandtx small"); if(!t||!m) return;
  t.style.fontSize=t.style.letterSpacing=t.style.marginRight=m.style.letterSpacing=m.style.marginRight="";
  const lsM=parseFloat(getComputedStyle(m).letterSpacing)||0, f0=parseFloat(getComputedStyle(t).fontSize)||40;
  const w=e=>e.getBoundingClientRect().width;
  let tInk=w(t); const mInk=w(m)-lsM, nt=t.textContent.length, nm=m.textContent.length;
  if(!tInk||!mInk||nt<2||nm<2) return;
  /* phóng cỡ chữ KK-EDU (tối đa 1,9 lần) cho gần bằng dòng phụ, phần lệch còn lại bù bằng giãn chữ nhẹ */
  const f=Math.min(f0*1.9, f0*mInk/tInk*0.95); if(f>f0){ t.style.fontSize=f+"px"; tInk=w(t); }
  if(mInk>tInk){ const x=(mInk-tInk)/(nt-1); t.style.letterSpacing=x+"px"; t.style.marginRight=(-x)+"px"; m.style.marginRight=(-lsM)+"px"; }
  else { const x=lsM+(tInk-mInk)/(nm-1); m.style.letterSpacing=x+"px"; m.style.marginRight=(-x)+"px"; }
}
try{ (document.fonts&&document.fonts.ready||Promise.resolve()).then(fitBrand); }catch(e){}
fitBrand(); window.addEventListener("resize",()=>{ clearTimeout(window._fbT); window._fbT=setTimeout(fitBrand,120); });
